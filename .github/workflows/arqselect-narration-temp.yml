name: ARQSELECT Temporary Narration Build
on:
  push:
    branches:
      - ale999999-narracao-temp

jobs:
  build-narration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install neural TTS
        run: pip install --disable-pip-version-check edge-tts
      - name: Generate Brazilian Portuguese narration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tts_out
          edge-tts --voice pt-BR-AntonioNeural --rate="-5%" --pitch="-4Hz" --volume="+8%" --text "Todo grande projeto começa com pessoas." --write-media tts_out/01_abertura.mp3
          edge-tts --voice pt-BR-AntonioNeural --rate="+0%" --pitch="-4Hz" --volume="+8%" --text "Mais conexões para tirar suas ideias do papel." --write-media tts_out/02_arquitetos.mp3
          edge-tts --voice pt-BR-AntonioNeural --rate="-2%" --pitch="-4Hz" --volume="+8%" --text "Mais visibilidade para sua marca." --write-media tts_out/03_marca.mp3
          edge-tts --voice pt-BR-AntonioNeural --rate="+0%" --pitch="-4Hz" --volume="+8%" --text "Mais oportunidades de negócio." --write-media tts_out/04_negocio.mp3
          edge-tts --voice pt-BR-AntonioNeural --rate="-5%" --pitch="-4Hz" --volume="+8%" --text "Mais visibilidade." --write-media tts_out/05_visibilidade.mp3
          edge-tts --voice pt-BR-AntonioNeural --rate="+0%" --pitch="-4Hz" --volume="+8%" --text "Mais oportunidades de serviços." --write-media tts_out/06_servicos.mp3
          edge-tts --voice pt-BR-AntonioNeural --rate="+15%" --pitch="-3Hz" --volume="+10%" --text "Você projeta. Nós conectamos. Arquitetos, fornecedores e prestadores: conectem-se à ARQSELECT." --write-media tts_out/07_cta.mp3
      - name: Upload narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: arqselect-narration
          path: tts_out/*.mp3
          if-no-files-found: error
          retention-days: 1
