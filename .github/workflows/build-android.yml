name: Build ARQSELECT Servicos Android
on:
  push:
    branches: [arqselect-servicos-android]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK and AAB
        working-directory: android
        run: gradle :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: arqselect-servicos-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
