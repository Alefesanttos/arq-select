name: ARQSELECT Core Smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**.html"
      - "**.js"
      - "**.css"
      - "tests/**"
      - "docs/ARQSELECT_*"
      - ".github/workflows/core-smoke.yml"
  push:
    branches: [main]
    paths:
      - "**.html"
      - "**.js"
      - "**.css"
      - "tests/**"
      - "docs/ARQSELECT_*"
      - ".github/workflows/core-smoke.yml"
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate core
        run: node tests/core-smoke.mjs
