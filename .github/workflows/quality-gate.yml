name: ARQSELECT Quality Gate
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - 'VERSION.txt'
      - 'scripts/quality-gate.mjs'
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run ARQSELECT quality gate
        run: node scripts/quality-gate.mjs