<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARQSELECT | Meu perfil</title><style>
:root{--gold:#d4af37;--gold2:#f2d675;--silver:#c8c8c8;--bg:#050505;--panel:#101010;--line:#292929;--muted:#999}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:radial-gradient(circle at 80% 0%,#d4af3715,transparent 30%),var(--bg);color:#fff}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:18px 5vw;border-bottom:1px solid #d4af3725;background:#070707eF;backdrop-filter:blur(16px)}.brand{font-size:23px;font-weight:950;letter-spacing:.12em}.brand span{color:var(--gold)}.role{font-size:10px;color:var(--gold2);letter-spacing:.18em;text-transform:uppercase;margin-top:4px}.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.nav a,.nav button{color:#ddd;text-decoration:none;border:1px solid #ffffff18;background:#111;padding:10px 13px;border-radius:10px;font-weight:800;font-size:12px;cursor:pointer}.nav a.active{border-color:#d4af3770;color:#f2d675}.wrap{width:min(1200px,90vw);margin:auto;padding:40px 0 90px}.hero{min-height:280px;border:1px solid #d4af3725;border-radius:28px;padding:42px;background:linear-gradient(100deg,#000d,#0008),url('https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1800&q=85') center/cover;display:flex;align-items:flex-end}.eyebrow{color:var(--gold2);font-size:11px;font-weight:950;letter-spacing:.2em;text-transform:uppercase}h1{font-size:clamp(38px,6vw,66px);line-height:.96;margin:10px 0 14px}h2{font-size:28px;margin:0 0 10px}p{color:#c7c7c7;line-height:1.75}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}.card{background:linear-gradient(#151515,#0c0c0c);border:1px solid #d4af3725;border-radius:20px;padding:24px}.card h3{margin:10px 0 8px}.icon{font-size:25px;color:var(--gold)}.section{margin-top:24px;background:#0d0d0d;border:1px solid #ffffff10;border-radius:24px;padding:28px}.faq{border-top:1px solid #ffffff12;padding:18px 0}.faq:first-child{border-top:0}.faq b{color:#f2d675}.steps{counter-reset:s;display:grid;gap:12px}.step{padding:16px;border-radius:14px;background:#121212;border:1px solid #ffffff0d}.step:before{counter-increment:s;content:counter(s);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#080808;font-weight:950;margin-right:10px}.notice{padding:16px;border-left:3px solid var(--gold);background:#15130b;border-radius:10px;color:#ddd}.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:0;border-radius:11px;padding:12px 16px;font-weight:900;cursor:pointer}.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#080808}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:13px;border-bottom:1px solid #ffffff0e;text-align:left;font-size:12px}th{color:#f2d675;text-transform:uppercase;letter-spacing:.08em;font-size:10px}.table-wrap{overflow:auto}select,input,textarea{width:100%;background:#080808;color:#fff;border:1px solid #292929;border-radius:10px;padding:12px;outline:none}select:focus,input:focus,textarea:focus{border-color:var(--gold)}label{display:block;color:#ccc;font-size:11px;font-weight:900;margin:13px 0 6px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.toast{position:fixed;right:20px;bottom:20px;background:#171717;border:1px solid #d4af3750;color:#fff;padding:14px 16px;border-radius:12px;display:none;z-index:50}@media(max-width:800px){.top{align-items:flex-start;gap:15px}.grid,.formgrid{grid-template-columns:1fr}.hero{padding:28px;min-height:300px}.nav{display:none}}
</style></head><body><header class="top"><div><div class="brand">ARQ<span>SELECT</span></div><div class="role">Portal Arquiteto</div></div><nav class="nav"><a href="ARQSELECT_DASHBOARD_ARQUITETO.html">Dashboard</a><a href="ARQSELECT_ARQUITETO_PROJETOS.html">Projetos</a><a href="ARQSELECT_ARQUITETO_SOLICITAR.html">Solicitar orçamento</a><a href="ARQSELECT_ARQUITETO_GUIA.html">Central de ajuda</a><a href="ARQSELECT_ARQUITETO_PERFIL.html">Meu perfil</a><button onclick="sair()">Sair</button></nav></header><main class="wrap"><section class="hero"><div><div class="eyebrow">ARQSELECT Premium</div><h1>Seu perfil profissional</h1><p>Ambiente profissional com navegação clara, informações úteis e recursos pensados para o seu dia a dia.</p></div></section><section class="section"><div class="eyebrow">Minha conta</div><h2>Perfil profissional</h2><div id="perfil"><p>Carregando...</p></div></section></main><div id="toast" class="toast"></div><script>const API='https://script.google.com/macros/s/AKfycbz_jLzNa87U_himraaCczzqGpQdq63AyIVogQ9-YGnqXuQYl3OSJfV4E7xYfPdnv8-d/exec';const TOKEN=localStorage.getItem('ARQSELECT_PORTAL_TOKEN');const TYPE=localStorage.getItem('ARQSELECT_PORTAL_TIPO');function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function api(p){const u=new URL(API);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u,{cache:'no-store'});return r.json()}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}async function sair(){try{await api({acao:'portal_logout',token:TOKEN})}catch(e){}localStorage.removeItem('ARQSELECT_PORTAL_TOKEN');localStorage.removeItem('ARQSELECT_PORTAL_TIPO');location.href=TYPE==='FORNECEDOR'?'ARQSELECT_LOGIN_FORNECEDOR.html':'ARQSELECT_LOGIN_ARQUITETO.html'}
if(!TOKEN)location.href='ARQSELECT_LOGIN_ARQUITETO.html';api({acao:'portal_sessao',token:TOKEN}).then(d=>{if(!d.sucesso)return location.href='ARQSELECT_LOGIN_ARQUITETO.html';const p=d.perfil;document.getElementById('perfil').innerHTML=`<div class="grid"><div class="card"><div class="muted">Nome</div><h3>${esc(p.nome)}</h3></div><div class="card"><div class="muted">Escritório</div><h3>${esc(p.empresa||'—')}</h3></div><div class="card"><div class="muted">E-mail</div><h3>${esc(p.email)}</h3></div><div class="card"><div class="muted">ID de acesso</div><h3>${esc(p.id)}</h3></div></div>`})</script></body></html>
