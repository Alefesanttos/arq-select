<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARQSELECT | Meus produtos</title><style>:root{--bg:#f5f6f8;--card:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--dark:#0b1220;--gold:#c8a457}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}.top{background:var(--dark);color:#fff;padding:16px 5vw;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:950;letter-spacing:.13em}.brand span{color:#dfc471}.nav{display:flex;gap:8px;flex-wrap:wrap}a{color:inherit;text-decoration:none}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer}.gold{background:linear-gradient(135deg,#e3ca88,#b88e35);color:#16120a}.light{background:#eef2f6;color:#101828}.wrap{width:min(1200px,92vw);margin:auto;padding:30px 0 70px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.muted{color:var(--muted);line-height:1.6}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:6px}label{font-size:12px;font-weight:800;display:block;margin-bottom:12px}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:16px;z-index:20}.modal.open{display:grid}.box{background:#fff;width:min(800px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:22px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.product{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.thumb{height:170px;border-radius:12px;background:#eef1f4;display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}@media(max-width:900px){.products,.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.products,.grid{grid-template-columns:1fr}}</style><style>
/* ARQSELECT PREMIUM DESIGN SYSTEM 3.0 */
:root{
  --arq-bg:#070707;--arq-bg2:#0d0d0d;--arq-card:rgba(19,19,19,.88);--arq-card2:#121212;
  --arq-gold:#d4af37;--arq-gold2:#f3df8a;--arq-text:#f8f7f2;--arq-muted:#a9a49a;
  --arq-line:rgba(212,175,55,.18);--arq-shadow:0 18px 55px rgba(0,0,0,.42);
}
html{scroll-behavior:smooth}body{background:
 radial-gradient(circle at 85% -10%,rgba(212,175,55,.10),transparent 30%),
 radial-gradient(circle at 10% 100%,rgba(212,175,55,.055),transparent 28%),var(--arq-bg)!important;color:var(--arq-text)!important;}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 95%);}
.top,.nav,.sidebar,.header,.toolbar{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);}
.top{background:rgba(7,7,7,.82)!important;border-bottom:1px solid var(--arq-line)!important;box-shadow:0 8px 35px rgba(0,0,0,.22)}
.brand,.logo{color:var(--arq-text)!important;text-shadow:0 2px 18px rgba(212,175,55,.16)}
.brand span,.logo span{color:var(--arq-gold2)!important}
.card,.panel,.box,.item,.list,.product,.profile,.stat,.metric,.tile,.table-wrap,.composer,.conversation,.sidebar,.modal,.sheet,.empty,.notice{background:linear-gradient(145deg,rgba(24,24,24,.95),rgba(12,12,12,.92))!important;border:1px solid rgba(255,255,255,.08)!important;box-shadow:var(--arq-shadow)!important;color:var(--arq-text)!important}
.card:hover,.product:hover,.profile:hover,.tile:hover,.item:hover{transform:translateY(-2px);border-color:rgba(212,175,55,.30)!important;box-shadow:0 22px 65px rgba(0,0,0,.48),0 0 0 1px rgba(212,175,55,.04) inset!important;transition:.22s ease}
input,textarea,select{background:rgba(255,255,255,.055)!important;color:#fff!important;border:1px solid rgba(255,255,255,.11)!important;border-radius:12px!important;outline:none!important}
input:focus,textarea:focus,select:focus{border-color:rgba(212,175,55,.75)!important;box-shadow:0 0 0 3px rgba(212,175,55,.10)!important}

.btn.gold,.gold,.primary,.btn-primary,.cta{background:linear-gradient(135deg,#f0d87a,#b78a2f)!important;color:#16120a!important;box-shadow:0 10px 30px rgba(212,175,55,.18)!important;border:1px solid rgba(255,255,255,.15)!important}
.btn.gold:hover,.gold:hover,.primary:hover,.btn-primary:hover,.cta:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn,.light,.secondary{background:rgba(255,255,255,.065)!important;color:#f3f1ea!important;border:1px solid rgba(255,255,255,.10)!important}
.muted,.meta,.small,.ey,.role,.hint{color:var(--arq-muted)!important}
.badge,.tag,.pill{background:rgba(212,175,55,.12)!important;color:var(--arq-gold2)!important;border:1px solid rgba(212,175,55,.2)!important}
hr{border-color:rgba(255,255,255,.08)!important}
table{color:#f6f4ed!important}th{color:var(--arq-gold2)!important;background:rgba(212,175,55,.06)!important}td{border-color:rgba(255,255,255,.07)!important}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:#080808}::-webkit-scrollbar-thumb{background:linear-gradient(#8d6a25,#d4af37);border-radius:10px}
@media(max-width:700px){.top{padding:13px 16px!important}.nav{gap:6px!important}.btn{padding:10px 12px!important}.card,.panel,.box{border-radius:16px!important}}

.arq-whatsapp span{white-space:nowrap}@media(max-width:520px){.arq-whatsapp{width:56px;height:56px;justify-content:center;padding:0;right:15px;bottom:15px}.arq-whatsapp span{display:none}.arq-whatsapp svg{width:27px;height:27px}}
</style></head><body><header class="top"><div><div class="brand">ARQ<span>SELECT</span></div><div style="color:#cbd5e1;font-size:12px">Catálogo do fornecedor</div></div><nav class="nav"><a class="btn light" href="ARQSELECT_DASHBOARD_FORNECEDOR.html">Dashboard</a><a class="btn light" href="ARQSELECT_FORNECEDOR_PROJETOS.html">Oportunidades</a><a class="btn light" href="chat.html">Chat</a><a class="btn gold" href="explorar.html">Explorar</a></nav></header><main class="wrap"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><div class="muted">CATÁLOGO PROFISSIONAL</div><h1>Meus produtos</h1></div><button class="btn gold" onclick="newProduct()">+ Cadastrar produto</button></div></div><div id="list" class="products"><div class="card">Carregando...</div></div></main><div id="modal" class="modal"><div class="box"><button class="btn light" style="float:right" onclick="closeM()">Fechar</button><h2 id="title">Novo produto</h2><form id="form"><div class="grid"><label>Nome<input name="nome" required></label><label>SKU<input name="sku"></label><label>Categoria<input name="categoria"></label><label>Subcategoria<input name="subcategoria"></label><label>Marca<input name="marca"></label><label>Modelo<input name="modelo"></label><label>Preço / faixa<input name="preco"></label><label>Unidade<input name="unidade"></label><label>Material<input name="material"></label><label>Acabamento<input name="acabamento"></label><label>Cor<input name="cor"></label><label>Dimensões<input name="dimensoes"></label><label>Prazo<input name="prazo"></label><label>Região<input name="regiao"></label></div><label>Descrição<textarea name="descricao" rows="4"></textarea></label><label>Características técnicas<textarea name="caracteristicas" rows="4"></textarea></label><label>Link do produto<input name="link"></label><label>Fotos / vídeos <input id="media" type="file" multiple accept="image/*,video/mp4,video/webm"></label><button class="btn gold" type="submit">Salvar e enviar para aprovação</button><div id="msg" class="muted" style="margin-top:10px"></div></form></div></div><script>const API='https://script.google.com/macros/s/AKfycbz_jLzNa87U_himraaCczzqGpQdq63AyIVogQ9-YGnqXuQYl3OSJfV4E7xYfPdnv8-d/exec',TOKEN=localStorage.getItem('ARQSELECT_PORTAL_TOKEN');const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function get(p){const u=new URL(API);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));return fetch(u,{cache:'no-store'}).then(r=>r.json())}async function post(p){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)}).then(r=>r.json())}function newProduct(){$('title').textContent='Novo produto';$('form').reset();$('modal').classList.add('open')}function closeM(){$('modal').classList.remove('open')}async function load(){const j=await get({acao:'portal_produtos',token:TOKEN});const d=j.produtos||[];$('list').innerHTML=d.length?d.map(p=>{const img=String(p.FOTOS||'').split(/\n/)[0];return `<article class="product"><div class="thumb">${img?`<img src="${esc(img)}">`:'<span class="muted">Sem foto</span>'}</div><h3>${esc(p.NOME)}</h3><div class="muted">${esc(p.CATEGORIA||'')} · ${esc(p.MARCA||'')}</div><div style="margin-top:7px"><b>Status:</b> ${esc(p.STATUS||'')}</div></article>`}).join(''):'<div class="card">Você ainda não cadastrou produtos.</div>'}async function dataUrl(f){return new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)})}$('form').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.currentTarget).entries());$('msg').textContent='Salvando...';const j=await post({acao:'portal_produto_criar',token:TOKEN,...o});if(!j.sucesso){$('msg').textContent=j.mensagem||'Falha';return}const files=[...$('media').files].slice(0,5);if(files.length){const ar=[];for(const f of files){if(f.size>5*1024*1024)continue;ar.push({nome:f.name,mimeType:f.type,base64:await dataUrl(f)})}if(ar.length)await post({acao:'portal_produto_upload',token:TOKEN,produtoId:j.id,arquivos:ar})}$('msg').textContent='✓ Produto salvo e enviado para análise.';e.currentTarget.reset();setTimeout(()=>{closeM();load()},700)};load();</script></body></html>
