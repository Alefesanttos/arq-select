<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARQSELECT | Solicitações</title><style>body{margin:0;font-family:Inter,system-ui;background:#f5f6f8;color:#101828}.top{background:#0b1220;color:#fff;padding:16px 5vw;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}.brand{font-weight:950;letter-spacing:.12em}.brand span{color:#d8bd70}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:11px 14px;border:0;border-radius:10px;font-weight:800;cursor:pointer;text-decoration:none}.light{background:#eef2f6;color:#101828}.gold{background:linear-gradient(135deg,#e3ca88,#b88e35);color:#17130c}.wrap{width:min(1200px,92vw);margin:auto;padding:28px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 12px 35px #1018280b}.muted{color:#667085;line-height:1.6}input,textarea{width:100%;box-sizing:border-box;border:1px solid #e4e7ec;border-radius:10px;padding:11px;margin-top:6px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div><div class="brand">ARQ<span>SELECT</span></div><div style="font-size:11px;color:#cbd5e1">Solicitações de orçamento</div></div><nav class="nav"><a class="btn light" href="ARQSELECT_DASHBOARD_FORNECEDOR.html">Dashboard</a><a class="btn light" href="ARQSELECT_FORNECEDOR_PRODUTOS.html">Produtos</a><a class="btn light" href="chat.html">Chat</a></nav></header><main class="wrap"><h1>Solicitações recebidas</h1><div class="muted">Responda com preço, prazo e condições. A proposta fica registrada no ARQSELECT.</div><div id="list" style="margin-top:18px">Carregando...</div></main><script>const API='https://script.google.com/macros/s/AKfycbz_jLzNa87U_himraaCczzqGpQdq63AyIVogQ9-YGnqXuQYl3OSJfV4E7xYfPdnv8-d/exec',TOKEN=localStorage.getItem('ARQSELECT_PORTAL_TOKEN');const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function get(p){const u=new URL(API);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));return fetch(u,{cache:'no-store'}).then(r=>r.json())}async function post(p){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)}).then(r=>r.json())}async function load(){const j=await get({acao:'portal_solicitacoes_fornecedor',token:TOKEN});const d=j.solicitacoes||[];$('list').innerHTML=d.length?d.map(x=>`<article class="card"><div><b>${esc(x.PRODUTO||'Produto')}</b> · <span class="muted">${esc(x.ID)}</span></div><div class="muted">Projeto: ${esc(x['PROJETO ID']||'—')} · Quantidade: ${esc(x.QUANTIDADE||'—')} · Medida: ${esc(x.MEDIDA||'—')}<br>Especificação: ${esc(x.ESPECIFICACAO||'—')} · Prazo: ${esc(x.PRAZO||'—')}</div><div class="grid" style="margin-top:12px"><div><label>Valor unitário<input id="u-${esc(x.ID)}"></label></div><div><label>Frete<input id="f-${esc(x.ID)}"></label></div><div><label>Prazo<input id="p-${esc(x.ID)}"></label></div><div><label>Validade<input id="v-${esc(x.ID)}"></label></div></div><label>Condições / observações<textarea id="o-${esc(x.ID)}" rows="3"></textarea></label><button class="btn gold" onclick="send('${esc(x.ID)}','${esc(x['PROJETO ID']||'')}','${esc(x['ARQUITETO ID']||'')}','${esc(x['ARQUITETO E-MAIL']||'')}','${esc(x.PRODUTO||'')}','${esc(x.QUANTIDADE||'')}')">Enviar proposta</button></article>`).join(''):'<div class="card">Nenhuma solicitação recebida ainda.</div>'}async function send(id,proj,aid,aemail,prod,qtd){const unit=Number($('u-'+id).value.replace(',','.'))||0;const total=unit*(Number(qtd)||0);const d=await post({acao:'portal_proposta_enviar',token:TOKEN,solicitacaoId:id,projetoId:proj,arquitetoId:aid,arquitetoEmail:aemail,produto:prod,quantidade:qtd,valorUnitario:unit,valorTotal:total,frete:$('f-'+id).value,prazo:$('p-'+id).value,validade:$('v-'+id).value,condicao:$('o-'+id).value,observacoes:$('o-'+id).value});alert(d.mensagem||'Proposta enviada.');if(d.sucesso)load()}load();</script></body></html>
