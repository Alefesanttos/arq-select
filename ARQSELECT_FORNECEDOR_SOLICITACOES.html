<style id="arqselect-unified-theme">

}

body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);background-size:28px 28px;opacity:.55}
h1,h2,h3,h4,h5,h6,p,div,span,li,label,td,th{color:inherit}
a{color:inherit}
.top,.nav,.header,.navbar{background:rgba(7,7,7,.86)!important;border-color:var(--arq-line)!important;backdrop-filter:blur(16px)!important}
.btn,.button,.actions button,.nav a{border:1px solid var(--arq-line)!important;background:rgba(255,255,255,.055)!important;color:var(--arq-text)!important;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.btn.gold,.gold,.primary,.btn-primary,.cta-button{background:linear-gradient(135deg,var(--arq-gold-2),var(--arq-gold))!important;color:#151108!important;border-color:rgba(255,255,255,.18)!important}
.btn:hover,.button:hover,.nav a:hover{border-color:rgba(212,175,55,.42)!important;transform:translateY(-1px)}
.card,.panel,.box,.tile,.item,.list,.table,.table-wrap,.product,.profile,.stat,.metric,.notice,.sheet,.conversation,.sidebar,.hero-card,.feature-card,.post,.opportunity,.profile-card,.request-card,.proposal-card{background:linear-gradient(145deg,rgba(22,22,22,.97),rgba(12,12,12,.94))!important;border:1px solid var(--arq-line)!important;color:var(--arq-text)!important;box-shadow:var(--arq-shadow)!important}
.card h1,.card h2,.card h3,.card h4,.panel h1,.panel h2,.panel h3,.panel h4,.box h1,.box h2,.box h3,.box h4,.product h3{color:var(--arq-text)!important}
.muted,.meta,.small,.hint,.ey,.subtle,.role{color:var(--arq-muted)!important}
input,select,textarea{background:rgba(255,255,255,.055)!important;color:var(--arq-text)!important;border:1px solid rgba(255,255,255,.12)!important}
input::placeholder,textarea::placeholder{color:#7e796f!important}
input:focus,select:focus,textarea:focus{border-color:rgba(212,175,55,.75)!important;box-shadow:0 0 0 3px rgba(212,175,55,.11)!important}
.badge,.tag,.pill{background:rgba(212,175,55,.12)!important;color:var(--arq-gold-2)!important;border:1px solid rgba(212,175,55,.22)!important}
table{color:var(--arq-text)!important}th{background:rgba(212,175,55,.07)!important;color:var(--arq-gold-2)!important}td{border-color:var(--arq-line)!important}
.modal{background:rgba(0,0,0,.72)!important}
.modalbox,.modal-content,.dialog,.dropdown,.menu,.sheet-content{background:linear-gradient(145deg,#1b1b1b,#0e0e0e)!important;color:var(--arq-text)!important;border:1px solid var(--arq-line)!important;box-shadow:0 30px 80px rgba(0,0,0,.55)!important}
.close{background:rgba(255,255,255,.08)!important;color:var(--arq-text)!important;border:1px solid var(--arq-line)!important}
.messages,.chat-window,.chat-body,.chat-main{background:#0b0b0b!important;color:var(--arq-text)!important}
.composer,.composer-wrap,.chat-head{background:#111!important;color:var(--arq-text)!important;border-color:var(--arq-line)!important}
.conv,.conversation-item{background:rgba(255,255,255,.035)!important;color:var(--arq-text)!important;border-color:var(--arq-line)!important}
.bubble{background:#1a1a1a!important;color:var(--arq-text)!important;border:1px solid var(--arq-line)!important}
.bubble.mine{background:linear-gradient(135deg,#2b2415,#3b3019)!important;color:#fff9df!important;border-color:rgba(212,175,55,.24)!important}
.empty,.empty-card{color:var(--arq-muted)!important}
.thumb{background:#111!important}
img{border-radius:inherit}
hr{border-color:var(--arq-line)!important}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:#080808}::-webkit-scrollbar-thumb{background:linear-gradient(#8e6b28,#d4af37);border-radius:10px}

.arq-whatsapp,.wa-float{background:linear-gradient(135deg,#25d366,#16a34a)!important;color:#fff!important;border:1px solid rgba(255,255,255,.16)!important;text-decoration:none!important;box-shadow:0 18px 42px rgba(0,0,0,.36),0 0 0 1px rgba(255,255,255,.10) inset!important}

<script id="arq4-theme-boot">(()=>{const p=localStorage.getItem("ARQSELECT_THEME")||"dark";document.documentElement.dataset.theme=p==="auto"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):p})();</script><meta name="theme-color" content="#070807"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="arqselect-4.css"><link rel="stylesheet" href="arq-premium.css?v=5.6.1"><link rel="stylesheet" href="arq-ui-5.css?v=5.6.1"><link rel="stylesheet" href="arq-polish.css?v=5.6.1"><link rel="stylesheet" href="arq-premium-tech.css?v=5.6.1">
</head><body><header class="top"><div><div class="brand">ARQ<span>SELECT</span></div><div style="font-size:11px;color:#cbd5e1">Solicitações de orçamento</div></div><nav class="nav"><a class="btn light" href="ARQSELECT_DASHBOARD_FORNECEDOR.html">Dashboard</a><a class="btn light" href="ARQSELECT_FORNECEDOR_PRODUTOS.html">Produtos</a><a class="btn light" href="chat.html">Chat</a></nav></header><main class="wrap"><h1>Solicitações recebidas</h1><div class="muted">Responda com preço, prazo e condições. A proposta fica registrada no ARQSELECT.</div><div id="list" style="margin-top:18px">Carregando...</div></main><script>const API=(window.ARQSELECT_API_URL||window.ARQSELECT_CONFIG.apiUrl),TOKEN=localStorage.getItem('ARQSELECT_PORTAL_TOKEN');const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function get(p){const u=new URL(API);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));return fetch(u,{cache:'no-store'}).then(r=>r.json())}async function post(p){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)}).then(r=>r.json())}async function load(){const j=await get({acao:'portal_solicitacoes_fornecedor',token:TOKEN});const d=j.solicitacoes||[];$('list').innerHTML=d.length?d.map(x=>`<article class="card"><div><b>${esc(x.PRODUTO||'Produto')}</b> · <span class="muted">${esc(x.ID)}</span></div><div class="muted">Projeto: ${esc(x['PROJETO ID']||'—')} · Quantidade: ${esc(x.QUANTIDADE||'—')} · Medida: ${esc(x.MEDIDA||'—')}<br>Especificação: ${esc(x.ESPECIFICACAO||'—')} · Prazo: ${esc(x.PRAZO||'—')}</div><div class="grid" style="margin-top:12px"><div><label>Valor unitário<input id="u-${esc(x.ID)}"></label></div><div><label>Frete<input id="f-${esc(x.ID)}"></label></div><div><label>Prazo<input id="p-${esc(x.ID)}"></label></div><div><label>Validade<input id="v-${esc(x.ID)}"></label></div></div><label>Condições / observações<textarea id="o-${esc(x.ID)}" rows="3"></textarea></label><button class="btn gold" onclick="send('${esc(x.ID)}','${esc(x['PROJETO ID']||'')}','${esc(x['ARQUITETO ID']||'')}','${esc(x['ARQUITETO E-MAIL']||'')}','${esc(x.PRODUTO||'')}','${esc(x.QUANTIDADE||'')}')">Enviar proposta</button></article>`).join(''):'<div class="card">Nenhuma solicitação recebida ainda.</div>'}async function send(id,proj,aid,aemail,prod,qtd){const unit=Number($('u-'+id).value.replace(',','.'))||0;const total=unit*(Number(qtd)||0);const d=await post({acao:'portal_proposta_enviar',token:TOKEN,solicitacaoId:id,projetoId:proj,arquitetoId:aid,arquitetoEmail:aemail,produto:prod,quantidade:qtd,valorUnitario:unit,valorTotal:total,frete:$('f-'+id).value,prazo:$('p-'+id).value,validade:$('v-'+id).value,condicao:$('o-'+id).value,observacoes:$('o-'+id).value});alert(d.mensagem||'Proposta enviada.');if(d.sucesso)load()}load();</script><script src="arqselect-4.js"></script><script src="arq-premium.js?v=5.6.1"></script><script src="arq-premium-tech.js?v=5.6.1" defer></script>
</body></html>
