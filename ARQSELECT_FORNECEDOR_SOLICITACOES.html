oduto')}</b> · <span class="muted">${esc(x.ID)}</span></div><div class="muted">Projeto: ${esc(x['PROJETO ID']||'—')} · Quantidade: ${esc(x.QUANTIDADE||'—')} · Medida: ${esc(x.MEDIDA||'—')}<br>Especificação: ${esc(x.ESPECIFICACAO||'—')} · Prazo: ${esc(x.PRAZO||'—')}</div><div class="grid" style="margin-top:12px"><div><label>Valor unitário<input id="u-${esc(x.ID)}"></label></div><div><label>Frete<input id="f-${esc(x.ID)}"></label></div><div><label>Prazo<input id="p-${esc(x.ID)}"></label></div><div><label>Validade<input id="v-${esc(x.ID)}"></label></div></div><label>Condições / observações<textarea id="o-${esc(x.ID)}" rows="3"></textarea></label><button class="btn gold" onclick="send('${esc(x.ID)}','${esc(x['PROJETO ID']||'')}','${esc(x['ARQUITETO ID']||'')}','${esc(x['ARQUITETO E-MAIL']||'')}','${esc(x.PRODUTO||'')}','${esc(x.QUANTIDADE||'')}')">Enviar proposta</button></article>`).join(''):'<div class="card">Nenhuma solicitação recebida ainda.</div>'}async function send(id,proj,aid,aemail,prod,qtd){const unit=Number($('u-'+id).value.replace(',','.'))||0;const total=unit*(Number(qtd)||0);const d=await post({acao:'portal_proposta_enviar',token:TOKEN,solicitacaoId:id,projetoId:proj,arquitetoId:aid,arquitetoEmail:aemail,produto:prod,quantidade:qtd,valorUnitario:unit,valorTotal:total,frete:$('f-'+id).value,prazo:$('p-'+id).value,validade:$('v-'+id).value,condicao:$('o-'+id).value,observacoes:$('o-'+id).value});alert(d.mensagem||'Proposta enviada.');if(d.sucesso)load()}load();</script></body></html>
