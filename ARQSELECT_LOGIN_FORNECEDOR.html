<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARQSELECT | Login Fornecedor</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:#f4f7fb;color:#0f172a;min-height:100vh;display:grid;place-items:center}.shell{width:min(980px,94vw);display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 25px 70px #0f172a1a}.hero{padding:48px;background:linear-gradient(145deg,#0f172a,#1d4ed8);color:#fff}.hero h1{font-size:38px;margin:70px 0 14px}.hero p{color:#dbeafe;line-height:1.7}.form{padding:42px}.tabs{display:flex;gap:8px;margin-bottom:24px}.tab{padding:10px 14px;border-radius:10px;background:#eef2ff;font-weight:800;font-size:13px}.tab.active{background:#1d4ed8;color:#fff}label{display:block;font-size:13px;font-weight:800;margin:14px 0 7px}input{width:100%;padding:14px;border:1px solid #dbe2ea;border-radius:12px;font-size:15px;outline:0}input:focus{border-color:#2563eb;box-shadow:0 0 0 4px #2563eb18}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#0f172a;color:#fff;font-weight:900;margin-top:18px;cursor:pointer}.msg{margin-top:14px;padding:12px;border-radius:10px;background:#f1f5f9;font-size:13px;display:none}.links{text-align:center;margin-top:18px;font-size:13px}.links a{color:#2563eb;font-weight:800;text-decoration:none}@media(max-width:760px){.shell{grid-template-columns:1fr}.hero{display:none}}
</style></head><body><main class="shell"><section class="hero"><b>ARQSELECT</b><h1>Seu espaço profissional.</h1><p>Tenha uma visão clara dos seus projetos, solicitações, orçamentos e andamento comercial.</p></section><section class="form"><div class="tabs"><span class="tab active">FORNECEDOR</span></div><div id="login"><h2>Entrar</h2><label>E-mail</label><input id="email" type="email" autocomplete="username"><label>Senha</label><input id="senha" type="password" autocomplete="current-password"><button class="btn" onclick="login()">Acessar painel</button><div id="msg" class="msg"></div><div class="links">Ainda não possui acesso? <a href="#cadastro" onclick="mostrarCadastro()">Criar cadastro</a></div></div><div id="cadastro" style="display:none"><h2>Criar acesso</h2><label>Nome completo</label><input id="nome"><label>Empresa</label><input id="empresa"><label>E-mail</label><input id="cemail" type="email"><label>WhatsApp</label><input id="telefone"><label>CNPJ</label><input id="documento"><label>Senha</label><input id="csenha" type="password"><button class="btn" onclick="cadastrar()">Criar minha conta</button><div id="cmsg" class="msg"></div><div class="links"><a href="#" onclick="mostrarLogin()">Voltar para login</a></div></div></section></main><script>
const API='https://script.google.com/macros/s/AKfycbz_jLzNa87U_himraaCczzqGpQdq63AyIVogQ9-YGnqXuQYl3OSJfV4E7xYfPdnv8-d/exec';
function msg(id,t){const e=document.getElementById(id);e.textContent=t;e.style.display='block'}function mostrarCadastro(){document.getElementById('login').style.display='none';document.getElementById('cadastro').style.display='block'}function mostrarLogin(){document.getElementById('cadastro').style.display='none';document.getElementById('login').style.display='block'}
async function api(params){const u=new URL(API);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u,{cache:'no-store'});return r.json()}
async function login(){try{const d=await api({acao:'login_fornecedor',email:email.value,senha:senha.value});if(!d.sucesso)return msg('msg',d.mensagem);localStorage.setItem('ARQSELECT_PORTAL_TOKEN',d.token);localStorage.setItem('ARQSELECT_PORTAL_TIPO','FORNECEDOR');location.href='ARQSELECT_DASHBOARD_FORNECEDOR.html'}catch(e){msg('msg','Não foi possível conectar ao ARQSELECT.')}}
async function cadastrar(){try{const d=await api({acao:'cadastrar_fornecedor',nome:nome.value,empresa:empresa.value,email:cemail.value,telefone:telefone.value,registro:documento.value,senha:csenha.value});if(!d.sucesso)return msg('cmsg',d.mensagem);msg('cmsg','Cadastro criado. Você já pode entrar.');setTimeout(mostrarLogin,1000)}catch(e){msg('cmsg','Erro de conexão.')}}
if(location.hash==='#cadastro')mostrarCadastro();
</script></body></html>
