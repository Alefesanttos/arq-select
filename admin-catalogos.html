<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARQSELECT | Curadoria de Catálogos</title><script src="arq-config.js?v=5.3.0"></script><link rel="stylesheet" href="arqselect-4.css"><style>:root{--bg:#070807;--card:#121315;--text:#f6f3ea;--muted:#aaa49a;--line:rgba(255,255,255,.09);--gold:#d4af37;--gold2:#f3dd85}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% -5%,rgba(212,175,55,.1),transparent 27%),var(--bg);color:var(--text);font-family:Inter,system-ui}a{color:inherit;text-decoration:none}button,input,select{font:inherit}.top{padding:15px 5vw;background:rgba(7,7,7,.9);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;position:sticky;top:0}.brand{font-weight:950;letter-spacing:.14em}.brand span{color:var(--gold2)}.btn{border:1px solid var(--line);background:rgba(255,255,255,.055);color:#fff;border-radius:11px;padding:10px 13px;font-weight:850;cursor:pointer}.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#151108}.btn.red{color:#fecaca;border-color:rgba(239,68,68,.3)}.wrap{width:min(1300px,94vw);margin:auto;padding:30px 0 70px}.ey{font-size:10px;letter-spacing:.16em;color:var(--gold2);font-weight:900}.muted{color:var(--muted)}.head{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:20px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select{background:#0d0e10;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#151619,#0c0d0f);overflow:hidden}.cover{height:150px;display:grid;place-items:center;background:linear-gradient(135deg,#25262a,#0e0f11);font-size:50px;color:var(--gold2)}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:16px}.body h3{margin:5px 0 7px}.status{padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;border:1px solid var(--line)}.status.APROVADO{color:#86efac}.status.PENDENTE{color:#fde68a}.status.RECUSADO{color:#fecaca}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.empty{grid-column:1/-1;padding:28px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}@media(max-width:950px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.top,.head{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr}.toolbar{width:100%}.toolbar>*{flex:1}}</style></head><body><header class="top"><div class="brand">ARQ<span>SELECT</span> · ADMIN</div><div><a class="btn" href="admin.html">← Voltar ao CRM</a></div></header><main class="wrap"><div class="head"><div><div class="ey">CURADORIA DE PARCEIROS</div><h1 style="margin:6px 0 0">Catálogos de fornecedores</h1><p class="muted">Aprove somente materiais que estejam adequados à identidade e às regras comerciais da ARQSELECT.</p></div><div class="toolbar"><input id="q" placeholder="Buscar fornecedor ou catálogo"><select id="status"><option value="">Todos os status</option><option>PENDENTE</option><option>APROVADO</option><option>RECUSADO</option><option>ARQUIVADO</option></select><button class="btn gold" onclick="load()">Atualizar</button></div></div><div id="grid" class="grid"><div class="empty">Carregando...</div></div></main><script>(function(){'use strict';const API=window.ARQSELECT_API_URL,token=localStorage.getItem('ARQSELECT_ADMIN_TOKEN')||'';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let all=[];if(!token)location.href='admin.html';async function api(acao,data={},post=false){if(post){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({acao,token,...data})});return r.json()}const u=new URL(API);u.searchParams.set('acao',acao);u.searchParams.set('token',token);Object.entries(data).forEach(([k,v])=>u.searchParams.set(k,String(v)));return fetch(u,{cache:'no-store'}).then(r=>r.json())}window.load=async()=>{try{const j=await api('admin_catalogos');if(!j.sucesso)throw Error(j.mensagem||'Falha');all=j.catalogos||[];render()}catch(e){$('grid').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}};function render(){const q=$('q').value.toLowerCase(),st=$('status').value;const list=all.filter(c=>(!st||String(c.STATUS).toUpperCase()===st)&&(!q||JSON.stringify(c).toLowerCase().includes(q)));$('grid').innerHTML=list.length?list.map(c=>`<article class="card"><div class="cover">${c['CAPA URL']?`<img src="${esc(c['CAPA URL'])}" alt="${esc(c.TITULO||'Catálogo')}">`:'▤'}</div><div class="body"><div class="ey">${esc(c.CATEGORIAS||'CATÁLOGO')}</div><h3>${esc(c.TITULO||'Catálogo')}</h3><div class="muted">${esc(c.FORNECEDOR||'')} · ${esc(c.MARCA||'')}</div><p class="muted">${esc(c.DESCRICAO||'')}</p><div><span class="status ${esc(String(c.STATUS||'PENDENTE').toUpperCase())}">${esc(c.STATUS||'PENDENTE')}</span></div><div class="actions"><a class="btn" href="${esc(c['ARQUIVO URL']||'#')}" target="_blank" rel="noopener">Abrir arquivo</a><button class="btn gold" onclick="statusCat('${esc(c.ID)}','APROVADO')">Aprovar</button><button class="btn red" onclick="statusCat('${esc(c.ID)}','RECUSADO')">Recusar</button></div></div></article>`).join(''):'<div class="empty">Nenhum catálogo neste filtro.</div>'}window.statusCat=async(id,status)=>{const obs=status==='RECUSADO'?prompt('Motivo da recusa (opcional):','')||'':'';if(!confirm('Alterar este catálogo para '+status+'?'))return;const j=await api('admin_catalogo_status',{id,status,observacoes:obs},true);alert(j.mensagem||'Atualizado.');load()};$('q').oninput=render;$('status').onchange=render;load()})();</script></body></html>
