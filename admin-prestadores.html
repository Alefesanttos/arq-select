<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="arq-config.js?v=6.0.0"></script><link rel="stylesheet" href="arq-design-system.css?v=6.0.0"><link rel="stylesheet" href="arq-services.css?v=6.0.0"><title>Admin Prestadores | ARQSELECT</title></head><body><main style="width:min(1400px,calc(100% - 28px));margin:auto;padding:28px 0"><section class="srv-hero"><div class="srv-kicker">ADMIN · MODERAÇÃO</div><h1>Prestadores de serviços</h1><p>Aprovação, verificação e suspensão de profissionais.</p></section><div class="srv-list" id="list"></div></main><script src="arqselect-4.js"></script><script src="arqselect-6.js"></script><script src="arq-services.js"></script><script>async function load(){const A=ARQSELECT_SERVICES,r=await A.api('admin_prestadores');list.innerHTML=(r.prestadores||[]).map(p=>`<div class="srv-row"><div><h3>${A.esc(p['NOME FANTASIA']||p['NOME PROFISSIONAL'])}</h3><p>${A.esc(p.CIDADE)} · ${A.esc(p.ESTADO)} · ${A.esc(p.EMAIL)}</p><div class="srv-meta"><span class="srv-chip">${A.esc(p.STATUS)}</span><span class="srv-chip gold">${A.esc(p['STATUS VERIFICACAO'])}</span></div></div><div class="srv-actions"><button class="srv-btn gold" onclick="status('${p.ID}','ATIVO','VERIFICADO')">Verificar</button><button class="srv-btn" onclick="status('${p.ID}','SUSPENSO','')">Suspender</button></div></div>`).join('')||'<div class="srv-empty">Nenhum prestador cadastrado.</div>'}async function status(id,status,verificacao){const r=await ARQSELECT_SERVICES.api('admin_prestador_status',{id,status,verificacao},'POST');ARQSELECT_SERVICES.toast(r.mensagem);if(r.sucesso)load()}load()</script><script src="arq-experience.js"></script></body></html>
