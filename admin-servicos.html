<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="arq-config.js?v=5.8.1"></script><link rel="stylesheet" href="arq-design-system.css?v=5.8.1"><link rel="stylesheet" href="arq-services.css?v=5.8.1"><title>Categorias de Serviços | ARQSELECT</title></head><body><main style="width:min(1200px,calc(100% - 28px));margin:auto;padding:28px 0"><section class="srv-hero"><div class="srv-kicker">ADMIN · TAXONOMIA</div><h1>Categorias e especialidades</h1><p>Estrutura administrável sem alteração de código.</p></section><div class="srv-grid"><section class="srv-card wide"><h2>Categorias atuais</h2><div class="srv-list" id="cats"></div></section><aside class="srv-card"><h2>Adicionar categoria</h2><form id="form" class="srv-form"><label class="full">Nome<input name="nome" required></label><label class="full">Descrição<textarea name="descricao"></textarea></label><label>Ordem<input name="ordem" type="number"></label><div class="full"><button class="srv-btn gold">Adicionar</button></div></form></aside></div></main><script src="arqselect-4.js"></script><script src="arqselect-6.js"></script><script src="arq-services.js"></script><script>async function load(){const r=await ARQSELECT_SERVICES.api('public_servico_categorias',{token:''});cats.innerHTML=(r.categorias||[]).map(c=>`<div class="srv-row"><div><b>${ARQSELECT_SERVICES.esc(c.NOME)}</b><p>${(c.especialidades||[]).length} especialidades</p></div></div>`).join('')}form.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));const r=await ARQSELECT_SERVICES.api('admin_servico_categoria_salvar',{...d,tipo:'CATEGORIA'},'POST');ARQSELECT_SERVICES.toast(r.mensagem);if(r.sucesso){form.reset();load()}};load()</script><script src="arq-experience.js"></script></body></html>
