<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="global.css"><link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="forms.css"><link rel="stylesheet" href="responsive.css"><script src="app.js"></script></head><body><div class="app"><aside class="sidebar"><div class="brand">ARQSELECT ADMIN</div><nav class="nav"><a href="admin.html">Dashboard</a><a href="#" data-logout>Sair</a></nav></aside><main class="main"><h1 class="title">Painel Administrativo</h1><div id="m" class="grid"></div></main></div><script src="admin.js"></script><script>const a=layout('Admin','ADMIN');if(a)loadAdminV2().then(r=>{if(!r.sucesso)throw Error(r.mensagem);const d=r.dashboard;m.innerHTML=Object.entries(d).map(([k,v])=>`<div class="card"><div class="muted">${k}</div><div class="metric">${v}</div></div>`).join('')}).catch(e=>toast(e.message))</script></body></html>
