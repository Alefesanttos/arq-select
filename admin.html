<script>

  /* =====================================================
     CONFIGURAÇÃO
  ===================================================== */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbz_jLzNa87U_himraaCczzqGpQdq63AyIVogQ9-YGnqXuQYl3OSJfV4E7xYfPdnv8-d/exec";


  let projetos = [];

  let projetoSelecionado = null;


  /* =====================================================
     FUNÇÃO PARA LER CAMPOS

     IMPORTANTE:
     Seu Apps Script possui campos antigos e novos.
     Esta função aceita os dois formatos.
  ===================================================== */

  function campo(obj, ...nomes) {

    for (const nome of nomes) {

      if (
        obj &&
        Object.prototype.hasOwnProperty.call(obj, nome)
      ) {

        const valor = obj[nome];

        if (
          valor !== null &&
          valor !== undefined &&
          String(valor).trim() !== ""
        ) {

          return String(valor);

        }

      }

    }

    return "";

  }


  /* =====================================================
     NORMALIZAR PROJETO
  ===================================================== */

  function normalizarProjeto(p) {

    return {

      id:
        campo(
          p,

        ),

      data:
        campo(

          "DATA",
          "DATA / HORA"
        ),

        ),

      cidade:

          "CIDADE"
        ),

      estado:
        campo(
          p,
          "ESTADO"
        ),

      registro:
        campo(
          p,
          "REGISTRO",
          "REGISTRO PROFISSIONAL"
        ),

      projeto:
        campo(
          p,
          "PROJETO",
          "NOME DO PROJETO"
        ),

      tipo:
        campo(
          p,
          "TIPO PROJETO",
          "TIPO DE PROJETO"
        ),

      area:
        campo(
          p,
          "AREA",
          "ÁREA"
        ),

      ambiente:
        campo(
          p,
          "AMBIENTE"
        ),

      prazo:
        campo(
          p,
          "PRAZO"
        ),

      descricao:
        campo(
          p,
          "DESCRIÇÃO",
          "DESCRIÇÃO / ORÇAMENTO"
        ),

      investimento:
        campo(
          p,
          "INVESTIMENTO"
        ),

      observacoes:
        campo(
          p,
          "OBSERVAÇÕES"
        ),

      arquivos:
        campo(
          p,
          "ARQUIVOS"
        ),

      pasta:
        campo(
          p,
          "PASTA DO PROJETO"
        ),

      status:
        campo(
          p,
          "STATUS"
        ) || "Novo",

      notificacao:
        campo(
          p,
          "NOTIFICAÇÃO"
        ),

      linha:
        p._linha

    };

  }


  /* =====================================================
     CARREGAR PROJETOS
  ===================================================== */

  async function carregarProjetos() {

    const container =
      document.getElementById("projetos");

    const statusSistema =
      document.getElementById("statusSistema");


    container.innerHTML = `

      <div class="carregando">

        <div class="spinner"></div>

        Carregando projetos...

      </div>

    `;


    statusSistema.className =
      "status-sistema";

    statusSistema.textContent =
      "Conectando...";


    try {

      const resposta =
        await fetch(
          API_URL +
          "?acao=projetos&t=" +
          Date.now()
        );


      if (!resposta.ok) {

        throw new Error(
          "HTTP " +
          resposta.status
        );

      }


      const dados =
        await resposta.json();


      console.log(
        "Resposta completa do Apps Script:",
        dados
      );


      if (!dados.sucesso) {

        throw new Error(
          dados.mensagem ||
          "Erro retornado pelo Apps Script."
        );

      }


      projetos =
        Array.isArray(
          dados.projetos
        )
          ? dados.projetos.map(
              normalizarProjeto
            )
          : [];


      statusSistema.className =
        "status-sistema ok";

      statusSistema.textContent =
        "✓ Sistema conectado";


      atualizarEstatisticas();

      filtrarProjetos();


    }

    catch (erro) {

      console.error(
        "Erro ao carregar projetos:",
        erro
      );


      statusSistema.className =
        "status-sistema erro";

      statusSistema.textContent =
        "✕ Erro de conexão";


      container.innerHTML = `

        <div class="vazio">

          <strong>
            Não foi possível carregar os projetos.
          </strong>

          <br><br>

          ${escapeHTML(
            erro.message ||
            "Erro desconhecido."
          )}

          <br><br>

          <button
            class="btn-atualizar"
            onclick="carregarProjetos()"
          >
            Tentar novamente
          </button>

        </div>

      `;

    }

  }


  /* =====================================================
     ESTATÍSTICAS
  ===================================================== */

  function atualizarEstatisticas() {

    document.getElementById(
      "totalProjetos"
    ).textContent =
      projetos.length;


    document.getElementById(
      "totalNovos"
    ).textContent =
      projetos.filter(
        p => p.status === "Novo"
      ).length;


    document.getElementById(
      "totalAnalise"
    ).textContent =
      projetos.filter(
        p => p.status === "Em análise"
      ).length;


    document.getElementById(
      "totalFechados"
    ).textContent =
      projetos.filter(
        p => p.status === "Fechado"
      ).length;

  }


  /* =====================================================
     FILTRAR
  ===================================================== */

  function filtrarProjetos() {

    const busca =
      document
        .getElementById("busca")
        .value
        .toLowerCase()
        .trim();


    const status =
      document
        .getElementById("filtroStatus")
        .value;


    const filtrados =
      projetos.filter(
        function(p) {

          const texto = [

            p.id,
            p.nome,
            p.escritorio,
            p.email,
            p.whatsapp,
            p.cidade,
            p.estado,
            p.registro,
            p.projeto,
            p.tipo,
            p.area,
            p.ambiente,
            p.prazo,
            p.descricao,
            p.investimento,
            p.observacoes,
            p.status

          ]
          .join(" ")
          .toLowerCase();


          const correspondeBusca =
            !busca ||
            texto.includes(busca);


          const correspondeStatus =
            !status ||
            p.status === status;


          return (
            correspondeBusca &&
            correspondeStatus
          );

        }
      );


    renderizarProjetos(
      filtrados
    );

  }


  /* =====================================================
     RENDERIZAR PROJETOS
  ===================================================== */

  function renderizarProjetos(lista) {

    const container =
      document.getElementById("projetos");


    if (!lista.length) {

      container.innerHTML = `

        <div class="vazio">

          Nenhum projeto encontrado.

        </div>

      `;

      return;

    }


    container.innerHTML =
      lista.map(
        criarCardProjeto
      ).join("");

  }

  ===================================================== */

    const classeStatus =

      );

      "Projeto sem nome";


    const nome =
      p.nome ||
      "Não informado";

        .filter(Boolean)
        .join(" - ") ||

      criarLinkPasta(
        p.pasta
      );


    const whatsappHTML =
      criarLinkWhatsApp(
        p.whatsapp,
        p.id,
        p.projeto
      );


    return `

      <div class="projeto">

        <div class="projeto-topo">

          <div class="numero">

        <div class="projeto-corpo">

            <div class="campo-valor">
              ${escapeHTML(nome)}
            </div>

          </div>


          <div class="campo">

            <div class="campo-label">

            </div>

            <div class="campo-valor">

              )}

            </div>

          </div>

              Status

            <div>

              class="btn btn-detalhes"

              whatsappHTML
                ? whatsappHTML
                : ""
            }

            ${
              pastaHTML
                ? pastaHTML
                : ""
            }

          </div>

        </div>

      </div>

    `;

  }


  /* =====================================================
     DETALHES

  /* =====================================================
     CAMPO DETALHE
  ===================================================== */

  function detalhe(
    titulo,
    valor,
    tipo = "",
    full = false
  ) {

    let texto =
      valor ||
      "Não informado";


    if (tipo === "email" && valor) {

      texto =
        `<a href="mailto:${escapeAttribute(valor)}">
          ${escapeHTML(valor)}
        </a>`;

    }

    else {

      texto =
        escapeHTML(texto);

    }


    return `

      <div class="detalhe ${full ? "full" : ""}">

        <div class="detalhe-label">
          ${escapeHTML(titulo)}
        </div>

        <div class="detalhe-valor">
          ${texto}
        </div>

      </div>

    `;

  }


  /* =====================================================
     ARQUIVOS
  ===================================================== */

  function detalheArquivos(
    arquivos
  ) {

    if (!arquivos) {

      return detalhe(
        "Arquivos",
        ""
      );

    }


    const html =
      transformarLinks(
        arquivos
      );


    return `

      <div class="detalhe full">

        <div class="detalhe-label">
          Arquivos
        </div>

        <div class="detalhe-valor">
          ${html}
        </div>

      </div>

    `;

  }


  /* =====================================================
     PASTA
  ===================================================== */

  function detalhePasta(
    pasta
  ) {

    if (!pasta) {

      return detalhe(
        "Pasta do projeto",
        ""
      );

    }


    const url =
      extrairURL(
        pasta
      );


    if (url) {

      return `

        <div class="detalhe full">

          <div class="detalhe-label">
            Pasta do projeto
          </div>

          <div class="detalhe-valor">

            <a
              href="${escapeAttribute(url)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              📁 Abrir pasta do projeto
            </a>

          </div>

        </div>

      `;

    }


    return detalhe(
      "Pasta do projeto",
      pasta,
      "",
      true
    );

  }


  /* =====================================================
     EXTRair URL
  ===================================================== */

  function extrairURL(valor) {

    if (!valor) {
      return "";
    }


    const texto =
      String(valor);


    const encontrado =
      texto.match(
        /https?:\/\/[^\s"')]+/i
      );


    return encontrado
      ? encontrado[0]
      : "";

  }


  /* =====================================================
     TRANSFORMAR LINKS
  ===================================================== */

  function transformarLinks(
    texto
  ) {

    const valor =
      String(texto || "");


    const partes =
      valor.split(/\n/);


    return partes.map(
      function(parte) {

        const url =
          extrairURL(parte);


        if (url) {

          const nome =
            parte
              .replace(url, "")
              .replace(
                /→/g,
                ""
              )
              .trim() ||
            "Abrir arquivo";


          return `

            <div style="margin-bottom:8px;">

              📎

              <a
                href="${escapeAttribute(url)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ${escapeHTML(nome)}
              </a>

            </div>

          `;

        }


        return `
          <div>
            ${escapeHTML(parte)}
          </div>
        `;

      }
    ).join("");

  }


  /* =====================================================
     WHATSAPP
  ===================================================== */

  function criarLinkWhatsApp(
    numero,
    id,
    nomeProjeto
  ) {

    if (!numero) {
      return "";
    }


    let telefone =
      String(numero)
        .replace(
          /\D/g,
          ""
        );


    /*
     * Se a planilha estiver trazendo
     * apenas a palavra WHATSAPP por causa
     * do HYPERLINK, não criamos um link falso.
     */

    if (
      telefone.length < 10
    ) {

      return "";

    }


    if (
      telefone.length === 10 ||
      telefone.length === 11
    ) {

      telefone =
        "55" +
        telefone;

    }


    const mensagem =
      "Olá! Aqui é da ARQSELECT. " +
      "Estamos entrando em contato sobre o projeto " +
      id +
      " - " +
      nomeProjeto +
      ".";


    const url =
      "https://wa.me/" +
      telefone +
      "?text=" +
      encodeURIComponent(
        mensagem
      );


    return `

      <a
        class="btn btn-whatsapp"
        href="${escapeAttribute(url)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        WhatsApp
      </a>

    `;

  }


  /* =====================================================
     LINK PASTA NO CARD
  ===================================================== */

  function criarLinkPasta(
    pasta
  ) {

    const url =
      extrairURL(
        pasta
      );


    if (!url) {
      return "";
    }


    return `

      <a
        class="btn btn-pasta"
        href="${escapeAttribute(url)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        📁 Pasta
      </a>

    `;

  }


  /* =====================================================
     SALVAR STATUS
  ===================================================== */

  async function salvarStatus() {

    if (!projetoSelecionado) {

      alert(
        "Nenhum projeto selecionado."
      );

      return;

    }


    const novoStatus =
      document
        .getElementById(
          "novoStatus"
        )
        .value;


    const linha =
      projetoSelecionado.linha;


    if (!linha) {

      alert(
        "A linha do projeto não foi identificada."
      );

      return;

    }


    try {

      const url =
        API_URL +
        "?acao=atualizarStatus" +
        "&linha=" +
        encodeURIComponent(
          linha
        ) +
        "&status=" +
        encodeURIComponent(
          novoStatus
        ) +
        "&t=" +
        Date.now();


      const resposta =
        await fetch(
          url
        );


      const dados =
        await resposta.json();


      console.log(
        "Resposta atualização:",
        dados
      );


      if (!dados.sucesso) {

        throw new Error(
          dados.mensagem ||
          dados.erro ||
          "Não foi possível atualizar."
        );

      }


      projetoSelecionado.status =
        novoStatus;


      const projetoAtual =
        projetos.find(
          p =>
            Number(p.linha) ===
            Number(linha)
        );


      if (projetoAtual) {

        projetoAtual.status =
          novoStatus;

      }


      atualizarEstatisticas();

      filtrarProjetos();


      fecharModal();


      alert(
        "Status atualizado com sucesso."
      );


    }

    catch (erro) {

      console.error(
        erro
      );


      alert(
        "Erro ao atualizar status:\n\n" +
        erro.message
      );

    }

  }


  /* =====================================================
     FECHAR MODAL
  ===================================================== */

  function fecharModal() {

    document
      .getElementById("modal")
      .classList.remove("ativo");

    projetoSelecionado =
      null;

  }


  function fecharModalFora(
    event
  ) {

    if (
      event.target.id ===
      "modal"
    ) {

      fecharModal();

    }

  }


  /* =====================================================
     STATUS CSS
  ===================================================== */

  function classeDoStatus(
    status
  ) {

    switch (
      String(status)
        .toLowerCase()
    ) {

      case "novo":
        return "novo";

      case "em análise":
      case "em analise":
        return "analise";

      case "orçamento":
      case "orcamento":
        return "orcamento";

      case "fechado":
        return "fechado";

      case "cancelado":
        return "cancelado";

      default:
        return "";

    }

  }


  /* =====================================================
     SEGURANÇA HTML
  ===================================================== */

  function escapeHTML(
    valor
  ) {

    return String(
      valor || ""
    )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  function escapeAttribute(
    valor
  ) {

    return escapeHTML(
      valor
    );

  }


  /* =====================================================
     INICIALIZAÇÃO
  ===================================================== */

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      carregarProjetos();

    }
  );


  /* =====================================================
     ESC PARA FECHAR MODAL
  ===================================================== */

  document.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Escape"
      ) {

        fecharModal();

      }

    }
  );

</script>
