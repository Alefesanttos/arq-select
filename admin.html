<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARQSELECT — Painel Administrativo</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f5f5;
  color:#222;
}
header{
  background:#111;
  color:#fff;
  padding:22px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}
.logo{
  font-size:25px;
  font-weight:700;
  letter-spacing:2px;
}
.logo span{color:#c9a45c}
.header-info{font-size:13px;color:#ccc}
.container{
  max-width:1450px;
  margin:25px auto;
  padding:0 18px;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
h1{margin:0;font-size:24px}
.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
button{
  border:0;
  border-radius:7px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:700;
}
.btn-primary{background:#c9a45c;color:#111}
.btn-dark{background:#222;color:#fff}
.btn-light{background:#fff;border:1px solid #ddd}
.btn-danger{background:#b42318;color:#fff}
button:disabled{opacity:.6;cursor:not-allowed}

.status-message{
  display:none;
  padding:13px 16px;
  border-radius:7px;
  margin-bottom:18px;
  font-size:14px;
}
.status-message.success{display:block;background:#e9f8ef;color:#176b39}
.status-message.error{display:block;background:#fff0f0;color:#a21d1d}
.status-message.loading{display:block;background:#f1f1f1;color:#555}

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-bottom:20px;
}
.stat{
  background:#fff;
  border:1px solid #e5e5e5;
  border-radius:10px;
  padding:18px;
}
.stat-label{font-size:12px;color:#777;margin-bottom:7px}
.stat-value{font-size:26px;font-weight:700}
.filters{
  background:#fff;
  border:1px solid #e5e5e5;
  border-radius:10px;
  padding:15px;
  margin-bottom:18px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.filters input,.filters select{
  padding:11px 12px;
  border:1px solid #ddd;
  border-radius:7px;
  background:#fff;
}
.filters input{min-width:280px;flex:1}

.table-wrap{
  background:#fff;
  border:1px solid #e5e5e5;
  border-radius:10px;
  overflow:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:1150px;
}
th,td{
  padding:13px 12px;
  border-bottom:1px solid #eee;
  text-align:left;
  vertical-align:middle;
  font-size:13px;
}
th{
  background:#fafafa;
  font-size:12px;
  color:#666;
  text-transform:uppercase;
  letter-spacing:.4px;
}
tr:hover td{background:#fcfaf5}
.project-id{
  font-weight:700;
  color:#8b6a28;
}
.project-name{font-weight:700}
.muted{color:#888}
.actions-cell{
  display:flex;
  gap:7px;
  align-items:center;
}
.small-btn{
  padding:8px 10px;
  font-size:12px;
}
.status-select{
  min-width:125px;
  padding:8px;
  border:1px solid #ddd;
  border-radius:6px;
  background:#fff;
}
.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#eee;
  font-size:11px;
  font-weight:700;
}
.badge-novo{background:#e9eefb;color:#274690}
.badge-analise{background:#fff4d8;color:#7c5b00}
.badge-orcamento{background:#e9f7ef;color:#18733d}
.badge-fechado{background:#dff5e8;color:#126b35}
.badge-cancelado{background:#ffe5e5;color:#a31c1c}

.empty{
  text-align:center;
  padding:50px 20px;
  color:#777;
}
.loading-box{
  text-align:center;
  padding:45px;
  color:#777;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:999;
  padding:20px;
  overflow:auto;
}
.modal.active{display:block}
.modal-box{
  background:#fff;
  max-width:850px;
  margin:30px auto;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.modal-header{
  background:#111;
  color:#fff;
  padding:18px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.modal-header h2{margin:0;font-size:19px}
.close{
  background:transparent;
  color:#fff;
  font-size:26px;
  padding:0 5px;
}
.modal-body{
  padding:22px;
}
.detail-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}
.detail{
  border:1px solid #eee;
  border-radius:8px;
  padding:13px;
}
.detail.full{grid-column:1/-1}
.detail-label{
  color:#777;
  font-size:11px;
  text-transform:uppercase;
  margin-bottom:6px;
}
.detail-value{
  white-space:pre-wrap;
  word-break:break-word;
  font-size:14px;
}
.detail-value a{
  color:#87651e;
  font-weight:700;
}
@media(max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .detail-grid{grid-template-columns:1fr}
  .detail.full{grid-column:auto}
}
@media(max-width:550px){
  header{padding:18px}
  .stats{grid-template-columns:1fr}
  .container{padding:0 10px}
}
</style>
</head>

<body>

<header>
  <div class="logo">ARQ<span>SELECT</span></div>
  <div class="header-info">Painel Administrativo de Projetos</div>
</header>

<main class="container">

  <div class="topbar">
    <div>
      <h1>Projetos recebidos</h1>
      <div class="muted" style="margin-top:5px">Gestão de solicitações de arquitetos</div>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="carregarProjetos()">↻ Atualizar</button>
      <button class="btn-dark" onclick="testarAPI()">Teste API</button>
    </div>
  </div>

  <div id="mensagem" class="status-message"></div>

  <section class="stats">
    <div class="stat">
      <div class="stat-label">TOTAL</div>
      <div class="stat-value" id="statTotal">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">NOVOS</div>
      <div class="stat-value" id="statNovo">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">EM ANÁLISE</div>
      <div class="stat-value" id="statAnalise">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">ORÇAMENTO</div>
      <div class="stat-value" id="statOrcamento">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">FECHADOS</div>
      <div class="stat-value" id="statFechado">0</div>
    </div>
  </section>

  <section class="filters">
    <input
      id="busca"
      type="search"
      placeholder="Buscar por projeto, arquiteto, e-mail, cidade ou ID..."
      oninput="renderizarTabela()"
    >

    <select id="filtroStatus" onchange="renderizarTabela()">
      <option value="">Todos os status</option>
      <option value="Novo">Novo</option>
      <option value="Em análise">Em análise</option>
      <option value="Orçamento">Orçamento</option>
      <option value="Fechado">Fechado</option>
      <option value="Cancelado">Cancelado</option>
    </select>

    <select id="filtroTipo" onchange="renderizarTabela()">
      <option value="">Todos os tipos</option>
    </select>

    <button class="btn-light" onclick="limparFiltros()">Limpar filtros</button>
  </section>

  <section class="table-wrap">
    <div id="loading" class="loading-box">
      Carregando projetos...
    </div>

    <table id="tabela" style="display:none">
      <thead>
        <tr>
          <th>Projeto</th>
          <th>Data</th>
          <th>Arquiteto</th>
          <th>Escritório</th>
          <th>Local</th>
          <th>Tipo</th>
          <th>Área</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaBody"></tbody>
    </table>

    <div id="vazio" class="empty" style="display:none">
      Nenhum projeto encontrado.
    </div>
  </section>

</main>

<!-- MODAL -->
<div id="modal" class="modal" onclick="fecharModalFora(event)">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Detalhes do projeto</h2>
      <button class="close" onclick="fecharModal()">×</button>
    </div>

    <div class="modal-body">
      <div id="detalhesProjeto" class="detail-grid"></div>
    </div>
  </div>
</div>

<script>
/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbz_jLzNa87U_himraaCczzqGpQdq63AyIVogQ9-YGnqXuQYl3OSJfV4E7xYfPdnv8-d/exec";

const STATUS_PERMITIDOS = [
  "Novo",
  "Em análise",
  "Orçamento",
  "Fechado",
  "Cancelado"
];

let projetos = [];
let projetoSelecionado = null;


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

document.addEventListener("DOMContentLoaded", function() {
  carregarProjetos();
});


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(texto, tipo) {

  const el = document.getElementById("mensagem");

  el.className = "status-message " + tipo;
  el.textContent = texto;

}

function esconderMensagem() {

  const el = document.getElementById("mensagem");

  el.className = "status-message";
  el.textContent = "";

}


/* =====================================================
   CARREGAR PROJETOS
===================================================== */

async function carregarProjetos() {

  const loading = document.getElementById("loading");
  const tabela = document.getElementById("tabela");
  const vazio = document.getElementById("vazio");

  loading.style.display = "block";
  tabela.style.display = "none";
  vazio.style.display = "none";

  mostrarMensagem(
    "Carregando projetos...",
    "loading"
  );

  try {

    const url =
      SCRIPT_URL +
      "?acao=projetos&_=" +
      Date.now();

    const resposta = await fetch(url, {
      method: "GET",
      cache: "no-store"
    });

    if (!resposta.ok) {
      throw new Error(
        "Erro HTTP " + resposta.status
      );
    }

    const dados = await resposta.json();

    console.log("Resposta projetos:", dados);

    if (!dados.sucesso) {

      throw new Error(
        dados.erro ||
        dados.mensagem ||
        "O Apps Script não conseguiu carregar os projetos."
      );

    }

    projetos =
      Array.isArray(dados.projetos)
        ? dados.projetos
        : [];

    atualizarTipos();
    atualizarEstatisticas();
    renderizarTabela();

    loading.style.display = "none";

    if (projetos.length) {
      tabela.style.display = "table";
      esconderMensagem();
    } else {
      vazio.style.display = "block";
      mostrarMensagem(
        "Nenhum projeto encontrado.",
        "success"
      );
    }

  } catch (erro) {

    console.error(
      "Erro ao carregar projetos:",
      erro
    );

    loading.style.display = "none";
    tabela.style.display = "none";
    vazio.style.display = "block";

    mostrarMensagem(
      "Não foi possível carregar os projetos. " +
      "Verifique se o Apps Script está publicado e se a implantação está atualizada.",
      "error"
    );

  }

}


/* =====================================================
   TIPOS
===================================================== */

function atualizarTipos() {

  const select =
    document.getElementById("filtroTipo");

  const atual =
    select.value;

  const tipos = [
    ...new Set(
      projetos
        .map(p => obter(p, [
          "TIPO DE PROJETO",
          "TIPO PROJETO"
        ]))
        .filter(Boolean)
    )
  ].sort();

  select.innerHTML =
    '<option value="">Todos os tipos</option>';

  tipos.forEach(tipo => {

    const option =
      document.createElement("option");

    option.value = tipo;
    option.textContent = tipo;

    select.appendChild(option);

  });

  if (tipos.includes(atual)) {
    select.value = atual;
  }

}


/* =====================================================
   ESTATÍSTICAS
===================================================== */

function atualizarEstatisticas() {

  const contar = status =>
    projetos.filter(
      p => normalizarStatus(obter(p, ["STATUS"])) === status
    ).length;

  document.getElementById("statTotal").textContent =
    projetos.length;

  document.getElementById("statNovo").textContent =
    contar("Novo");

  document.getElementById("statAnalise").textContent =
    contar("Em análise");

  document.getElementById("statOrcamento").textContent =
    contar("Orçamento");

  document.getElementById("statFechado").textContent =
    contar("Fechado");

}


/* =====================================================
   RENDERIZAR
===================================================== */

function renderizarTabela() {

  const body =
    document.getElementById("tabelaBody");

  const busca =
    document.getElementById("busca").value
      .toLowerCase()
      .trim();

  const filtroStatus =
    document.getElementById("filtroStatus").value;

  const filtroTipo =
    document.getElementById("filtroTipo").value;

  const filtrados =
    projetos.filter(p => {

      const texto = [
        obter(p, ["ID PROJETO", "NUMERO DO PROJETO"]),
        obter(p, ["NOME", "NOME DO ARQUITETO"]),
        obter(p, ["ESCRITÓRIO"]),
        obter(p, ["E-MAIL", "EMAIL"]),
        obter(p, ["CIDADE"]),
        obter(p, ["ESTADO"]),
        obter(p, ["NOME DO PROJETO", "PROJETO"]),
        obter(p, ["DESCRIÇÃO / ORÇAMENTO", "DESCRIÇÃO"])
      ]
      .join(" ")
      .toLowerCase();

      const status =
        normalizarStatus(
          obter(p, ["STATUS"])
        );

      const tipo =
        obter(p, [
          "TIPO DE PROJETO",
          "TIPO PROJETO"
        ]);

      return (
        (!busca || texto.includes(busca)) &&
        (!filtroStatus || status === filtroStatus) &&
        (!filtroTipo || tipo === filtroTipo)
      );

    });

  body.innerHTML = "";

  if (!filtrados.length) {

    document.getElementById("tabela").style.display = "none";
    document.getElementById("vazio").style.display = "block";

    return;

  }

  document.getElementById("tabela").style.display = "table";
  document.getElementById("vazio").style.display = "none";

  filtrados.forEach(p => {

    const tr =
      document.createElement("tr");

    const id =
      obter(p, [
        "ID PROJETO",
        "NUMERO DO PROJETO"
      ]) || "Sem ID";

    const data =
      obter(p, [
        "DATA / HORA",
        "DATA"
      ]);

    const nome =
      obter(p, ["NOME"]);

    const escritorio =
      obter(p, ["ESCRITÓRIO"]);

    const cidade =
      obter(p, ["CIDADE"]);

    const estado =
      obter(p, ["ESTADO"]);

    const tipo =
      obter(p, [
        "TIPO DE PROJETO",
        "TIPO PROJETO"
      ]);

    const area =
      obter(p, [
        "ÁREA",
        "AREA"
      ]);

    const status =
      normalizarStatus(
        obter(p, ["STATUS"])
      ) || "Novo";

    tr.innerHTML = `
      <td>
        <div class="project-id">${esc(id)}</div>
        <div class="project-name">
          ${esc(
            obter(p, [
              "NOME DO PROJETO",
              "PROJETO"
            ]) || "Projeto sem nome"
          )}
        </div>
      </td>

      <td>${esc(data || "Não informado")}</td>

      <td>${esc(nome || "Não informado")}</td>

      <td>${esc(escritorio || "Não informado")}</td>

      <td>
        ${esc(cidade || "Não informado")}
        ${estado ? " - " + esc(estado) : ""}
      </td>

      <td>${esc(tipo || "Não informado")}</td>

      <td>${esc(area || "Não informado")}</td>

      <td>
        ${criarSelectStatus(p)}
      </td>

      <td>
        <div class="actions-cell">
          <button
            class="btn-primary small-btn"
            onclick="abrirDetalhes(${Number(p._linha)})"
          >
            Detalhes
          </button>

          ${criarBotoesLinks(p)}
        </div>
      </td>
    `;

    body.appendChild(tr);

  });

}


/* =====================================================
   SELECT DE STATUS
===================================================== */

function criarSelectStatus(projeto) {

  const status =
    normalizarStatus(
      obter(projeto, ["STATUS"])
    ) || "Novo";

  const linha =
    Number(projeto._linha);

  let html =
    `<select class="status-select"
      onchange="alterarStatus(${linha}, this.value, this)"
      data-linha="${linha}">`;

  STATUS_PERMITIDOS.forEach(opcao => {

    html +=
      `<option value="${escAttr(opcao)}"
        ${status === opcao ? "selected" : ""}>
        ${esc(opcao)}
      </option>`;

  });

  html += "</select>";

  return html;

}


/* =====================================================
   ALTERAR STATUS
===================================================== */

async function alterarStatus(
  linha,
  novoStatus,
  select
) {

  const statusAnterior =
    normalizarStatus(
      obter(
        projetos.find(
          p => Number(p._linha) === Number(linha)
        ) || {},
        ["STATUS"]
      )
    ) || "Novo";

  if (!STATUS_PERMITIDOS.includes(novoStatus)) {

    alert("Status inválido.");

    if (select) {
      select.value = statusAnterior;
    }

    return;

  }

  if (!linha) {

    alert("Linha do projeto não informada.");

    return;

  }

  if (select) {
    select.disabled = true;
  }

  mostrarMensagem(
    "Atualizando status para " + novoStatus + "...",
    "loading"
  );

  try {

    /*
     * encodeURIComponent é obrigatório aqui.
     * Ele corrige "Orçamento" e "Em análise".
     */

    const url =
      SCRIPT_URL +
      "?acao=atualizarStatus" +
      "&linha=" +
      encodeURIComponent(linha) +
      "&status=" +
      encodeURIComponent(novoStatus) +
      "&_=" +
      Date.now();

    console.log(
      "URL atualização:",
      url
    );

    const resposta =
      await fetch(url, {
        method: "GET",
        cache: "no-store"
      });

    if (!resposta.ok) {

      throw new Error(
        "Erro HTTP " + resposta.status
      );

    }

    const resultado =
      await resposta.json();

    console.log(
      "Resposta atualização:",
      resultado
    );

    if (!resultado.sucesso) {

      throw new Error(
        resultado.erro ||
        resultado.mensagem ||
        "Não foi possível atualizar o status."
      );

    }

    const projeto =
      projetos.find(
        p => Number(p._linha) === Number(linha)
      );

    if (projeto) {

      projeto["STATUS"] =
        resultado.status ||
        novoStatus;

    }

    atualizarEstatisticas();

    mostrarMensagem(
      "Status atualizado com sucesso para: " +
      (resultado.status || novoStatus),
      "success"
    );

    if (select) {
      select.disabled = false;
    }

  } catch (erro) {

    console.error(
      "Erro ao atualizar status:",
      erro
    );

    if (select) {
      select.value = statusAnterior;
      select.disabled = false;
    }

    mostrarMensagem(
      "Erro ao atualizar status: " +
      erro.message,
      "error"
    );

  }

}


/* =====================================================
   DETALHES
===================================================== */

function abrirDetalhes(linha) {

  const projeto =
    projetos.find(
      p => Number(p._linha) === Number(linha)
    );

  if (!projeto) {

    alert(
      "Projeto não encontrado."
    );

    return;

  }

  projetoSelecionado =
    projeto;

  const campos = [

    ["Número do projeto", [
      "ID PROJETO",
      "NUMERO DO PROJETO"
    ]],

    ["Data", [
      "DATA / HORA",
      "DATA"
    ]],

    ["Nome", [
      "NOME"
    ]],

    ["Escritório", [
      "ESCRITÓRIO"
    ]],

    ["E-mail", [
      "E-MAIL",
      "EMAIL"
    ]],

    ["WhatsApp", [
      "WHATSAPP"
    ]],

    ["Cidade", [
      "CIDADE"
    ]],

    ["Estado", [
      "ESTADO"
    ]],

    ["Registro profissional", [
      "REGISTRO PROFISSIONAL",
      "REGISTRO"
    ]],

    ["Nome do projeto", [
      "NOME DO PROJETO",
      "PROJETO"
    ]],

    ["Tipo de projeto", [
      "TIPO DE PROJETO",
      "TIPO PROJETO"
    ]],

    ["Área", [
      "ÁREA",
      "AREA"
    ]],

    ["Ambiente", [
      "AMBIENTE"
    ]],

    ["Prazo", [
      "PRAZO"
    ]],

    ["Investimento", [
      "INVESTIMENTO"
    ]],

    ["Status", [
      "STATUS"
    ]],

    ["Notificação", [
      "NOTIFICAÇÃO"
    ]],

    ["Descrição / orçamento", [
      "DESCRIÇÃO / ORÇAMENTO",
      "DESCRIÇÃO"
    ]],

    ["Observações", [
      "OBSERVAÇÕES"
    ]],

    ["Arquivos", [
      "ARQUIVOS"
    ]],

    ["Pasta do projeto", [
      "PASTA DO PROJETO"
    ]]

  ];

  const container =
    document.getElementById(
      "detalhesProjeto"
    );

  container.innerHTML = "";

  campos.forEach(
    function(campo) {

      const label =
        campo[0];

      const valor =
        obter(
          projeto,
          campo[1]
        );

      const div =
        document.createElement("div");

      div.className =
        "detail";

      if (
        label === "Descrição / orçamento" ||
        label === "Observações" ||
        label === "Arquivos" ||
        label === "Pasta do projeto"
      ) {

        div.classList.add("full");

      }

      div.innerHTML =
        `
        <div class="detail-label">
          ${esc(label)}
        </div>

        <div class="detail-value">
          ${formatarDetalhe(
            label,
            valor
          )}
        </div>
        `;

      container.appendChild(div);

    }
  );

  document
    .getElementById("modal")
    .classList.add("active");

}


/* =====================================================
   LINKS DA TABELA
===================================================== */

function criarBotoesLinks(projeto) {

  const pasta =
    obter(
      projeto,
      ["PASTA DO PROJETO"]
    );

  const whatsapp =
    obter(
      projeto,
      ["WHATSAPP"]
    );

  let html = "";

  if (
    pasta &&
    /^https?:\/\//i.test(pasta)
  ) {

    html +=
      `<a
        class="btn-light small-btn"
        href="${escAttr(pasta)}"
        target="_blank"
        rel="noopener"
      >Pasta</a>`;

  }

  /*
   * Quando a célula WHATSAPP contém o link gerado
   * pelo Apps Script, abrimos diretamente.
   * Se ela contiver somente "WHATSAPP", não criamos
   * um link falso.
   */

  if (
    whatsapp &&
    /^https?:\/\//i.test(whatsapp)
  ) {

    html +=
      `<a
        class="btn-light small-btn"
        href="${escAttr(whatsapp)}"
        target="_blank"
        rel="noopener"
      >WhatsApp</a>`;

  }

  return html;

}


/* =====================================================
   FORMATAR DETALHE
===================================================== */

function formatarDetalhe(
  label,
  valor
) {

  if (
    valor === null ||
    valor === undefined ||
    String(valor).trim() === ""
  ) {

    return '<span class="muted">Não informado</span>';

  }

  const texto =
    String(valor);

  /*
   * Links
   */

  if (
    /^https?:\/\//i.test(texto.trim())
  ) {

    return `
      <a
        href="${escAttr(texto.trim())}"
        target="_blank"
        rel="noopener"
      >
        Abrir link
      </a>
    `;

  }

  /*
   * Arquivos podem conter vários links,
   * separados por quebra de linha.
   */

  if (label === "Arquivos") {

    const partes =
      texto
        .split(/\n+/)
        .map(v => v.trim())
        .filter(Boolean);

    if (!partes.length) {
      return '<span class="muted">Não informado</span>';
    }

    return partes
      .map(item => {

        const match =
          item.match(
            /^(.*?)\s*→\s*(https?:\/\/\S+)$/i
          );

        if (match) {

          return `
            <div style="margin-bottom:7px">
              ${esc(match[1])}
              →
              <a
                href="${escAttr(match[2])}"
                target="_blank"
                rel="noopener"
              >
                Abrir arquivo
              </a>
            </div>
          `;

        }

        return esc(item);

      })
      .join("");

  }

  /*
   * Quebras de linha
   */

  return esc(texto)
    .replace(/\n/g, "<br>");

}


/* =====================================================
   NORMALIZAR STATUS
===================================================== */

function normalizarStatus(status) {

  const texto =
    String(status || "").trim();

  /*
   * Mantém exatamente os valores usados
   * pelo Apps Script.
   */

  if (
    texto === "Novo" ||
    texto === "Em análise" ||
    texto === "Orçamento" ||
    texto === "Fechado" ||
    texto === "Cancelado"
  ) {
    return texto;
  }

  return texto || "Novo";

}


/* =====================================================
   OBTER CAMPO COM COMPATIBILIDADE
===================================================== */

function obter(objeto, nomes) {

  if (!objeto) {
    return "";
  }

  for (const nome of nomes) {

    if (
      Object.prototype.hasOwnProperty.call(
        objeto,
        nome
      )
    ) {

      const valor =
        objeto[nome];

      if (
        valor !== null &&
        valor !== undefined &&
        String(valor).trim() !== ""
      ) {

        return String(valor);

      }

    }

  }

  return "";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(valor) {

  return String(valor ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

function escAttr(valor) {
  return esc(valor);
}


/* =====================================================
   FILTROS
===================================================== */

function limparFiltros() {

  document.getElementById("busca").value = "";
  document.getElementById("filtroStatus").value = "";
  document.getElementById("filtroTipo").value = "";

  renderizarTabela();

}


/* =====================================================
   MODAL
===================================================== */

function fecharModal() {

  document
    .getElementById("modal")
    .classList.remove("active");

}

function fecharModalFora(event) {

  if (
    event.target.id === "modal"
  ) {

    fecharModal();

  }

}

document.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Escape") {
      fecharModal();
    }

  }
);


/* =====================================================
   TESTE DA API
===================================================== */

async function testarAPI() {

  mostrarMensagem(
    "Testando conexão com o Apps Script...",
    "loading"
  );

  try {

    const resposta =
      await fetch(
        SCRIPT_URL +
        "?acao=teste&_=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store"
        }
      );

    const dados =
      await resposta.json();

    console.log(
      "Teste API:",
      dados
    );

    if (!dados.sucesso) {

      throw new Error(
        dados.erro ||
        dados.mensagem ||
        "API retornou erro."
      );

    }

    mostrarMensagem(
      "API funcionando: " +
      dados.mensagem,
      "success"
    );

  } catch (erro) {

    console.error(
      erro
    );

    mostrarMensagem(
      "Falha no teste da API: " +
      erro.message,
      "error"
    );

  }

}
