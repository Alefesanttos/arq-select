<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARQSELECT — Painel Administrativo</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f5f7;

   TOPO

.header {
    background: #111;

}

    font-size: 24px;

}

.container {

===================================================== */

.tabela-container {

thead {

/* =====================================================

.status-area {

.status-area select {

.btn-status {

.btn-status:hover {

/* =====================================================
   LOADING

.loading {

.erro {

    <!-- DASHBOARD -->

            <div class="card-value gold"

        <div class="card">

            </div>

        <div class="card">

            </div>

                 id="totalAnalise">

            </div>

        <div class="card">

            </div>

    <!-- TOOLBAR -->

    <div class="toolbar">

        <input

            id="busca"
            placeholder="Pesquisar projeto, arquiteto, e-mail ou cidade..."
            oninput="filtrarProjetos()"
        >

            onchange="filtrarProjetos()"

            <option value="Fechado">Fechado</option>
            <option value="Cancelado">Cancelado</option>
        </select>

            class="btn-atualizar"
            onclick="carregarProjetos()"
        >

</div>

            </h2>

            </button>

             id="modalConteudo">

<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz_jLzNa87U_himraaCczzqGpQdq63AyIVogQ9-YGnqXuQYl3OSJfV4E7xYfPdnv8-d/exec";


let projetos = [];

let projetoSelecionado = null;


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        carregarProjetos();

    }
);


/* =====================================================
   PEGAR VALOR CORRETO
 *
 * IMPORTANTE:
 * A planilha antiga e a nova possuem
 * nomes diferentes para algumas colunas.
 *
 * Esta função procura várias possibilidades
 * e usa a primeira que possuir valor.
===================================================== */

function pegar(obj, nomes) {

    if (!obj) {
        return "";
    }

    for (const nome of nomes) {

        if (
            Object.prototype.hasOwnProperty.call(
                obj,
                nome
            )
        ) {

            const valor =
                obj[nome];

            if (
                valor !== null &&
                valor !== undefined &&
                String(valor).trim() !== ""
            ) {

                return String(valor).trim();

            }

        }

    }

    return "";

}


/* =====================================================
   CAMPOS NORMALIZADOS
===================================================== */

function normalizarProjeto(p) {

    return {

        original: p,

        linha:
            pegar(p, ["_linha"]),

        id:
            pegar(p, [
                "ID PROJETO",
                "NUMERO DO PROJETO"
            ]),

        data:
            pegar(p, [
                "DATA / HORA",
                "DATA"
            ]),

        nome:
            pegar(p, [
                "NOME",
                "NOME DO ARQUITETO",
                "ARQUITETO"
            ]),

        escritorio:
            pegar(p, [
                "ESCRITÓRIO",
                "ESCRITORIO"
            ]),

        email:
            pegar(p, [
                "E-MAIL",
                "EMAIL"
            ]),

        whatsapp:
            pegar(p, [
                "WHATSAPP"
            ]),

        cidade:
            pegar(p, [
                "CIDADE"
            ]),

        estado:
            pegar(p, [
                "ESTADO"
            ]),

        registro:
            pegar(p, [
                "REGISTRO PROFISSIONAL",
                "REGISTRO"
            ]),

        projeto:
            pegar(p, [
                "NOME DO PROJETO",
                "PROJETO"
            ]),

        tipo:
            pegar(p, [
                "TIPO DE PROJETO",
                "TIPO PROJETO"
            ]),

        area:
            pegar(p, [
                "ÁREA",
                "AREA"
            ]),

        ambiente:
            pegar(p, [
                "AMBIENTE"
            ]),

        prazo:
            pegar(p, [
                "PRAZO"
            ]),

        descricao:
            pegar(p, [
                "DESCRIÇÃO / ORÇAMENTO",
                "DESCRIÇÃO",
                "DESCRIÇÃO / ORCAMENTO"
            ]),

        investimento:
            pegar(p, [
                "INVESTIMENTO"
            ]),

        observacoes:
            pegar(p, [
                "OBSERVAÇÕES",
                "OBSERVACOES"
            ]),

        arquivos:
            pegar(p, [
                "ARQUIVOS"
            ]),

        pasta:
            pegar(p, [
                "PASTA DO PROJETO"
            ]),

        status:
            pegar(p, [
                "STATUS"
            ]) || "Novo",

        notificacao:
            pegar(p, [
                "NOTIFICAÇÃO",
                "NOTIFICACAO"
            ])

    };

}


/* =====================================================
   CARREGAR PROJETOS
===================================================== */

async function carregarProjetos() {

    mostrarLoading();

    esconderErro();

    try {

        const resposta =
            await fetch(
                API_URL +
                "?acao=projetos&t=" +
                Date.now()
            );

        if (!resposta.ok) {

            throw new Error(
                "HTTP " +
                resposta.status
            );

        }

        const dados =
            await resposta.json();

        console.log(
            "Resposta recebida:",
            dados
        );


        if (!dados.sucesso) {

            throw new Error(
                dados.mensagem ||
                "Erro ao carregar projetos."
            );

        }


        projetos =
            Array.isArray(dados.projetos)
                ? dados.projetos
                : [];


        atualizarDashboard();

        renderizarTabela(
            projetos
        );


        document.getElementById(
            "statusTexto"
        ).textContent =
            "Sistema conectado";


        document.getElementById(
            "statusBolinha"
        ).style.background =
            "#27ae60";

    }

    catch (erro) {

        console.error(
            "Erro:",
            erro
        );

        mostrarErro(
            "Não foi possível carregar os projetos. " +
            "Verifique se o Apps Script está publicado " +
            "e se a implantação está atualizada."
        );


        document.getElementById(
            "statusTexto"
        ).textContent =
            "Erro de conexão";


        document.getElementById(
            "statusBolinha"
        ).style.background =
            "#c0392b";

    }

}


/* =====================================================
   LOADING
===================================================== */

function mostrarLoading() {

    document.getElementById(
        "tabelaContainer"
    ).innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Carregando projetos...

        </div>

    `;

}


/* =====================================================
   DASHBOARD
===================================================== */

function atualizarDashboard() {

    const lista =
        projetos.map(
            normalizarProjeto
        );


    document.getElementById(
        "totalProjetos"
    ).textContent =
        lista.length;


    document.getElementById(
        "totalNovos"
    ).textContent =
        lista.filter(
            p => p.status === "Novo"
        ).length;


    document.getElementById(
        "totalAnalise"
    ).textContent =
        lista.filter(
            p => p.status === "Em análise"
        ).length;


    document.getElementById(
        "totalFechados"
    ).textContent =
        lista.filter(
            p => p.status === "Fechado"
        ).length;

}


/* =====================================================
   RENDERIZAR TABELA
===================================================== */

function renderizarTabela(lista) {

    if (!lista.length) {

        document.getElementById(
            "tabelaContainer"
        ).innerHTML = `

            <div class="loading">

                Nenhum projeto encontrado.

            </div>

        `;

        return;

    }


    let html = `

        <table>

            <thead>

                <tr>

                    <th>Número</th>
                    <th>Data</th>
                    <th>Projeto</th>
                    <th>Arquiteto</th>
                    <th>Escritório</th>
                    <th>Cidade</th>
                    <th>Área</th>
                    <th>Status</th>
                    <th>Ação</th>

                </tr>

            </thead>

            <tbody>

    `;


    lista.forEach(
        function(item) {

            const p =
                normalizarProjeto(item);


            html += `

                <tr>

                    <td>
                        <strong>
                            ${escapar(p.id) || "-"}
                        </strong>
                    </td>

                    <td>
                        ${escapar(p.data) || "-"}
                    </td>

                    <td>
                        ${escapar(p.projeto) || "-"}
                    </td>

                    <td>
                        ${escapar(p.nome) || "-"}
                    </td>

                    <td>
                        ${escapar(p.escritorio) || "-"}
                    </td>

                    <td>
                        ${escapar(p.cidade) || "-"}
                    </td>

                    <td>
                        ${
                            p.area
                                ? escapar(p.area) + " m²"
                                : "-"
                        }
                    </td>

                    <td>
                        ${criarBadgeStatus(p.status)}
                    </td>

                    <td>

                        <button
                            class="btn-detalhes"
                            onclick="abrirDetalhes(${item._linha})"
                        >
                            Ver detalhes
                        </button>

                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

    `;


    document.getElementById(
        "tabelaContainer"
    ).innerHTML =
        html;

}


/* =====================================================
   BADGE STATUS
===================================================== */

function criarBadgeStatus(status) {

    let classe =
        "status-novo";


    if (status === "Em análise") {
        classe = "status-analise";
    }

    if (status === "Orçamento") {
        classe = "status-orcamento";
    }

    if (status === "Fechado") {
        classe = "status-fechado";
    }

    if (status === "Cancelado") {
        classe = "status-cancelado";
    }


    return `
        <span class="status ${classe}">
            ${escapar(status || "Novo")}
        </span>
    `;

}


/* =====================================================
   ABRIR DETALHES
===================================================== */

function abrirDetalhes(linha) {

    const original =
        projetos.find(
            function(p) {

                return Number(
                    p._linha
                ) === Number(linha);

            }
        );


    if (!original) {

        alert(
            "Projeto não encontrado."
        );

        return;

    }


    const p =
        normalizarProjeto(
            original
        );


    projetoSelecionado =
        p;


    const valor =
        function(v) {

            return v
                ? escapar(v)
                : "Não informado";

        };


    let arquivosHTML =
        valor(p.arquivos);


    if (
        p.arquivos &&
        p.arquivos.includes("http")
    ) {

        arquivosHTML =
            transformarLinks(
                p.arquivos
            );

    }


    let pastaHTML =
        valor(p.pasta);


    if (
        p.pasta &&
        p.pasta.includes("http")
    ) {

        pastaHTML = `

            <a
                class="link"
                href="${escaparAtributo(p.pasta)}"
                target="_blank"
            >
                📁 Abrir pasta do projeto
            </a>

        `;

    }


    document.getElementById(
        "modalConteudo"
    ).innerHTML = `

        <div class="detalhes-grid">

            ${campo("Número do projeto", valor(p.id))}

            ${campo("Data", valor(p.data))}

            ${campo("Nome", valor(p.nome))}

            ${campo("Escritório", valor(p.escritorio))}

            ${campo("E-mail", valor(p.email))}

            ${campo("WhatsApp", valor(p.whatsapp))}

            ${campo("Cidade", valor(p.cidade))}

            ${campo("Estado", valor(p.estado))}

            ${campo("Registro profissional", valor(p.registro))}

            ${campo("Nome do projeto", valor(p.projeto))}

            ${campo("Tipo de projeto", valor(p.tipo))}

            ${campo(
                "Área",
                p.area
                    ? escapar(p.area) + " m²"
                    : "Não informado"
            )}

            ${campo("Ambiente", valor(p.ambiente))}

            ${campo("Prazo", valor(p.prazo))}

            ${campo("Investimento", valor(p.investimento))}

            ${campo(
                "Status",
                criarBadgeStatus(p.status)
            )}

            ${campo(
                "Notificação",
                valor(p.notificacao)
            )}

            ${campoFull(
                "Descrição / orçamento",
                valor(p.descricao)
            )}

            ${campoFull(
                "Observações",
                valor(p.observacoes)
            )}

            ${campoFull(
                "Arquivos",
                arquivosHTML
            )}

            ${campoFull(
                "Pasta do projeto",
                pastaHTML
            )}

        </div>


        <div class="status-area">

            <label>
                Alterar status
            </label>

            <select id="novoStatus">

                <option value="Novo"
                    ${p.status === "Novo" ? "selected" : ""}>
                    Novo
                </option>

                <option value="Em análise"
                    ${p.status === "Em análise" ? "selected" : ""}>
                    Em análise
                </option>

                <option value="Orçamento"
                    ${p.status === "Orçamento" ? "selected" : ""}>
                    Orçamento
                </option>

                <option value="Fechado"
                    ${p.status === "Fechado" ? "selected" : ""}>
                    Fechado
                </option>

                <option value="Cancelado"
                    ${p.status === "Cancelado" ? "selected" : ""}>
                    Cancelado
                </option>

            </select>


            <button
                class="btn-status"
                onclick="alterarStatus()"
            >
                Salvar status
            </button>

        </div>

    `;


    document.getElementById(
        "modal"
    ).classList.add("active");

}

/* =====================================================
   ALTERAR STATUS
===================================================== */

async function alterarStatus() {

    if (!projetoSelecionado) {

        return;

    }


    const select =
        document.getElementById(
            "novoStatus"
        );


    const novoStatus =
        select.value;


    if (!novoStatus) {

        alert(
            "Selecione um status."
        );

        return;

    }


    const linha =
        projetoSelecionado.linha;


    try {

        const url =
            API_URL +
            "?acao=atualizarStatus" +
            "&linha=" +
            encodeURIComponent(linha) +
            "&status=" +
            encodeURIComponent(novoStatus) +
            "&t=" +
            Date.now();


        const resposta =
            await fetch(url);


        const dados =
            await resposta.json();


        console.log(
            "Resposta status:",
            dados
        );


        if (!dados.sucesso) {

            throw new Error(
                dados.mensagem ||
                dados.erro ||
                "Erro ao atualizar status."
            );

        }


        alert(
            "Status atualizado com sucesso."
        );


        fecharModal();


        await carregarProjetos();

    }

    catch (erro) {

        console.error(
            erro
        );

        alert(
            "Não foi possível atualizar o status.\n\n" +
            erro.message
        );

    }

}


/* =====================================================
   FILTRAR
===================================================== */

function filtrarProjetos() {

    const busca =
        document.getElementById(
            "busca"
        ).value
        .toLowerCase()
        .trim();


    const filtro =
        document.getElementById(
            "filtroStatus"
        ).value;


    const filtrados =
        projetos.filter(
            function(item) {

                const p =
                    normalizarProjeto(
                        item
                    );


                const texto = (

                    p.id + " " +
                    p.data + " " +
                    p.nome + " " +
                    p.escritorio + " " +
                    p.email + " " +
                    p.whatsapp + " " +
                    p.cidade + " " +
                    p.estado + " " +
                    p.registro + " " +
                    p.projeto + " " +
                    p.tipo + " " +
                    p.area + " " +
                    p.descricao + " " +
                    p.observacoes

                ).toLowerCase();


                const correspondeBusca =
                    !busca ||
                    texto.includes(busca);


                const correspondeStatus =
                    !filtro ||
                    p.status === filtro;


                return (
                    correspondeBusca &&
                    correspondeStatus
                );

            }
        );


    renderizarTabela(
        filtrados
    );

}

   FECHAR MODAL
===================================================== */

function fecharModal() {

    document.getElementById(
        "modal"
    ).classList.remove(
        "active"
    );


    projetoSelecionado =
        null;

}

function fecharModalFora(event) {

        event.target.id ===
        "modal"
    ) {

        fecharModal();

    }

}


/* =====================================================
   ERRO
===================================================== */

function mostrarErro(mensagem) {

    document.getElementById(
        "mensagemErro"
    ).innerHTML = `

        <div class="erro">

            ${escapar(mensagem)}

        </div>

    `;

}


function esconderErro() {

    document.getElementById(
        "mensagemErro"
    ).innerHTML = "";

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapar(valor) {

    return String(
        valor === undefined ||
        valor === null
            ? ""
            : valor
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   ESCAPAR ATRIBUTO
===================================================== */

function escaparAtributo(valor) {

    return escapar(valor);

}


/* =====================================================
   TRANSFORMAR LINKS
===================================================== */

function transformarLinks(texto) {

    return escapar(texto)
        .replace(
            /(https?:\/\/[^\s<]+)/g,
            function(url) {

                return `

                    <a
                        class="link"
                        href="${url}"
                        target="_blank"
                    >
                        ${url}
                    </a>

                `;

            }
        );

}
