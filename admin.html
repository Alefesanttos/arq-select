<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARQSELECT | CRM 4.0</title>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--surface2:#f8fafc;--text:#101828;--muted:#667085;--line:#e4e7ec;--dark:#0b1220;--accent:#c8a457;--success:#12b76a;--warn:#f79009;--danger:#f04438;--shadow:0 14px 40px rgba(16,24,40,.08);--r:18px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#c8a45722,transparent 35%),linear-gradient(135deg,#07101e,#111827)}
.login-card{width:min(430px,100%);background:#fff;border-radius:28px;padding:34px;box-shadow:0 40px 120px #0007}.logo{font-weight:950;letter-spacing:.14em;font-size:24px}.logo span{color:var(--accent)}.ey{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:#8b6b24;font-weight:900;margin-top:18px}
h1,h2,h3,p{margin:0}.login h1{font-size:32px;margin-top:8px}.muted{color:var(--muted);line-height:1.6}label{display:block;font-size:12px;font-weight:800;margin:18px 0 7px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff;color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px #c8a45719}
.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:850;background:#101828;color:#fff}.btn.gold{background:linear-gradient(135deg,#e2c783,#b88e35);color:#16120a}.btn.light{background:#eef2f6;color:#101828}.btn.danger{background:#fee4e2;color:#b42318}
.msg{min-height:18px;margin-top:12px;font-size:13px;color:var(--danger)}
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;background:var(--dark);color:#fff;padding:22px 16px;display:flex;flex-direction:column}
.side-brand{padding:8px 10px 24px;border-bottom:1px solid #ffffff14}.side-brand .logo span{color:#e7c977}.admin-user{margin-top:16px;padding:12px;border:1px solid #ffffff12;border-radius:14px;background:#ffffff08}
.nav{display:grid;gap:7px;margin-top:20px}.nav button{text-align:left;border:0;background:transparent;color:#cbd5e1;padding:12px 13px;border-radius:12px;font-weight:750}.nav button:hover,.nav button.active{background:#ffffff10;color:#fff}
.main{padding:26px;overflow:hidden}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.top-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:900}.stat-value{font-size:31px;font-weight:950;margin-top:7px}.stat-sub{font-size:12px;color:var(--muted);margin-top:4px}
.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:12px}.section-head h2{font-size:18px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.toolbar>*{max-width:300px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}table{width:100%;min-width:940px;border-collapse:collapse}th,td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);background:var(--surface2)}tbody tr:hover{background:#fafbfc}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900;background:#eef2f6;color:#475467}.badge.green{background:#d1fadf;color:#067647}.badge.gold{background:#fff4cc;color:#8b6b24}.badge.red{background:#fee4e2;color:#b42318}.badge.blue{background:#dbeafe;color:#1d4ed8}
.user-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.user-card{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center}.avatar{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#101828,#344054);color:#fff;display:grid;place-items:center;font-weight:950}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.notif{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding:14px 2px}.notif:last-child{border-bottom:0}.dot{width:10px;height:10px;background:#f79009;border-radius:50%;margin-top:7px;flex:0 0 auto}
.empty{padding:50px;text-align:center;color:var(--muted)}.loader{display:grid;place-items:center;min-height:120px;color:var(--muted)}
.toast{position:fixed;right:20px;bottom:20px;z-index:100;display:none;background:#101828;color:#fff;padding:13px 16px;border-radius:12px;box-shadow:0 20px 50px #0003}.toast.show{display:block}
.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:18px;z-index:90}.modal.open{display:grid}.modal-card{background:#fff;width:min(900px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:22px}.modal-head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail{display:grid;gap:9px}.kv{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}.kv b{display:block;font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.user-grid{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.side{position:static;height:auto}.nav{grid-template-columns:repeat(4,minmax(0,1fr))}.main{padding:16px}}
@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.nav{grid-template-columns:repeat(2,1fr)}.topbar{align-items:flex-start;flex-direction:column}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login">
  <form id="loginForm" class="login-card">
    <div class="logo">ARQ<span>SELECT</span></div><div class="ey">CRM administrativo 4.0</div>
    <h1>Central de gestão</h1><p class="muted" style="margin-top:8px">Controle arquitetos, fornecedores, produtos, projetos, oportunidades, notificações e relacionamento.</p>
    <label>Usuário</label><input id="user" autocomplete="username" required>
    <label>Senha</label><input id="pass" type="password" autocomplete="current-password" required>
    <button class="btn gold" style="width:100%;margin-top:20px">Entrar no CRM</button><div id="loginMsg" class="msg"></div>
  </form>
</div>
<div id="app" class="shell hidden">
  <aside class="side">
    <div class="side-brand"><div class="logo">ARQ<span>SELECT</span></div><div class="ey" style="color:#d6b96b">ADMIN</div><div class="admin-user"><div style="font-size:11px;color:#98a2b3">Sessão</div><div id="adminName" style="margin-top:4px;font-weight:850">Administrador</div></div></div>
    <div class="nav">
      <button class="active" data-page="dashboard">Dashboard</button><button data-page="usuarios">Usuários</button><button data-page="fornecedores">Fornecedores</button><button data-page="produtos">Produtos</button><button data-page="projetos">Projetos</button><button data-page="solicitacoes">Solicitações</button><button data-page="propostas">Propostas</button><button data-page="chat">Chat</button><button data-page="notificacoes">Notificações <span id="notifCount" class="badge gold" style="float:right">0</span></button><button data-page="historico">Histórico</button><button id="logout">Sair</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar"><div><div class="ey">ARQSELECT CRM</div><h1 id="pageTitle" style="font-size:28px;margin-top:5px">Dashboard</h1></div><div class="top-actions"><button class="btn light" id="refresh">Atualizar</button><button class="btn gold" id="setup">Preparar estrutura</button></div></div>
    <div id="content"><div class="loader">Carregando CRM...</div></div>
  </main>
</div>
<div id="modal" class="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Detalhes</h2><button class="btn light" id="closeModal">Fechar</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbz_jLzNa87U_himraaCczzqGpQdq63AyIVogQ9-YGnqXuQYl3OSJfV4E7xYfPdnv8-d/exec"; const SK="ARQSELECT_ADMIN_TOKEN"; let token=localStorage.getItem(SK)||"",dashboard=null,usuarios=[],notificacoes=[],currentPage="dashboard",autoRefresh=null;
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
async function api(acao,data={}){const p=new URLSearchParams();p.set("acao",acao);Object.entries({...data,token}).forEach(([k,v])=>{if(v!==undefined&&v!==null)p.set(k,Array.isArray(v)?v.join(","):v)});const r=await fetch(API_URL+"?"+p.toString(),{method:"GET",cache:"no-store"});const j=await r.json();if(j.autorizado===false&&/sessão|login|expirada|credenciais/i.test(j.mensagem||"")){logout(false);throw Error(j.mensagem||"Sessão expirada")}return j}
function toast(msg){ $("toast").textContent=msg;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2600)}
function badge(v){const s=String(v||"");const c=/aprov|ativo|conclu|enviada|aceita/i.test(s)?"green":/pend|nova|negoc/i.test(s)?"gold":/recus|bloq|inativ/i.test(s)?"red":"blue";return `<span class="badge ${c}">${esc(s||"—")}</span>`}
function modal(title,html){$("modalTitle").textContent=title;$("modalBody").innerHTML=html;$("modal").classList.add("open")}
$("closeModal").onclick=()=>$("modal").classList.remove("open");$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("open")};
async function apiNoToken(acao,data={}){const p=new URLSearchParams({acao,...data});const r=await fetch(API_URL+"?"+p.toString(),{cache:"no-store"});return r.json()}
async function login(e){e.preventDefault();$("loginMsg").textContent="Entrando...";try{const j=await apiNoToken("login",{usuario:$("user").value,senha:$("pass").value});if(!j.sucesso)throw Error(j.mensagem||"Login inválido");token=j.token;localStorage.setItem(SK,token);start()}catch(x){$("loginMsg").textContent=x.message}}
function logout(reload=true){localStorage.removeItem(SK);token="";if(autoRefresh)clearInterval(autoRefresh);$("app").classList.add("hidden");$("login").classList.remove("hidden");if(reload)location.reload()}
$("loginForm").onsubmit=login;$("logout").onclick=()=>logout();$("refresh").onclick=()=>loadPageData(currentPage);
async function start(){$("login").classList.add("hidden");$("app").classList.remove("hidden");await loadDashboard();startPolling()}
async function loadDashboard(){try{const j=await api("admin_v4_dashboard");if(!j.sucesso)throw Error(j.mensagem||"Falha");dashboard=j.indicadores;usuarios=j.ultimosUsuarios||[];notificacoes=j.ultimasNotificacoes||[];$("notifCount").textContent=dashboard.notificacoesNaoLidas??0;render()}catch(e){toast(e.message)}}
function startPolling(){if(autoRefresh)clearInterval(autoRefresh);autoRefresh=setInterval(async()=>{try{const j=await api("admin_v4_dashboard");if(j.sucesso){dashboard=j.indicadores;usuarios=j.ultimosUsuarios||usuarios;notificacoes=j.ultimasNotificacoes||notificacoes;$("notifCount").textContent=dashboard.notificacoesNaoLidas??0;if(currentPage==="dashboard")render()}}catch(e){}},12000)}
function nav(page){currentPage=page;document.querySelectorAll(".nav button[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));$("pageTitle").textContent={dashboard:"Dashboard",usuarios:"Usuários",fornecedores:"Fornecedores",produtos:"Produtos",projetos:"Projetos",solicitacoes:"Solicitações",propostas:"Propostas",chat:"Chat",notificacoes:"Notificações",historico:"Histórico"}[page]||"ARQSELECT";renderPage(page)}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>nav(b.dataset.page));
$("setup").onclick=async()=>{try{const j=await api("v4_setup");toast(j.mensagem||"Estrutura preparada");await loadDashboard()}catch(e){toast(e.message)}};
const pageData={};
async function loadPageData(page){if(page==="dashboard")return loadDashboard();try{let j;if(page==="usuarios"||page==="fornecedores")j=await api("admin_v4_usuarios",{tipo:page==="fornecedores"?"FORNECEDOR":"","busca":""});else j=await api("admin_v4_listar",{modulo:page});if(j)pageData[page]=j;renderPage(page)}catch(e){toast(e.message)}}
function render(){renderPage(currentPage)} function renderPage(page){if(page==="dashboard")renderDashboard();else if(page==="usuarios"||page==="fornecedores")renderUsuarios(page);else if(page==="notificacoes"){renderNotifs();loadNotifs()}else if(page==="chat")renderChat();else renderTable(page)}
function renderDashboard(){const d=dashboard||{};$("content").innerHTML=`<div class="grid">${[["Arquitetos",d.arquitetos,"Usuários cadastrados"],["Fornecedores",d.fornecedores,"Parceiros cadastrados"],["Fornecedores pendentes",d.fornecedoresPendentes,"Aguardando análise"],["Produtos",d.produtos,"Catálogo"],["Projetos",d.projetos,"Total"],["Projetos ativos",d.projetosAtivos,"Em andamento"],["Solicitações",d.solicitacoes,"Cotações"],["Propostas",d.propostas,"Recebidas"],["Conversas",d.conversas,"Relacionamento"],["Mensagens não lidas",d.mensagensNaoLidas,"Atendimento"],["Notificações",d.notificacoesNaoLidas,"Não lidas"],["Novos cadastros",d.novosCadastros,"Hoje"]].map(x=>`<div class="card"><div class="stat-label">${esc(x[0])}</div><div class="stat-value">${x[1]??0}</div><div class="stat-sub">${esc(x[2])}</div></div>`).join("")}</div><div class="section"><div class="section-head"><h2>Últimos cadastros</h2><button class="btn light" onclick="nav('usuarios')">Ver usuários</button></div><div class="card">${(usuarios||[]).slice(0,8).map(u=>`<div class="notif"><div class="avatar">${esc((u.NOME||"?").slice(0,1).toUpperCase())}</div><div><b>${esc(u.NOME||"—")}</b><div class="muted">${esc(u.EMPRESA||"")} · ${esc(u.TIPO||"")}</div><div style="margin-top:4px">${badge(u.STATUS)} <span class="muted" style="margin-left:7px">${esc(u["E-MAIL"]||"")}</span></div></div></div>`).join("")||'<div class="empty">Nenhum cadastro.</div>'}</div></div>`}
function renderUsuarios(page){const list=(pageData[page]&&pageData[page].usuarios)||usuarios;const filtr=list.filter(x=>page==="fornecedores"?x.TIPO==="FORNECEDOR":true);$("content").innerHTML=`<div class="section-head"><div class="toolbar"><input id="searchUser" placeholder="Buscar nome, empresa, e-mail, CNPJ/CAU..." oninput="filterUsers(this.value)"></div><div class="muted">${filtr.length} registro(s)</div></div><div id="userGrid" class="user-grid">${renderUserCards(filtr)}</div>`}
function renderUserCards(list){return list.length?list.map(u=>`<div class="card user-card"><div class="avatar">${esc((u.NOME||"?").slice(0,1).toUpperCase())}</div><div><b>${esc(u.NOME||"—")}</b><div class="muted">${esc(u.EMPRESA||"—")}</div><div style="margin-top:5px">${badge(u.TIPO)} ${badge(u.STATUS)}</div><div class="muted" style="margin-top:5px">${esc(u["E-MAIL"]||"")} · ${esc(u.TELEFONE||"")}</div></div><div class="actions"><button class="btn light" onclick='showUser(${JSON.stringify(u)})'>Ver</button>${u.TIPO==="FORNECEDOR"?`<button class="btn gold" onclick="openSupplier('${esc(u.ID)}')">CRM</button>`:""}</div></div>`).join(""):'<div class="card empty" style="grid-column:1/-1">Nenhum usuário encontrado.</div>'}
function filterUsers(q){const all=(pageData[currentPage]&&pageData[currentPage].usuarios)||usuarios;const list=all.filter(x=>currentPage==="fornecedores"?x.TIPO==="FORNECEDOR":true).filter(x=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase()));$("userGrid").innerHTML=renderUserCards(list)}
function showUser(u){modal("Cadastro completo",`<div class="detail">${Object.entries(u).filter(([k])=>k!=="_linha").map(([k,v])=>`<div class="kv"><b>${esc(k)}</b>${esc(v||"—")}</div>`).join("")}</div>`)}
async function openSupplier(id){try{const j=await api("admin_v4_fornecedor",{id});if(!j.sucesso)throw Error(j.mensagem||"Erro");modal("CRM do fornecedor",`<div class="grid"><div class="card"><div class="stat-label">Produtos</div><div class="stat-value">${j.produtos.length}</div></div><div class="card"><div class="stat-label">Projetos</div><div class="stat-value">${j.projetos.length}</div></div></div><div class="section"><div class="kv"><b>Empresa</b>${esc(j.usuario.EMPRESA||j.usuario.NOME)}</div><div class="kv"><b>E-mail</b>${esc(j.usuario["E-MAIL"])}</div></div>`)}catch(e){toast(e.message)}}
function renderNotifs(){const n=notificacoes||[];$("content").innerHTML=`<div class="section-head"><h2>Central de notificações</h2><button class="btn light" onclick="readAll()">Marcar todas como lidas</button></div><div class="card">${n.length?n.map(x=>`<div class="notif" style="cursor:pointer" onclick="readNotif('${esc(x.ID)}')"><div class="dot"></div><div><b>${esc(x.TITULO)}</b><div class="muted">${esc(x.MENSAGEM)}</div><div class="muted" style="margin-top:4px">${esc(x.DATA||"")} · ${badge(x.LIDA)}</div></div></div>`).join(""):'<div class="empty">Nenhuma notificação.</div>'}</div>`}
async function loadNotifs(){const j=await api("admin_v4_notificacoes",{limite:100});notificacoes=j.notificacoes||[];$("notifCount").textContent=j.naoLidas??0;renderNotifs()}
async function readNotif(id){await api("admin_v4_notificacao_lida",{id});await loadNotifs()}async function readAll(){await api("admin_v4_notificacoes_todas_lidas");await loadNotifs();toast("Notificações marcadas como lidas")}
function renderChat(){$("content").innerHTML=`<div class="section-head"><h2>Central de conversas</h2></div><div id="chatBox" class="card"><div class="loader">Carregando conversas...</div></div>`;loadChat()}
async function loadChat(){try{const j=await api("admin_v4_conversas");const c=j.conversas||[];$("chatBox").innerHTML=c.length?c.map(x=>`<div class="notif"><div class="avatar">💬</div><div><b>${esc(x["PARTICIPANTE A"])} ↔ ${esc(x["PARTICIPANTE B"])}</b><div class="muted">${esc(x["ULTIMA MENSAGEM"]||"Sem mensagens")} · ${esc(x["ULTIMA DATA"]||"")}</div><div class="actions" style="margin-top:7px"><button class="btn light" onclick="openConv('${esc(x.ID)}')">Abrir conversa</button></div></div></div>`).join(""):'<div class="empty">Nenhuma conversa criada ainda.</div>'}catch(e){$("chatBox").innerHTML='<div class="empty">Não foi possível carregar as conversas.</div>'}}
async function openConv(id){const j=await api("admin_v4_mensagens",{conversaId:id});if(!j.sucesso){toast(j.mensagem);return}const msgs=j.mensagens||[];modal("Conversa",`<div style="display:grid;gap:10px">${msgs.map(m=>`<div class="kv"><b>${esc(m["REMETENTE NOME"]||m["REMETENTE ID"])}</b>${esc(m.MENSAGEM)}<div class="muted" style="margin-top:5px">${esc(m.DATA)}</div></div>`).join("")||'<div class="empty">Sem mensagens.</div>'}</div>`)}
function renderTable(page){if(page==="projetos"){loadProjectsTable();return}const d=(pageData[page]&&pageData[page].dados)||[];if(!d.length){$("content").innerHTML='<div class="card empty">Nenhum registro encontrado. Use Atualizar para carregar.</div>';loadPageData(page);return}const keys=Object.keys(d[0]).filter(k=>k!=="_linha").slice(0,9);$("content").innerHTML=`<div class="card"><div class="table-wrap"><table><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join("")}</tr></thead><tbody>${d.slice(0,150).map(r=>`<tr>${keys.map(k=>`<td>${esc(r[k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`}
async function loadProjectsTable(){try{const j=await api("admin_v4_listar",{modulo:"projetos"});pageData.projetos=j;const d=j.dados||[];$("content").innerHTML=`<div class="card"><div class="table-wrap"><table><thead><tr><th>ID</th><th>Projeto</th><th>Arquiteto</th><th>Fornecedor</th><th>Status</th><th>Data</th><th>Interação</th></tr></thead><tbody>${d.slice(0,150).map(r=>`<tr><td>${esc(r["ID PROJETO"])}</td><td><b>${esc(r["NOME DO PROJETO"])}</b></td><td>${esc(r.NOME)}</td><td>${esc(r["FORNECEDOR NOME"])}</td><td>${badge(r.STATUS)}</td><td>${esc(r["DATA / HORA"])}</td><td>${esc(r["ULTIMA INTERAÇÃO"])}</td></tr>`).join("")||'<tr><td colspan="7">Nenhum projeto.</td></tr>'}</tbody></table></div></div>`}catch(e){toast(e.message)}}
async function init(){if(!token)return;$("login").classList.add("hidden");$("app").classList.remove("hidden");try{await api("sessao");await start()}catch(e){logout(false)}}init();
</script>
</body></html>
