<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}

.login-card{width:min(430px,100%);background:#fff;border-radius:28px;padding:34px;box-shadow:0 40px 120px #0007}.logo{font-weight:950;letter-spacing:.14em;font-size:24px}.logo span{color:var(--accent)}.ey{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:#8b6b24;font-weight:900;margin-top:18px}

.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:850;background:#101828;color:#fff}.btn.gold{background:linear-gradient(135deg,#e2c783,#b88e35);color:#16120a}.btn.light{background:#eef2f6;color:#101828}.btn.danger{background:#fee4e2;color:#b42318}
.msg{min-height:18px;margin-top:12px;font-size:13px;color:var(--danger)}

.side-brand{padding:8px 10px 24px;border-bottom:1px solid #ffffff14}.side-brand .logo span{color:#e7c977}.admin-user{margin-top:16px;padding:12px;border:1px solid #ffffff12;border-radius:14px;background:#ffffff08}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:900}.stat-value{font-size:31px;font-weight:950;margin-top:7px}.stat-sub{font-size:12px;color:var(--muted);margin-top:4px}
.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:12px}.section-head h2{font-size:18px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.toolbar>*{max-width:300px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}table{width:100%;min-width:940px;border-collapse:collapse}th,td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);background:var(--surface2)}tbody tr:hover{background:#fafbfc}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900;background:#eef2f6;color:#475467}.badge.green{background:#d1fadf;color:#067647}.badge.gold{background:#fff4cc;color:#8b6b24}.badge.red{background:#fee4e2;color:#b42318}.badge.blue{background:#dbeafe;color:#1d4ed8}
.user-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.user-card{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center}.avatar{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#101828,#344054);color:#fff;display:grid;place-items:center;font-weight:950}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.notif{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding:14px 2px}.notif:last-child{border-bottom:0}.dot{width:10px;height:10px;background:#f79009;border-radius:50%;margin-top:7px;flex:0 0 auto}
.empty{padding:50px;text-align:center;color:var(--muted)}.loader{display:grid;place-items:center;min-height:120px;color:var(--muted)}
.toast{position:fixed;right:20px;bottom:20px;z-index:100;display:none;background:#101828;color:#fff;padding:13px 16px;border-radius:12px;box-shadow:0 20px 50px #0003}.toast.show{display:block}
.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:18px;z-index:90}.modal.open{display:grid}.modal-card{background:#fff;width:min(900px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:22px}.modal-head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:15px}

function renderEnviarProjeto(){
  const d=pageData["enviar-projeto"]||{};const projetos=Array.isArray(d.projetos)?d.projetos:[];const fornecedores=Array.isArray(d.fornecedores)?d.fornecedores:[];
  $("content").innerHTML=`<div class="section-head"><div><h2>Enviar projeto ao fornecedor</h2><div class="muted">Escolha o projeto, o fornecedor e exatamente o que deseja compartilhar.</div></div><button class="btn light" onclick="loadPageData('enviar-projeto')">Atualizar</button></div><div class="grid"><div class="card"><label>Projeto<select id="sendProjeto" onchange="previewProjetoEnvio()"><option value="">Selecione um projeto...</option>${projetos.map(p=>`<option value="${esc(p["ID PROJETO"]||p.ID||"")}">${esc(p["NOME DO PROJETO"]||p.NOME||p["ID PROJETO"]||p.ID||"")}</option>`).join('')}</select></label><div id="projectPreview" class="muted" style="margin-top:12px">Selecione um projeto para visualizar os dados.</div></div><div class="card"><label>Fornecedor<select id="sendFornecedores" multiple size="8">${fornecedores.map(u=>`<option value="${esc(u.ID)}">${esc(u.EMPRESA||u.NOME||u["E-MAIL"]||u.ID)} · ${esc(u["E-MAIL"]||"")}</option>`).join('')}</select></label><div class="muted" style="margin-top:8px">Segure Ctrl (Windows) ou Cmd (Mac) para selecionar vários.</div></div></div><div class="card" style="margin-top:15px"><h3>Conteúdo a compartilhar</h3><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px"><label><input type="checkbox" id="cNome" checked> Identificação do projeto</label><label><input type="checkbox" id="cCliente" checked> Cliente</label><label><input type="checkbox" id="cTipo" checked> Tipo de projeto</label><label><input type="checkbox" id="cLocal" checked> Localização</label><label><input type="checkbox" id="cArea" checked> Área</label><label><input type="checkbox" id="cPrazo" checked> Prazo</label><label><input type="checkbox" id="cArq" checked> Arquiteto/contato</label><label><input type="checkbox" id="cDesc" checked> Descrição/observações</label><label><input type="checkbox" id="cLinks" style="grid-column:1/-1"> Incluir links/arquivos encontrados no projeto</label></div><label style="display:block;margin-top:15px">Mensagem adicional<textarea id="sendMsg" rows="5" placeholder="Ex.: Precisamos de orçamento para este projeto, com prazo e condições comerciais."></textarea></label><div class="actions" style="justify-content:flex-end;margin-top:12px"><button class="btn gold" onclick="enviarProjetoSelecionado()">📁 Enviar projeto aos fornecedores selecionados</button></div></div>`;
}
function previewProjetoEnvio(){const sel=$("sendProjeto");const id=sel.value;const p=(pageData["enviar-projeto"]?.projetos||[]).find(x=>String(x["ID PROJETO"]||x.ID||"")===String(id));const box=$("projectPreview");if(!p){box.innerHTML='Selecione um projeto para visualizar os dados.';return;}const pares=[["Projeto",p["NOME DO PROJETO"]||p.NOME],["Cliente",p.CLIENTE||p["NOME CLIENTE"]],["Tipo",p["TIPO DE PROJETO"]||p.TIPO],["Localização",p.CIDADE||p.LOCALIZAÇÃO||p.LOCALIZACAO],["Área",p["ÁREA"]||p.AREA],["Prazo",p.PRAZO],["Status",p.STATUS]];box.innerHTML='<div style="display:grid;gap:6px">'+pares.filter(x=>String(x[1]||"").trim()).map(x=>`<div><b>${esc(x[0])}:</b> ${esc(x[1])}</div>`).join('')+'</div>'}
async function enviarProjetoSelecionado(){try{const projetoId=$("sendProjeto").value;if(!projetoId)return toast("Selecione um projeto.");const sel=$("sendFornecedores");const fornecedores=Array.from(sel.selectedOptions).map(o=>o.value);if(!fornecedores.length)return toast("Selecione pelo menos um fornecedor.");const campos=[];if($("cNome").checked)campos.push("nome");if($("cCliente").checked)campos.push("cliente");if($("cTipo").checked)campos.push("tipo");if($("cLocal").checked)campos.push("localizacao");if($("cArea").checked)campos.push("area");if($("cPrazo").checked)campos.push("prazo");if($("cArq").checked)campos.push("arquiteto");if($("cDesc").checked)campos.push("descricao");const btn=document.querySelector('[onclick="enviarProjetoSelecionado()"]');if(btn){btn.disabled=true;btn.textContent="Enviando...";}const j=await api("admin_v4_projeto_enviar_fornecedor",{projetoId,fornecedores,campos,incluirLinks:$("cLinks").checked?"SIM":"NAO",mensagem:$("sendMsg").value});toast(j.mensagem||"Projeto enviado.");await loadChat();}catch(e){console.error(e);toast(e.message||"Não foi possível enviar o projeto.");}finally{const btn=document.querySelector('[onclick="enviarProjetoSelecionado()"]');if(btn){btn.disabled=false;btn.textContent="📁 Enviar projeto aos fornecedores selecionados";}}}

function brl(v){const n=Number(String(v??0).replace(/\./g,'').replace(',','.'));return isFinite(n)?n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'R$ 0,00'}
function renderNegocios(){const d=pageData.negocios||{},r=d.resumo||{};const ops=d.oportunidades||[],neg=d.negocios||[],faixas=d.faixas||[];$('content').innerHTML=`<div class="grid"><div class="card"><div class="stat-label">Oportunidades abertas</div><div class="stat-value">${r.oportunidadesAbertas??0}</div></div><div class="card"><div class="stat-label">Negociações</div><div class="stat-value">${r.negociacoes??0}</div></div><div class="card"><div class="stat-label">Negócios fechados</div><div class="stat-value">${r.negociosFechados??0}</div></div><div class="card"><div class="stat-label">Volume movimentado</div><div class="stat-value">${brl(r.volumeMovimentado)}</div></div><div class="card"><div class="stat-label">Comissões pendentes</div><div class="stat-value">${brl(r.comissoesPendentes)}</div></div><div class="card"><div class="stat-label">Comissões recebidas</div><div class="stat-value">${brl(r.comissoesRecebidas)}</div></div><div class="card"><div class="stat-label">Taxa de conversão</div><div class="stat-value">${Number(r.taxaConversao||0).toFixed(1)}%</div></div></div><div class="section"><div class="section-head"><div><h2>Oportunidades ARQSELECT</h2><div class="muted">Toda oportunidade direcionada pela ARQSELECT possui origem e rastreabilidade.</div></div><button class="btn light" onclick="loadPageData('negocios')">Atualizar</button></div><div class="card table-wrap"><table><thead><tr><th>Oportunidade</th><th>Projeto</th><th>Fornecedor</th><th>Origem</th><th>Status</th><th>Valor estimado</th><th></th></tr></thead><tbody>${ops.slice(0,150).map(o=>`<tr><td><b>${esc(o['ID OPORTUNIDADE'])}</b></td><td>${esc(o['ID PROJETO'])}</td><td>${esc(o['FORNECEDOR E-MAIL']||o['FORNECEDOR ID'])}</td><td>${esc(o.ORIGEM||'')}</td><td>${badge(o.STATUS)}</td><td>${brl(o['VALOR ESTIMADO'])}</td><td><button class="btn gold" onclick='registrarNegocio(${JSON.stringify(o).replace(/'/g,'&#39;')})'>Registrar fechamento</button></td></tr>`).join('')||'<tr><td colspan="7">Nenhuma oportunidade cadastrada.</td></tr>'}</tbody></table></div></div><div class="section"><div class="section-head"><div><h2>Negócios registrados</h2><div class="muted">Comissão calculada somente no registro de negócio fechado, conforme a configuração.</div></div></div><div class="card table-wrap"><table><thead><tr><th>ID</th><th>Oportunidade</th><th>Valor</th><th>Comissão</th><th>Status</th><th>Pagamento</th></tr></thead><tbody>${neg.slice(0,150).map(n=>`<tr><td>${esc(n.ID)}</td><td>${esc(n['OPORTUNIDADE ID'])}</td><td>${brl(n.VALOR)}</td><td>${Number(n['COMISSAO %']||0).toFixed(2)}% · ${brl(n['VALOR COMISSAO'])}</td><td>${badge(n.STATUS)}</td><td>${esc(n['PAGAMENTO STATUS']||'PENDENTE')}</td></tr>`).join('')||'<tr><td colspan="6">Nenhum negócio registrado.</td></tr>'}</tbody></table></div></div><div class="section"><div class="section-head"><h2>Configuração de comissão</h2><button class="btn gold" onclick="salvarComissoes()">Salvar faixas</button></div><div class="card table-wrap"><table><thead><tr><th>Mínimo</th><th>Máximo</th><th>%</th><th>Ativo</th></tr></thead><tbody>${faixas.map((f,i)=>`<tr><td><input data-com="min" data-i="${i}" value="${esc(f['VALOR MIN']??0)}"></td><td><input data-com="max" data-i="${i}" value="${esc(f['VALOR MAX']??'')}"></td><td><input data-com="pct" data-i="${i}" value="${esc(f.PERCENTUAL??0)}"></td><td><input type="checkbox" data-com="ativo" data-i="${i}" ${String(f.ATIVO).toLowerCase()==='1'||String(f.ATIVO).toLowerCase()==='sim'||String(f.ATIVO).toLowerCase()==='true'?'checked':''}></td></tr>`).join('')}</tbody></table></div></div>`}
async function registrarNegocio(o){const valor=prompt('Informe o valor final do negócio fechado:',String(o['VALOR ESTIMADO']||''));if(valor===null)return;try{const j=await api('admin_negocio_criar',{oportunidadeId:o['ID OPORTUNIDADE'],valor:valor,status:'NEGÓCIO FECHADO'});toast(j.mensagem||'Negócio registrado.');await loadPageData('negocios')}catch(e){toast(e.message)}}
async function salvarComissoes(){const d=pageData.negocios||{},faixas=(d.faixas||[]).map((f,i)=>({id:f.ID,min:document.querySelector(`[data-com="min"][data-i="${i}"]`)?.value||0,max:document.querySelector(`[data-com="max"][data-i="${i}"]`)?.value||'',percentual:document.querySelector(`[data-com="pct"][data-i="${i}"]`)?.value||0,ativo:document.querySelector(`[data-com="ativo"][data-i="${i}"]`)?.checked!==false,observacoes:f.OBSERVACOES||''}));try{await api('admin_comissao_salvar',{faixas:faixas});toast('Comissões atualizadas.');await loadPageData('negocios')}catch(e){toast(e.message)}}
function renderTable(page){if(page==="projetos"){loadProjectsTable();return}const d=(pageData[page]&&Array.isArray(pageData[page].dados)?pageData[page].dados:[]);if(!d.length){$("content").innerHTML='<div class="card empty">Nenhum registro encontrado.</div>';return}const keys=Object.keys(d[0]).filter(k=>k!=="_linha").slice(0,9);$("content").innerHTML=`<div class="card"><div class="table-wrap"><table><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join("")}</tr></thead><tbody>${d.slice(0,150).map(r=>`<tr>${keys.map(k=>`<td>${esc(r[k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`}
async function loadProjectsTable(){try{const j=await api("admin_v4_listar",{modulo:"projetos"});if(!j||j.sucesso===false)throw new Error(j?.mensagem||"Não foi possível carregar os projetos.");pageData.projetos=j;const d=Array.isArray(j.dados)?j.dados:[];$("content").innerHTML=`<div class="card"><div class="section-head"><div class="muted">${d.length} projeto(s) encontrado(s)</div><button class="btn light" onclick="loadProjectsTable()">Atualizar projetos</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Projeto</th><th>Arquiteto</th><th>Fornecedor</th><th>Status</th><th>Data</th><th>Interação</th></tr></thead><tbody>${d.slice(0,150).map(r=>`<tr><td>${esc(r["ID PROJETO"]||r.ID)}</td><td><b>${esc(r["NOME DO PROJETO"]||r.NOME||"—")}</b></td><td>${esc(r.NOME||r["ARQUITETO NOME"]||"—")}</td><td>${esc(r["FORNECEDOR NOME"]||"—")}</td><td>${badge(r.STATUS)}</td><td>${esc(r["DATA / HORA"]||r.DATA||"")}</td><td>${esc(r["ULTIMA INTERAÇÃO"]||"")}</td></tr>`).join("")||'<tr><td colspan="7">Nenhum projeto encontrado.</td></tr>'}</tbody></table></div></div>`}catch(e){console.error("[ARQSELECT] Projetos",e);$("content").innerHTML='<div class="card empty"><b>Falha ao carregar projetos.</b><div style="margin-top:8px">'+esc(e?.message||"Erro desconhecido")+'</div><button class="btn light" style="margin-top:14px" onclick="loadProjectsTable()">Tentar novamente</button></div>';toast(e?.message||"Falha ao carregar projetos.")}}
async function init(){if(!token)return;try{await api("sessao");await loadDashboard();startPolling()}catch(e){console.error("[ARQSELECT] Inicialização",e);logout(false)}}init();
</script>
</body></html>
