<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbx9KTCJWD06I890aM5KCWEJ-H2hZKQH_OARpCbefGvqOYnxVkLRpe-HTjPIlGDX4ikEBg/exec";


const form =
document.getElementById("projectForm");

const button =
document.getElementById("submitButton");

const message =
document.getElementById("message");

const arquivosInput =
document.getElementById("arquivos");


/* =====================================================
   CONVERTER ARQUIVO PARA BASE64
===================================================== */

function arquivoParaBase64(
  arquivo
) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onload =
        function() {

          resolve({
            nome:
              arquivo.name,

            tipo:
              arquivo.type,

            tamanho:
              arquivo.size,

            conteudo:
              reader.result
          });

        };


      reader.onerror =
        function() {

          reject(
            new Error(
              "Erro ao ler o arquivo " +
              arquivo.name
            )
          );

        };


      reader.readAsDataURL(
        arquivo
      );

    }
  );

}


/* =====================================================
   ENVIO
===================================================== */

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    button.disabled = true;

    button.textContent =
      "ENVIANDO PROJETO...";


    message.className =
      "message";

    message.textContent =
      "";


    try {

      /* -----------------------------------------------
         DADOS DO FORMULÁRIO
      ------------------------------------------------ */

      const formData =
        new FormData(form);


      const data = {};


      formData.forEach(
        function(value, key) {

          if (
            key !== "arquivos"
          ) {

            data[key] =
              value;

          }

        }
      );


      /* -----------------------------------------------
         IDENTIFICA O TIPO
      ------------------------------------------------ */

      data.tipo =
        "solicitacao_orcamento";


      data.data =
        new Date()
          .toLocaleString(
            "pt-BR"
          );


      /* -----------------------------------------------
         ARQUIVOS
      ------------------------------------------------ */

      data.arquivos = [];


      const arquivos =
        arquivosInput.files;


      if (
        arquivos &&
        arquivos.length > 0
      ) {

        button.textContent =
          "PROCESSANDO ARQUIVOS...";


        for (
          let i = 0;
          i < arquivos.length;
          i++
        ) {

          const arquivo =
            arquivos[i];


          /*
             Limite de segurança.
             15 MB por arquivo.
          */

          if (
            arquivo.size >
            15 * 1024 * 1024
          ) {

            throw new Error(
              "O arquivo " +
              arquivo.name +
              " é maior que 15 MB."
            );

          }


          const arquivoBase64 =
            await arquivoParaBase64(
              arquivo
            );


          data.arquivos.push(
            arquivoBase64
          );

        }

      }


      /* -----------------------------------------------
         ENVIO AO GOOGLE APPS SCRIPT
      ------------------------------------------------ */

      button.textContent =
        "ENVIANDO PARA ARQSELECT...";


      await fetch(
        SCRIPT_URL,
        {

          method:
            "POST",

          /*
             text/plain evita problemas
             de preflight/CORS.
          */

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(data)

        }
      );


      /* -----------------------------------------------
         SUCESSO
      ------------------------------------------------ */

      message.className =
        "message success";


      message.innerHTML =

        "✓ <strong>Projeto enviado com sucesso!</strong><br><br>" +

        "Recebemos sua solicitação de orçamento. " +

        "Nossa equipe analisará o projeto e " +

        "entrará em contato em breve.";


      form.reset();


      window.scrollTo({

        top: 0,

        behavior: "smooth"

      });


    }

    catch(error) {

      console.error(
        "Erro:",
        error
      );


      message.className =
        "message error";


      message.innerHTML =

        "✕ <strong>Não foi possível enviar o projeto.</strong><br><br>" +

        error.message;


    }


    button.disabled =
      false;


    button.textContent =
      "SOLICITAR ORÇAMENTO";

  }

);

</script>
