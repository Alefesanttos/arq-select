<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbx9KTCJWD06I890aM5KCWEJ-H2hZKQH_OARpCbefGvqOYnxVkLRpe-HTjPIlGDX4ikEBg/exec";

const form = document.getElementById("projectForm");
const button = document.getElementById("submitButton");
const message = document.getElementById("message");
const arquivosInput = document.getElementById("arquivos");


/*
============================================================
TRANSFORMA ARQUIVO EM BASE64
============================================================
*/

function arquivoParaBase64(file) {

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = function() {

      resolve({
        nome: file.name,
        tipo: file.type || "application/octet-stream",
        base64: reader.result
      });

    };

    reader.onerror = function() {
      reject(reader.error);
    };

    reader.readAsDataURL(file);

  });

}


/*
============================================================
ENVIO DO FORMULÁRIO
============================================================
*/

form.addEventListener("submit", async function(event) {

  event.preventDefault();


  /*
  ----------------------------------------------------------
  BLOQUEIA BOTÃO
  ----------------------------------------------------------
  */

  button.disabled = true;

  button.textContent =
    "ENVIANDO PROJETO...";


  message.className =
    "message";

  message.textContent = "";


  try {


    /*
    --------------------------------------------------------
    PEGA OS DADOS DO FORMULÁRIO
    --------------------------------------------------------
    */

    const formData =
      new FormData(form);


    const data = {};


    formData.forEach(function(value, key) {

      if (key !== "arquivos") {

        data[key] = value;

      }

    });


    /*
    --------------------------------------------------------
    MUITO IMPORTANTE
    IDENTIFICA COMO PROJETO DE ARQUITETO
    --------------------------------------------------------
    */

    data.tipo_cadastro =
      "arquiteto";


    /*
    --------------------------------------------------------
    PADRONIZA O NOME DO ARQUITETO
    --------------------------------------------------------
    */

    data.arquiteto =
      data.nome || "";


    /*
    --------------------------------------------------------
    ENVIA O QUE DESEJA ORÇAR
    --------------------------------------------------------
    */

    data.oque_orcar =
      data.descricao || "";


    /*
    --------------------------------------------------------
    DATA
    --------------------------------------------------------
    */

    data.data =
      new Date().toLocaleString("pt-BR");


    /*
    --------------------------------------------------------
    ARQUIVOS
    --------------------------------------------------------
    */

    data.arquivos = [];


    if (
      arquivosInput &&
      arquivosInput.files &&
      arquivosInput.files.length > 0
    ) {


      /*
      ------------------------------------------------------
      LIMITE DE SEGURANÇA
      ------------------------------------------------------
      */

      if (arquivosInput.files.length > 10) {

        throw new Error(
          "Você pode enviar no máximo 10 arquivos."
        );

      }


      for (
        let i = 0;
        i < arquivosInput.files.length;
        i++
      ) {

        const file =
          arquivosInput.files[i];


        /*
        ----------------------------------------------------
        LIMITE POR ARQUIVO
        ----------------------------------------------------
        */

        if (
          file.size >
          10 * 1024 * 1024
        ) {

          throw new Error(
            "O arquivo \"" +
            file.name +
            "\" ultrapassa o limite de 10 MB."
          );

        }


        const arquivo =
          await arquivoParaBase64(file);


        data.arquivos.push(arquivo);

      }

    }


    /*
    --------------------------------------------------------
    ENVIA PARA GOOGLE APPS SCRIPT
    --------------------------------------------------------
    */

    await fetch(
      SCRIPT_URL,
      {

        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(data)

      }
    );


    /*
    --------------------------------------------------------
    SUCESSO
    --------------------------------------------------------
    */

    message.className =
      "message success";


    message.innerHTML =

      "✓ <strong>Projeto enviado com sucesso!</strong><br><br>" +

      "Sua solicitação foi recebida pela ARQSELECT.<br>" +

      "Nossa equipe analisará seu projeto e " +

      "entrará em contato em breve.";


    form.reset();


    /*
    --------------------------------------------------------
    VOLTA PARA MENSAGEM
    --------------------------------------------------------
    */

    window.scrollTo({

      top: 0,

      behavior: "smooth"

    });


  }


  catch(error) {


    console.error(error);


    message.className =
      "message error";


    message.innerHTML =

      "✕ <strong>Não foi possível enviar o projeto.</strong><br><br>" +

      error.message;


  }


  finally {


    button.disabled = false;

    button.textContent =
      "SOLICITAR ORÇAMENTO";

  }


});

</script>
