<!doctype html><html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070807"><title>Atividades | ARQSELECT</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="arqselect-4.css"><script id="arq4-theme-boot">(()=>{const p=localStorage.getItem("ARQSELECT_THEME")||"dark";document.documentElement.dataset.theme=p==="auto"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):p})();</script></head><body>
  <header class="top" style="padding:15px max(4vw,18px);display:flex;justify-content:space-between;align-items:center;gap:14px;position:sticky;top:0;z-index:30"><a class="brand" href="index.html">ARQ<span>SELECT</span></a><nav class="nav"><a class="btn light" id="panel" href="portal.html">Dashboard</a><a class="btn light" href="calendario.html">Agenda</a><a class="btn light" href="notificacoes.html">Notificações</a></nav></header>
  <main class="arq4-shell"><section class="arq4-page-head"><div><div class="ey">HISTÓRICO ORGANIZADO</div><h1>Atividades</h1><p class="muted">Acompanhe eventos registrados na sua conta e ações da agenda.</p></div><button class="btn light" id="refresh">Atualizar</button></section><div class="arq4-actions" id="filters" style="margin-bottom:16px"></div><div id="activity" class="arq4-list"><div class="arq4-card arq4-skeleton"></div></div></main>
  <script src="arqselect-4.js"></script><script>(()=>{const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!ARQSELECT4.token){document.getElementById('activity').innerHTML='<div class="arq4-card empty"><b>Sessão necessária.</b><a class="btn gold" href="login.html">Entrar</a></div>';return;}document.getElementById('panel').href=ARQSELECT4.role==='ADMIN'?'admin.html':ARQSELECT4.role==='FORNECEDOR'?'ARQSELECT_DASHBOARD_FORNECEDOR.html':'ARQSELECT_DASHBOARD_ARQUITETO.html';let list=[],filter='TODOS';const format=v=>{const d=new Date(v);return isNaN(d)?String(v||''):d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});function x(){}};function render(){const values=list.filter(x=>filter==='TODOS'||String(x.tipo).toUpperCase()===filter);document.getElementById('activity').innerHTML=values.length?values.map(x=>`<article class="arq4-list-item"><span class="arq4-list-icon">${esc((x.tipo||'A').slice(0,1))}</span><span><b>${esc(x.titulo||'Atividade')}</b><br><span class="muted">${esc(x.descricao||x.tipo||'')} · ${esc(format(x.data))}</span></span>${x.registroId?`<span class="badge">${esc(x.registroId)}</span>`:''}</article>`).join(''):'<div class="arq4-card empty">Nenhuma atividade encontrada neste filtro.</div>';const types=['TODOS',...new Set(list.map(x=>String(x.tipo||'SISTEMA').toUpperCase()))];document.getElementById('filters').innerHTML=types.map(t=>`<button class="btn ${filter===t?'gold':'light'}" data-filter="${esc(t)}">${esc(t==='TODOS'?'Todos':t)}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render();});}async function load(){const j=await ARQSELECT4.api('arq4_atividades',{limite:150});list=j.atividades||[];render();if(!j.sucesso)ARQSELECT4.notify(j.mensagem);}document.getElementById('refresh').onclick=load;load();})();</script>
</body></html>
