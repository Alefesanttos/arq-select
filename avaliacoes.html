<!doctype html><html class="arq-premium-ui" lang="pt-BR"><head>
<meta charset="utf-8">

<script id="arq-theme-boot">(()=>{try{const k="ARQSELECT_THEME",v=localStorage.getItem(k)||"auto",m=matchMedia("(prefers-color-scheme: dark)").matches,t=v==="auto"?(m?"dark":"light"):(v==="dark"?"dark":"light"),h=document.documentElement;h.dataset.theme=t;h.dataset.arqTheme=t;h.dataset.themePreference=["light","dark","auto"].includes(v)?v:"auto";h.style.colorScheme=t}catch(_){document.documentElement.dataset.theme="light"}})();</script>

<meta http-equiv="Content-Security-Policy" content="img-src 'self' data: blob:; object-src 'none'; base-uri 'self'"><meta name="robots" content="noindex,nofollow">
<script src="arq-config.js?v=6.0.0"></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avaliações | ARQSELECT</title>

<link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="portal-3.css"><meta name="theme-color" content="#070807"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="arqselect-4.css"><link rel="stylesheet" href="arq-premium.css?v=6.0.0"><link rel="stylesheet" href="arq-ui-5.css?v=6.0.0"><link rel="stylesheet" href="arq-polish.css?v=6.0.0">
<link rel="stylesheet" href="arq-design-system.css?v=6.0.0">
</head><body data-arq-page="avaliacoes" data-arq-surface="workspace"><header class="top"><a class="brand" href="index.html">ARQ<span>SELECT</span></a><nav class="nav"><a class="btn" data-panel href="portal.html">Meu painel</a><a class="btn" href="ranking.html">Ranking</a><a class="btn" href="suporte.html">Suporte</a></nav></header><main class="wrap"><section class="hero"><div class="ey">QUALIDADE E CONFIANÇA</div><h1>Avaliações</h1><p class="muted">Avalie a experiência após um projeto fechado ou concluído. As notas alimentam a reputação com critérios equilibrados.</p></section><div class="grid two"><section class="card"><h2>Registrar avaliação</h2><form id="review"><div class="form-grid"><label class="full">ID do projeto<input name="projetoId" required placeholder="Ex.: PROJ-000123"></label><label>Qualidade<select name="qualidade"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>Atendimento<select name="atendimento"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>Comunicação<select name="comunicacao"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>Prazo<select name="prazo"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>Cumprimento<select name="cumprimento"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>Recomendaria?<select name="recomendaria"><option>SIM</option><option>NÃO</option></select></label><label class="full">Comentário<textarea name="comentario" required></textarea></label><label class="full">Pontos positivos<textarea name="pontosPositivos"></textarea></label><label class="full">Pontos a melhorar<textarea name="pontosNegativos"></textarea></label></div><button class="btn gold" type="submit">Enviar avaliação</button></form></section><section><h2>Meu histórico</h2><div id="list" class="list"><div class="card empty">Carregando…</div></div></section></div></main><div id="toast" class="toast"></div><script src="portal-3.js"></script><script>
if(arq3Auth()){loadReviews()}async function loadReviews(){const data=await arq3Api("portal_avaliacoes");const rows=data.avaliacoes||[];arq3("list").innerHTML=rows.length?rows.map(x=>`<article class="card"><div class="toolbar"><b>Projeto ${arq3Esc(x["PROJETO ID"])}</b><span class="badge">${Number(x["NOTA GERAL"]||0).toFixed(1)} ★</span></div><p>${arq3Esc(x.COMENTARIO||"")}</p><div class="muted">${arq3Esc(x.DATA||"")} · ${arq3Esc(x.STATUS||"")}</div></article>`).join(""):'<div class="card empty">Nenhuma avaliação registrada.</div>'}arq3("review").onsubmit=async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(event.currentTarget).entries());const response=await arq3Api("portal_avaliacao_criar",data,"POST");arq3Toast(response.mensagem||"Avaliação enviada.");if(response.sucesso){event.currentTarget.reset();loadReviews()}};
</script><script src="arqselect-4.js"></script><script src="arq-premium.js?v=6.0.0"></script>
<script src="arq-experience.js?v=6.0.0" defer></script>
