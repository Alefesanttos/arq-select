<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avaliações | ARQSELECT</title><link rel="stylesheet" href="portal-3.css"></head><body><header class="top"><a class="brand" href="index.html">ARQ<span>SELECT</span></a><nav class="nav"><a class="btn" data-panel href="portal.html">Meu painel</a><a class="btn" href="ranking.html">Ranking</a><a class="btn" href="suporte.html">Suporte</a></nav></header><main class="wrap"><section class="hero"><div class="ey">QUALIDADE E CONFIANÇA</div><h1>Avaliações</h1><p class="muted">Avalie a experiência após um projeto fechado ou concluído. As notas alimentam a reputação com critérios equilibrados.</p></section><div class="grid two"><section class="card"><h2>Registrar avaliação</h2><form id="review"><div class="form-grid"><label class="full">ID do projeto<input name="projetoId" required placeholder="Ex.: PROJ-000123"></label><label>Qualidade<select name="qualidade"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>Atendimento<select name="atendimento"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>Comunicação<select name="comunicacao"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>Prazo<select name="prazo"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>Cumprimento<select name="cumprimento"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>Recomendaria?<select name="recomendaria"><option>SIM</option><option>NÃO</option></select></label><label class="full">Comentário<textarea name="comentario" required></textarea></label><label class="full">Pontos positivos<textarea name="pontosPositivos"></textarea></label><label class="full">Pontos a melhorar<textarea name="pontosNegativos"></textarea></label></div><button class="btn gold" type="submit">Enviar avaliação</button></form></section><section><h2>Meu histórico</h2><div id="list" class="list"><div class="card empty">Carregando…</div></div></section></div></main><div id="toast" class="toast"></div><script src="portal-3.js"></script><script>
if(arq3Auth()){loadReviews()}async function loadReviews(){const data=await arq3Api("portal_avaliacoes");const rows=data.avaliacoes||[];arq3("list").innerHTML=rows.length?rows.map(x=>`<article class="card"><div class="toolbar"><b>Projeto ${arq3Esc(x["PROJETO ID"])}</b><span class="badge">${Number(x["NOTA GERAL"]||0).toFixed(1)} ★</span></div><p>${arq3Esc(x.COMENTARIO||"")}</p><div class="muted">${arq3Esc(x.DATA||"")} · ${arq3Esc(x.STATUS||"")}</div></article>`).join(""):'<div class="card empty">Nenhuma avaliação registrada.</div>'}arq3("review").onsubmit=async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(event.currentTarget).entries());const response=await arq3Api("portal_avaliacao_criar",data,"POST");arq3Toast(response.mensagem||"Avaliação enviada.");if(response.sucesso){event.currentTarget.reset();loadReviews()}};
</script></body></html>
