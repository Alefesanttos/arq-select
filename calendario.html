<!doctype html><html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070807"><title>Agenda e lembretes | ARQSELECT</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="arqselect-4.css"><script id="arq4-theme-boot">(()=>{const p=localStorage.getItem("ARQSELECT_THEME")||"dark";document.documentElement.dataset.theme=p==="auto"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):p})();</script></head><body>
  <header class="top" style="padding:15px max(4vw,18px);display:flex;justify-content:space-between;align-items:center;gap:14px;position:sticky;top:0;z-index:30"><a class="brand" href="index.html">ARQ<span>SELECT</span></a><nav class="nav"><a class="btn light" id="panel" href="portal.html">Dashboard</a><a class="btn light" href="atividades.html">Atividades</a></nav></header>
  <main class="arq4-shell"><section class="arq4-page-head"><div><div class="ey">PRAZOS E FOLLOW-UPS</div><h1>Agenda</h1><p class="muted">Organize compromissos, retornos, propostas e prazos relacionados ao seu trabalho.</p></div><button class="btn gold" id="new">+ Novo lembrete</button></section>
    <section id="formWrap" class="arq4-card" hidden style="margin-bottom:18px"><form id="form" class="arq4-form-grid"><label>Título<input name="titulo" required maxlength="180"></label><label>Data e hora<input name="dataEvento" type="datetime-local" required></label><label>Tipo<select name="tipo"><option>LEMBRETE</option><option>PROJETO</option><option>PROPOSTA</option><option>FOLLOW-UP</option><option>REUNIÃO</option></select></label><label>Prioridade<select name="prioridade"><option value="MEDIA">Média</option><option value="ALTA">Alta</option><option value="BAIXA">Baixa</option></select></label><label>Registro relacionado<input name="registroId" placeholder="ID do projeto, proposta ou oportunidade"></label><label class="full">Observações<textarea name="observacoes" maxlength="800"></textarea></label><div class="full arq4-actions"><button class="btn gold" type="submit">Salvar lembrete</button><button class="btn light" type="button" id="cancel">Cancelar</button></div></form></section>
    <div id="list" class="arq4-list"><div class="arq4-card arq4-skeleton"></div></div>
  </main><script src="arqselect-4.js"></script><script>(()=>{const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!ARQSELECT4.token){document.getElementById('list').innerHTML='<div class="arq4-card empty">Entre na plataforma para usar a agenda.</div>';return;}document.getElementById('panel').href=ARQSELECT4.role==='ADMIN'?'admin.html':ARQSELECT4.role==='FORNECEDOR'?'ARQSELECT_DASHBOARD_FORNECEDOR.html':'ARQSELECT_DASHBOARD_ARQUITETO.html';const wrap=document.getElementById('formWrap'),form=document.getElementById('form');const fmt=v=>{const d=new Date(v);return isNaN(d)?String(v||''):d.toLocaleString('pt-BR',{dateStyle:'medium',timeStyle:'short'});function x(){}};async function load(){const j=await ARQSELECT4.api('arq4_lembretes');const rows=j.lembretes||[];document.getElementById('list').innerHTML=rows.length?rows.map(x=>`<article class="arq4-list-item"><span class="arq4-list-icon">${x.PRIORIDADE==='ALTA'?'!':'✓'}</span><span><b>${esc(x.TITULO)}</b><br><span class="muted">${esc(fmt(x['DATA EVENTO']))} · ${esc(x.TIPO||'LEMBRETE')} · ${esc(x.STATUS||'PENDENTE')}</span>${x.OBSERVACOES?`<br><span class="muted">${esc(x.OBSERVACOES)}</span>`:''}</span><span class="arq4-actions">${String(x.STATUS).toUpperCase()!=='CONCLUIDO'?`<button class="btn gold" onclick="done('${esc(x.ID)}')">Concluir</button>`:'<span class="badge green">Concluído</span>'}<button class="btn danger" onclick="removeReminder('${esc(x.ID)}')">Excluir</button></span></article>`).join(''):'<div class="arq4-card empty"><b>Nenhum lembrete agendado.</b><button class="btn gold" onclick="document.getElementById(\'new\').click()">Criar lembrete</button></div>';}window.done=async id=>{const j=await ARQSELECT4.api('arq4_lembrete_status',{id,status:'CONCLUIDO'},'POST');ARQSELECT4.notify(j.mensagem);load();};window.removeReminder=async id=>{if(!confirm('Excluir este lembrete?'))return;const j=await ARQSELECT4.api('arq4_lembrete_status',{id,status:'EXCLUIDO'},'POST');ARQSELECT4.notify(j.mensagem);load();};document.getElementById('new').onclick=()=>{wrap.hidden=false;form.elements.titulo.focus();};document.getElementById('cancel').onclick=()=>wrap.hidden=true;form.onsubmit=async e=>{e.preventDefault();const j=await ARQSELECT4.api('arq4_lembrete_salvar',Object.fromEntries(new FormData(form)),'POST');ARQSELECT4.notify(j.mensagem);if(j.sucesso){form.reset();wrap.hidden=true;load();}};load();})();</script>
</body></html>
