<body data-arq-page="chat" data-arq-surface="workspace">
<header class="top">
  <div><div class="brand">ARQ<span>SELECT</span></div><div class="top-sub">Central de mensagens</div></div>
  <nav class="nav"><a href="index.html">Início</a><a href="explorar.html">Explorar</a><a href="conexoes.html">Conexões</a><a href="notificacoes.html">Notificações</a></nav>
</header>
<main class="wrap">
  <section class="chat-shell">
    <aside class="sidebar" id="sidebar">
      <div class="side-head"><div class="arq-inline-c6926f1dd"><div class="side-title">Conversas</div><button class="icon-btn" title="Nova conversa" onclick="toggleNewChat()">＋</button></div><div class="search"><span class="search-icon">⌕</span><input id="search" placeholder="Pesquisar conversa..."></div></div>
      <div id="newChatBox" class="new-chat hidden"><select id="newUser"><option value="">Selecione um contato...</option></select><input id="newProject" placeholder="ID do projeto (opcional)"><button class="btn gold" onclick="createNewConversation()">Iniciar conversa</button></div><div id="convs" class="conv-list"><div class="empty"><div>Carregando conversas...</div></div></div>
    </aside>
    <section class="main">
      <header class="chat-head">
        <div id="head" class="head-main"><div class="avatar">A</div><div><div class="head-name">Selecione uma conversa</div><div class="head-meta">Suas conversas aparecerão aqui</div></div></div>
        <div class="chat-tools"><button class="icon-btn" title="Atualizar" onclick="refreshNow()">↻</button></div>
      </header>
      <div id="msgs" class="messages"><div class="empty"><div class="empty-card"><div class="empty-icon">💬</div><b>Seu espaço de conversas</b><div class="arq-inline-fe7b4979f">Selecione um arquiteto ou fornecedor para começar a conversar.</div></div></div></div>
      <div id="composerWrap" class="composer-wrap">
        <div id="replying" class="replying"><span id="replyText"></span><button class="icon-btn" onclick="clearReply()" aria-label="Cancelar resposta">×</button></div>

<script>
const API=(window.ARQSELECT_API_URL||window.ARQSELECT_CONFIG.apiUrl);
const adminScope=new URLSearchParams(location.search).get('perfil')==='admin';
const token=adminScope?localStorage.getItem('ARQSELECT_ADMIN_TOKEN'):localStorage.getItem('ARQSELECT_PORTAL_TOKEN')||localStorage.getItem('ARQSELECT_ADMIN_TOKEN');
const type=adminScope?'ADMIN':localStorage.getItem('ARQSELECT_PORTAL_TOKEN')?localStorage.getItem('ARQSELECT_PORTAL_TIPO'):'ADMIN';
let conversations=[],active=null,rec=null,chunks=[],messages=[],messageMap=new Map(),replyMessage=null,loadingConvs=false,loadingMsgs=false,pollTimer=null,lastConvSignature='';
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function showToast(text){const el=$('toast');el.textContent=text;el.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>el.classList.remove('show'),2600)}
function auth(){if(!token){location.href=type==='FORNECEDOR'?'ARQSELECT_LOGIN_FORNECEDOR.html':'ARQSELECT_LOGIN_ARQUITETO.html';return false}return true}
async function get(p){const u=new URL(API);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function post(p){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function initials(name){const s=String(name||'ARQ').trim().split(/\s+/).filter(Boolean);return (s[0]?.[0]||'A')+(s[1]?.[0]||'').toUpperCase()}
function convName(x){if(type==='ADMIN')return (x['PARTICIPANTE A']||'Conversa')+' · '+(x['PARTICIPANTE B']||'Equipe ARQSELECT');const a=x['PARTICIPANTE A']||'',b=x['PARTICIPANTE B']||'';const me=String(type||'').toUpperCase()==='ARQUITETO'?a:b;const other=me===a?b:a;return other||'Conversa'}
function convOtherId(x){return String(type||'').toUpperCase()==='ARQUITETO'?x['PARTICIPANTE B ID']:x['PARTICIPANTE A ID']}
function convSignature(list){return JSON.stringify(list.map(x=>[x.ID,x['ULTIMA MENSAGEM'],x['ULTIMA DATA'],x['NAO LIDAS'],x['NÃO LIDAS']]))}
async function loadContacts(){
  try{
    const j=await get({acao:'portal_contatos',token});
    if(!j.sucesso) throw new Error(j.mensagem||'Falha ao carregar contatos.');
    const list=Array.isArray(j.contatos)?j.contatos:[];
    const current=String(type||'').toUpperCase();
    const sel=$('newUser');
    const options=list.filter(u=>String(u.TIPO||'').toUpperCase()!==current).map(u=>{
      const id=String(u.ID||''); const nome=String(u.NOME||u.EMPRESA||u['E-MAIL']||id); const tipo=String(u.TIPO||''); const email=String(u['E-MAIL']||'');
      return `<option value="${esc(id)}" data-type="${esc(tipo)}" data-name="${esc(nome)}" data-email="${esc(email)}">${esc(nome)} · ${esc(tipo)}</option>`;
    }).join('');
    sel.innerHTML=options||'<option value="">Nenhum contato disponível</option>';
  }catch(e){$('newUser').innerHTML='<option value="">Não foi possível carregar contatos</option>';console.error('[ARQSELECT CHAT] contatos',e)}
}
function toggleNewChat(){const box=$('newChatBox');box.classList.toggle('hidden');if(!box.classList.contains('hidden'))loadContacts()}
async function createNewConversation(){
  const sel=$('newUser');const opt=sel.options[sel.selectedIndex];if(!opt||!opt.value)return showToast('Selecione um contato.');
  const nome=opt.dataset.name||opt.textContent.trim();const projeto=$('newProject').value.trim();
  const meuId=localStorage.getItem('ARQSELECT_PORTAL_ID')||'';const meuNome=localStorage.getItem('ARQSELECT_PORTAL_NOME')||'';const meuEmail=localStorage.getItem('ARQSELECT_PORTAL_EMAIL')||'';
  if(!meuId)return showToast('Sessão sem identificador de usuário. Faça login novamente.');
  const isArq=String(type||'').toUpperCase()==='ARQUITETO';
  const payload={acao:'portal_conversa_criar',token,tipo:projeto?'PROJETO':'GERAL',participanteAId:isArq?meuId:opt.value,participanteANome:isArq?meuNome:nome,participanteBId:isArq?opt.value:meuId,participanteBNome:isArq?nome:meuNome,projetoId:projeto,participanteAEmail:isArq?meuEmail:(opt.dataset.email||'')};
  try{const j=await post(payload);if(!j.sucesso)throw new Error(j.mensagem||'Não foi possível criar a conversa.');$('newProject').value='';$('newChatBox').classList.add('hidden');await loadConvs({initial:true});if(j.id)openConv(j.id)}catch(e){console.error('[ARQSELECT CHAT] criar conversa',e);showToast(e.message||'Erro ao criar conversa.')}
}
async function loadConvs({initial=false}={}){
  if(loadingConvs)return;loadingConvs=true;
  try{
    const j=await get({acao:'portal_conversas',token});
    if(!j.sucesso)throw new Error(j.mensagem||'Falha ao carregar conversas.');
    const next=j.conversas||[];const sig=convSignature(next);
    const activeId=active?.ID;
    const changed=sig!==lastConvSignature;conversations=next;lastConvSignature=sig;
    if(changed||initial)renderConvs();
    if(activeId){const still=conversations.find(x=>String(x.ID)===String(activeId));if(still){active=still;updateHead();if(initial)await loadMsgs({initial:true});}}
    $('status').textContent='';
  }catch(e){$('status').textContent=e.message||'Não foi possível carregar as conversas.';if(initial)$('convs').innerHTML='<div class="empty"><div>Não foi possível carregar as conversas.<br><button class="nav primary" style="margin-top:10px;border:0" onclick="refreshNow()">Tentar novamente</button></div></div>'}
  finally{loadingConvs=false}
}
function renderConvs(){
  const q=$('search').value.toLowerCase().trim();
  const list=conversations.filter(x=>(convName(x)+' '+(x['PROJETO ID']||'')+' '+(x['ULTIMA MENSAGEM']||'')).toLowerCase().includes(q));
  $('convs').innerHTML=list.length?list.map(x=>{
    const id=String(x.ID);const name=convName(x);const project=x['PROJETO ID']||'';const unread=Number(x['NAO LIDAS']||x['NÃO LIDAS']||0)||0;
    return `<div class="conv ${active&&String(active.ID)===id?'active':''}" data-id="${esc(id)}" onclick="openConv('${esc(id)}')"><div class="avatar ${name?'gold':''}">${esc(initials(name))}</div><div class="conv-content"><div class="conv-top"><div class="conv-name">${esc(name)}</div><div class="conv-time">${esc(x['ULTIMA DATA']||'')}</div></div><div class="conv-preview">${esc((x['ULTIMA MENSAGEM']||'Sem mensagens'))}</div><div class="conv-preview">${esc(project?'Projeto: '+project:(unread?unread+' não lida(s)':''))}</div></div>${unread?`<span class="unread">${unread>9?'9+':unread}</span>`:''}</div>`
  }).join(''):'<div class="empty"><div>Nenhuma conversa encontrada.</div></div>';
}
function openConv(id){active=conversations.find(x=>String(x.ID)===String(id))||null;if(!active)return;renderConvs();updateHead();loadMsgs({initial:true})}
function updateHead(){const name=convName(active);$('head').innerHTML=`<div class="avatar gold">${esc(initials(name))}</div><div><div class="head-name">${esc(name)}</div><div class="head-meta">Atendimento pelo portal${active?.['PROJETO ID']?` · Projeto ${esc(active['PROJETO ID'])}`:''}</div></div>`}
function dayKey(value){const d=new Date(value);return isNaN(d)?String(value||'') : d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})}
const chatFileCache=new Map();
function fileHtml(files,mine){return files.map(f=>{const id=f.id||(String(f.url||'').match(/\/d\/([A-Za-z0-9_-]+)/)||[])[1];return `<div class="attach"><button type="button" data-chat-file="${esc(id||'')}" ${id?'':'disabled'}>${/^audio\//.test(f.mimeType||'')?'▶ Ouvir áudio':/^image\//.test(f.mimeType||'')?'Ver imagem':'Baixar anexo'} · ${esc(f.nome||'Arquivo')}</button><div class="chat-file-content"></div></div>`;}).join('');}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-chat-file]');if(!b||!b.dataset.chatFile||!active)return;const conv=active.ID,key=conv+':'+b.dataset.chatFile;b.disabled=true;try{let file=chatFileCache.get(key);if(!file){const j=await post({acao:'portal_chat_arquivo',token,conversaId:conv,arquivoId:b.dataset.chatFile});if(!j.sucesso)throw Error(j.mensagem);const data=Uint8Array.from(atob(j.base64),c=>c.charCodeAt(0));file={...j,url:URL.createObjectURL(new Blob([data],{type:j.mime}))};chatFileCache.set(key,file);}if(!b.isConnected)return;const out=b.nextElementSibling;out.replaceChildren();if(file.mime.startsWith('image/')){const im=document.createElement('img');im.src=file.url;im.alt=file.nome||'Imagem anexada à conversa';out.append(im);}else if(file.mime.startsWith('audio/')){const audio=document.createElement('audio');audio.controls=true;audio.src=file.url;out.append(audio);}const link=document.createElement('a');link.href=file.url;link.download=file.nome||'anexo';link.textContent='Baixar '+(file.nome||'anexo');out.append(link);b.hidden=true;}catch(err){showToast(err.message||'Não foi possível abrir o anexo.');b.disabled=false;}});
window.addEventListener('pagehide',()=>chatFileCache.forEach(f=>URL.revokeObjectURL(f.url)));
function isMine(m){return String(m['REMETENTE ID'])===String(type==='ARQUITETO'?active?.['PARTICIPANTE A ID']:active?.['PARTICIPANTE B ID'])||String(m['REMETENTE TIPO']||'').toUpperCase()===String(type||'').toUpperCase()}
function renderOneMessage(m,index){let files=[];try{files=JSON.parse(m.ARQUIVOS||'[]')}catch(e){}const mine=isMine(m);const prev=messages[index-1];const sep=!prev||dayKey(prev.DATA)!==dayKey(m.DATA);const bubbleText=esc(m.MENSAGEM||'');return `${sep?`<div class="day-sep" data-day="${esc(dayKey(m.DATA))}">${esc(dayKey(m.DATA))}</div>`:''}<div class="msg-row ${mine?'mine':''}" data-message-id="${esc(m.ID||('m-'+index))}">${mine?'':`<div class="msg-avatar">${esc(initials(m['REMETENTE NOME']||'U'))}</div>`}<div class="msg-stack"><div class="bubble">${bubbleText?`<div style="white-space:pre-wrap">${bubbleText}</div>`:''}${fileHtml(files,mine)}</div><div class="msg-meta"><span>${esc(m.DATA||'')}</span><span class="check">${esc(m.LIDA==='SIM'?'✓✓':'✓')}</span><button class="reply-action" onclick="setReply(${index})">Responder</button></div></div></div>`}
function nearBottom(el){return el.scrollHeight-el.scrollTop-el.clientHeight<120}
function scrollBottom(force=false){const el=$('msgs');if(force||nearBottom(el))el.scrollTop=el.scrollHeight}
function replaceMessages(next,initial=false){
  messages=next||[];messageMap=new Map(messages.map((m,i)=>[String(m.ID||('m-'+i)),m]));
  if(initial){$('msgs').innerHTML=messages.length?messages.map(renderOneMessage).join(''):'<div class="empty"><div class="empty-card"><div class="empty-icon">💬</div><b>Nenhuma mensagem ainda</b><div style="margin-top:6px">Envie a primeira mensagem desta conversa.</div></div></div>';scrollBottom(true);return}
  // atualização incremental: somente mensagens novas/alteradas entram no DOM
  syncMessagesDom();
}
function syncMessagesDom(){
  const el=$('msgs');const wasNear=nearBottom(el);const existing=new Map([...el.querySelectorAll('[data-message-id]')].map(n=>[n.dataset.messageId,n]));let changed=false;
  messages.forEach((m,i)=>{
    const id=String(m.ID||('m-'+i));const old=existing.get(id);const html=renderOneMessage(m,i);const tmp=document.createElement('div');tmp.innerHTML=html;const nodes=[...tmp.children];
    if(!old){nodes.forEach(n=>el.appendChild(n));changed=true;}
    else{const row=old.closest('.msg-row');const fresh=nodes.find(n=>n.matches?.('.msg-row'));if(fresh&&row&&row.outerHTML!==fresh.outerHTML){row.replaceWith(fresh);changed=true;}}
  });
  if(changed&&wasNear)scrollBottom(true);
}
async function loadMsgs({initial=false}={}){
  if(!active||loadingMsgs)return;loadingMsgs=true;const el=$('msgs');const wasNear=nearBottom(el);
  try{
    const j=await get({acao:'portal_mensagens',token,conversaId:active.ID});if(!j.sucesso)throw new Error(j.mensagem||'Falha ao carregar mensagens.');
    replaceMessages(j.mensagens||[],initial);
    if(!initial&&wasNear)scrollBottom(true);
  }catch(e){if(initial)el.innerHTML=`<div class="empty"><div>Não foi possível carregar as mensagens.<br><button class="nav primary" style="margin-top:10px;border:0" onclick="loadMsgs({initial:true})">Tentar novamente</button></div></div>`;else showToast(e.message||'Erro ao atualizar mensagens.')}
  finally{loadingMsgs=false}
}
async function refreshNow(){await loadConvs({initial:true});if(active)await loadMsgs({initial:true})}
function autoGrow(t){t.style.height='42px';t.style.height=Math.min(t.scrollHeight,140)+'px'}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}}
function toData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function sendMsg(){
  if(!active)return showToast('Selecione uma conversa.');
  const btn=$('send');const text=$('text').value.trim();const fs=[...$('files').files];if(fs.length>5||fs.some(f=>f.size>8*1024*1024)){showToast('Envie até cinco arquivos de no máximo 8 MB.');return;}const outgoing=replyMessage?`> ${(replyMessage.MENSAGEM||'Mensagem').slice(0,180)}\n\n${text}`:text;
  if(fs.some(f=>f.size>5*1024*1024))return showToast('Cada arquivo deve ter no máximo 5 MB.');
  if(!text&&!fs.length&&!window._audio)return;
  const ar=[];for(const f of fs)ar.push({nome:f.name,mimeType:f.type,base64:await toData(f)});if(window._audio){ar.push(window._audio);window._audio=null}
  btn.classList.add('sending');$('status').textContent='Enviando...';
  try{const j=await post({acao:'portal_mensagem_enviar',token,conversaId:active.ID,destinatarioId:convOtherId(active),mensagem:outgoing,arquivos:ar});if(!j.sucesso)throw new Error(j.mensagem||'Não foi possível enviar.');$('text').value='';$('text').style.height='42px';$('files').value='';$('record').textContent='';$('status').textContent='';clearReply();await loadMsgs({initial:false});await loadConvs();}
  catch(e){$('status').textContent='';showToast(e.message||'Falha ao enviar mensagem.')}finally{btn.classList.remove('sending')}
}
function setReply(index){replyMessage=messages[index]||null;if(!replyMessage)return;$('replyText').textContent='Respondendo a '+(replyMessage['REMETENTE NOME']||'mensagem')+': '+String(replyMessage.MENSAGEM||'Arquivo').slice(0,110);$('replying').style.display='flex';$('text').focus()}
function clearReply(){replyMessage=null;$('replying').style.display='none';$('replyText').textContent=''}
function useQuick(text){$('text').value=text;autoGrow($('text'));$('text').focus()}
async function toggleRec(){
  if(rec){rec.stop();return}
  if(!navigator.mediaDevices?.getUserMedia)return showToast('Seu navegador não oferece gravação de áudio.');
  try{
    $('record').textContent='Solicitando acesso ao microfone...';
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    const mime=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported(x))||'';
    rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
    chunks=[];
    rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});if(blob.size>5*1024*1024){$('record').textContent='Áudio maior que 5 MB. Grave uma mensagem mais curta.';rec=null;return}window._audio={nome:'audio-'+Date.now()+'.webm',mimeType:blob.type||'audio/webm',base64:await toData(blob)};$('record').textContent='✓ Áudio pronto — clique em enviar';$('mic').textContent='🎙️';rec=null};
    rec.start();$('mic').textContent='⏹️';$('record').textContent='Gravando... clique novamente para parar.';
  }catch(e){
    console.error('[ARQSELECT CHAT] microfone',e);
    $('record').textContent=e&&e.name==='NotAllowedError'?'Microfone bloqueado. Autorize o microfone nas permissões do navegador e tente novamente.':'Microfone indisponível neste dispositivo ou navegador.';
    rec=null;
  }
}
$('search').addEventListener('input',renderConvs);
if(auth()){(async()=>{await loadConvs({initial:true});const params=new URLSearchParams(location.search);let requested=params.get('conversa');if(params.get('solicitacaoId')){const j=await post({acao:'portal_solicitacao_conversa',token,id:params.get('solicitacaoId')});if(j.sucesso){requested=j.id;await loadConvs({initial:true});}else showToast(j.mensagem);}if(requested&&conversations.some(x=>String(x.ID)===requested))openConv(requested);else if(!active&&conversations.length)openConv(String(conversations[0].ID));})();pollTimer=setInterval(async()=>{await loadConvs();if(active)await loadMsgs({initial:false})},5000)}
</script>
