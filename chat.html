<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARQSELECT | Chat</title><style>:root{--bg:#f5f6f8;--card:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--dark:#0b1220;--gold:#c8a457;--shadow:0 14px 40px rgba(16,24,40,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}.top{background:var(--dark);color:#fff;padding:16px 5vw;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20}.brand{font-weight:950;letter-spacing:.13em}.brand span{color:#dfc471}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer}.btn.gold{background:linear-gradient(135deg,#e3ca88,#b88e35);color:#16120a}.btn.light{background:#eef2f6;color:#101828}.wrap{width:min(1220px,92vw);margin:auto;padding:32px 0 70px}.hero{background:linear-gradient(135deg,#111827,#1f2937);color:#fff;border-radius:24px;padding:34px;box-shadow:var(--shadow);margin-bottom:24px}.ey{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#e4cb83;font-weight:900}.muted{color:var(--muted);line-height:1.6}.hero .muted{color:#cbd5e1}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar>*{min-width:180px;flex:1}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px #c8a45719}.product{display:flex;flex-direction:column;gap:10px}.thumb{height:210px;border-radius:14px;background:#eef1f4;display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.price{font-weight:950;font-size:20px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2f6;font-size:10px;font-weight:850}.chat{display:grid;grid-template-columns:320px 1fr;gap:16px}.conv-list{display:grid;gap:7px;max-height:650px;overflow:auto}.conv{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}.conv.active{border-color:var(--gold);box-shadow:0 0 0 2px #c8a45722}.messages{height:560px;overflow:auto;padding:14px;background:#f7f8fa;border-radius:16px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:78%;padding:11px 13px;border-radius:16px;background:#fff;border:1px solid var(--line)}.bubble.mine{align-self:flex-end;background:#fff5dc;border-color:#e8d49d}.attach{margin-top:7px;padding:9px;border:1px solid var(--line);border-radius:10px}.composer{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:10px}.composer textarea{min-height:52px;resize:vertical}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:16px;z-index:50}.modal.open{display:grid}.modalbox{background:#fff;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:22px}.close{float:right;border:0;background:#eef2f6;border-radius:9px;padding:7px 10px;font-weight:900}.audio{display:flex;align-items:center;gap:8px}.audio audio{width:min(300px,100%)}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.chat{grid-template-columns:1fr}.conv-list{max-height:220px}.messages{height:55vh}}@media(max-width:600px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.nav{width:100%}.composer{grid-template-columns:1fr}.wrap{padding-top:18px}}</style></head><body><header class="top"><div><div class="brand">ARQ<span>SELECT</span></div><div style="font-size:11px;color:#cbd5e1">Central de mensagens</div></div><nav class="nav"><a class="btn light" href="index.html">Início</a><a class="btn light" href="explorar.html">Explorar</a><a class="btn gold" href="conexoes.html">Conexões</a></nav></header><main class="wrap"><section class="hero"><div class="ey">ARQSELECT PREMIUM</div><h1>Converse, compartilhe e avance seus projetos.</h1><div class="muted">Texto, arquivos, imagens e mensagens de voz. A atualização é automática a cada poucos segundos.</div></section><div id="status" class="muted" style="margin-bottom:12px"></div><div class="chat"><aside class="card"><div class="toolbar"><input id="search" placeholder="Pesquisar conversa..."></div><div id="convs" class="conv-list"><div class="muted">Carregando...</div></div></aside><section class="card"><div id="head"><b>Selecione uma conversa</b></div><div id="msgs" class="messages"><div class="muted">Suas conversas aparecerão aqui.</div></div><div class="composer"><textarea id="text" placeholder="Digite uma mensagem..."></textarea><div><input id="files" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.gif,.doc,.docx,.xls,.xlsx,.zip,.mp4,.webm,.ogg"><button class="btn light" onclick="document.getElementById('files').click()">📎</button></div><div style="display:flex;gap:7px"><button id="mic" class="btn light" onclick="toggleRec()">🎙️</button><button class="btn gold" onclick="sendMsg()">Enviar</button></div></div><div id="record" class="muted" style="margin-top:7px"></div></section></div></main><script>
const API='https://script.google.com/macros/s/AKfycbz_jLzNa87U_himraaCczzqGpQdq63AyIVogQ9-YGnqXuQYl3OSJfV4E7xYfPdnv8-d/exec',token=localStorage.getItem('ARQSELECT_PORTAL_TOKEN'),type=localStorage.getItem('ARQSELECT_PORTAL_TIPO');let conversations=[],active=null,rec=null,chunks=[];
const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function get(p){const u=new URL(API);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u,{cache:'no-store'});return r.json()}async function post(p){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});return r.json()}function auth(){if(!token)location.href=type==='FORNECEDOR'?'ARQSELECT_LOGIN_FORNECEDOR.html':'ARQSELECT_LOGIN_ARQUITETO.html'}
async function loadConvs(){try{const j=await get({acao:'portal_conversas',token});if(!j.sucesso)throw new Error(j.mensagem||'Falha');conversations=j.conversas||[];renderConvs();if(active){const still=conversations.find(x=>String(x.ID)===String(active.ID));if(still){active=still;await loadMsgs()}}}catch(e){$('status').textContent=e.message||'Não foi possível carregar as conversas.'}}
function renderConvs(){const q=$('search').value.toLowerCase().trim();const list=conversations.filter(x=>((x['PARTICIPANTE A']||'')+' '+(x['PARTICIPANTE B']||'')+' '+(x['PROJETO ID']||'')).toLowerCase().includes(q));$('convs').innerHTML=list.length?list.map(x=>`<div class="conv ${active&&String(active.ID)===String(x.ID)?'active':''}" onclick="openConv('${esc(x.ID)}')"><b>${esc(x['PARTICIPANTE A']||'')} ↔ ${esc(x['PARTICIPANTE B']||'')}</b><div class="muted">${esc(x['ULTIMA MENSAGEM']||'Sem mensagens')}</div><div class="muted">${esc(x['PROJETO ID']||'Sem projeto')} · ${esc(x['ULTIMA DATA']||'')}</div></div>`).join(''):'<div class="muted">Nenhuma conversa encontrada.</div>'}
async function openConv(id){active=conversations.find(x=>String(x.ID)===String(id));renderConvs();$('head').innerHTML=`<b>${esc(active?.['PARTICIPANTE A']||'')} ↔ ${esc(active?.['PARTICIPANTE B']||'')}</b><div class="muted">Projeto: ${esc(active?.['PROJETO ID']||'não vinculado')}</div>`;await loadMsgs()}
function renderMsg(m){let files=[];try{files=JSON.parse(m.ARQUIVOS||'[]')}catch(e){}let a=files.map(f=>/^image\//.test(f.mimeType||'')?`<div class="attach"><img src="${esc(f.url)}" style="max-width:100%;border-radius:8px"><div><a href="${esc(f.url)}" target="_blank">${esc(f.nome)}</a></div></div>`:`<div class="attach"><a href="${esc(f.url)}" target="_blank">📎 ${esc(f.nome)}</a></div>`).join('');return `<div class="bubble ${String(m['REMETENTE ID'])===String(active?.['PARTICIPANTE A ID'])?'mine':''}"><b>${esc(m['REMETENTE NOME']||'Usuário')}</b><div style="white-space:pre-wrap;margin-top:5px">${esc(m.MENSAGEM||'')}</div>${a}<div class="muted" style="font-size:10px;margin-top:6px">${esc(m.DATA||'')} · ${esc(m.LIDA==='SIM'?'Visualizada':'Enviada')}</div></div>`}
async function loadMsgs(){if(!active)return;$('msgs').innerHTML='<div class="muted">Carregando...</div>';try{const j=await get({acao:'portal_mensagens',token,conversaId:active.ID});if(!j.sucesso)throw new Error(j.mensagem||'Falha');$('msgs').innerHTML=(j.mensagens||[]).map(renderMsg).join('')||'<div class="muted">Nenhuma mensagem.</div>';$('msgs').scrollTop=$('msgs').scrollHeight}catch(e){$('msgs').innerHTML=`<div class="muted">${esc(e.message||'Erro ao carregar mensagens.')}</div>`}}
async function toData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function sendMsg(){if(!active)return alert('Selecione uma conversa.');const text=$('text').value.trim();const fs=[...$('files').files].slice(0,5);for(const f of fs)if(f.size>5*1024*1024)return alert('Cada arquivo deve ter no máximo 5 MB.');if(!text&&!fs.length&&!window._audio)return;const ar=[];for(const f of fs)ar.push({nome:f.name,mimeType:f.type,base64:await toData(f)});if(window._audio){ar.push(window._audio);window._audio=null}try{const j=await post({acao:'portal_mensagem_enviar',token,conversaId:active.ID,destinatarioId:type==='ARQUITETO'?active['PARTICIPANTE B ID']:active['PARTICIPANTE A ID'],mensagem:text,arquivos:ar});if(!j.sucesso)throw new Error(j.mensagem||'Não foi possível enviar.');$('text').value='';$('files').value='';$('record').textContent='';await loadMsgs();await loadConvs()}catch(e){alert(e.message||'Falha ao enviar')}}
async function toggleRec(){if(rec){rec.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(stream);chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});if(blob.size>5*1024*1024){$('record').textContent='Áudio muito grande.';rec=null;return}window._audio={nome:'audio-'+Date.now()+'.webm',mimeType:blob.type||'audio/webm',base64:await toData(blob)};$('record').textContent='✓ Áudio pronto para enviar';$('mic').textContent='🎙️';rec=null};rec.start();$('mic').textContent='⏹️';$('record').textContent='Gravando... clique novamente para parar.'}catch(e){$('record').textContent='Permissão de microfone negada ou indisponível.';rec=null}}
$('search').oninput=renderConvs;auth();loadConvs();setInterval(loadConvs,5000);setInterval(()=>active&&loadMsgs(),5000);
</script></body></html>
