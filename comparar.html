<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070807">
  <meta name="description" content="Compare produtos e soluções disponíveis no marketplace ARQSELECT.">
  <title>Comparar produtos | ARQSELECT</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="arqselect-4.css">
<script id="arq4-theme-boot">(()=>{const p=localStorage.getItem("ARQSELECT_THEME")||"dark";document.documentElement.dataset.theme=p==="auto"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):p})();</script></head>
<body>
  <header class="top" style="padding:15px max(4vw,18px);display:flex;justify-content:space-between;align-items:center;gap:14px;position:sticky;top:0;z-index:30"><a class="brand" href="index.html">ARQ<span>SELECT</span></a><nav class="nav"><a class="btn light" href="explorar.html">Explorar</a><a class="btn light" href="boards.html">Minha seleção</a></nav></header>
  <main class="arq4-shell">
    <section class="arq4-page-head"><div><div class="ey">DECISÃO COM CLAREZA</div><h1>Comparar produtos</h1><p class="muted">Compare até três soluções usando somente informações reais cadastradas pelos fornecedores.</p></div><div class="arq4-actions"><button class="btn light" onclick="print()">Imprimir</button><button class="btn gold" id="share">Compartilhar</button></div></section>
    <div id="compare"><div class="arq4-card arq4-skeleton" aria-busy="true"></div></div>
  </main>
  <script src="arqselect-4.js"></script>
  <script>
  (()=>{const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let ids=ARQSELECT4.compareIds();const fields=[['Fornecedor','FORNECEDOR NOME'],['Marca','MARCA'],['Modelo','MODELO'],['Categoria','CATEGORIA'],['Material','MATERIAL'],['Acabamento','ACABAMENTO'],['Cor','COR'],['Dimensões','DIMENSOES'],['Preço / faixa','PRECO'],['Prazo','PRAZO'],['Disponibilidade','DISPONIBILIDADE'],['Região','REGIAO'],['Características','CARACTERISTICAS']];async function load(){if(!ids.length){document.getElementById('compare').innerHTML='<div class="arq4-card empty"><b>Nenhum produto selecionado.</b><span>Abra o marketplace e use o botão “Comparar” nos produtos desejados.</span><a class="btn gold" href="explorar.html">Explorar marketplace</a></div>';return;}const results=await Promise.all(ids.map(id=>ARQSELECT4.api('portal_produto',{id})));const products=results.filter(x=>x.sucesso&&x.produto).map(x=>x.produto);if(!products.length){document.getElementById('compare').innerHTML='<div class="arq4-card empty">Os produtos selecionados não estão mais disponíveis.</div>';return;}document.getElementById('compare').innerHTML=`<div class="table-wrap arq4-compare-table"><table><thead><tr><th>Critério</th>${products.map(p=>`<th><div>${esc(p.NOME||'Produto')}</div><button class="btn danger" onclick="removeProduct('${esc(p.ID)}')">Remover</button></th>`).join('')}</tr></thead><tbody><tr><td>Produto</td>${products.map(p=>{const img=String(p.FOTOS||'').split(/\n/).filter(Boolean)[0];return `<td>${img?`<img class="arq4-product-image" src="${esc(img)}" alt="${esc(p.NOME||'Produto')}">`:''}<h3>${esc(p.NOME||'Produto')}</h3><a class="btn gold" href="produto.html?id=${encodeURIComponent(p.ID)}">Ver produto</a></td>`}).join('')}</tr>${fields.map(([label,key])=>`<tr><td>${label}</td>${products.map(p=>`<td>${esc(p[key]||'Não informado')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}window.removeProduct=id=>{ids=ids.filter(x=>x!==id);localStorage.setItem('ARQSELECT_COMPARE_IDS',JSON.stringify(ids));load();};document.getElementById('share').onclick=()=>ARQSELECT4.shareCurrent('Comparação de produtos ARQSELECT');load();})();
  </script>
</body></html>
