<style id="arqselect-unified-theme">@layer page {

:root{
 --arq-bg:#070707;--arq-bg-2:#0c0c0c;--arq-surface:#121212;--arq-surface-2:#171717;

}

body{background:
 radial-gradient(circle at 90% -8%,rgba(212,175,55,.10),transparent 28%),
 radial-gradient(circle at 4% 105%,rgba(255,255,255,.035),transparent 30%),var(--arq-bg);
 color:var(--arq-text)}

body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);background-size:28px 28px;opacity:.55}
h1,h2,h3,h4,h5,h6,p,div,span,li,label,td,th{color:inherit}
a{color:inherit}
.top,.nav,.header,.navbar{background:rgba(7,7,7,.86);border-color:var(--arq-line);backdrop-filter:blur(16px)}
.btn,.button,.actions button,.nav a{border:1px solid var(--arq-line);background:rgba(255,255,255,.055);color:var(--arq-text);box-shadow:0 8px 24px rgba(0,0,0,.12)}

.btn:hover,.button:hover,.nav a:hover{border-color:rgba(212,175,55,.42);transform:translateY(-1px)}
.card,.panel,.box,.tile,.item,.list,.table,.table-wrap,.product,.profile,.stat,.metric,.notice,.sheet,.conversation,.sidebar,.hero-card,.feature-card,.post,.opportunity,.profile-card,.request-card,.proposal-card{background:linear-gradient(145deg,rgba(22,22,22,.97),rgba(12,12,12,.94));border:1px solid var(--arq-line);color:var(--arq-text);box-shadow:var(--arq-shadow)}
.card h1,.card h2,.card h3,.card h4,.panel h1,.panel h2,.panel h3,.panel h4,.box h1,.box h2,.box h3,.box h4,.product h3{color:var(--arq-text)}
.muted,.meta,.small,.hint,.ey,.subtle,.role{color:var(--arq-muted)}
input,select,textarea{background:rgba(255,255,255,.055);color:var(--arq-text);border:1px solid rgba(255,255,255,.12)}

input:focus,select:focus,textarea:focus{border-color:rgba(212,175,55,.75);box-shadow:0 0 0 3px rgba(212,175,55,.11)}
.badge,.tag,.pill{background:rgba(212,175,55,.12);color:var(--arq-gold-2);border:1px solid rgba(212,175,55,.22)}
table{color:var(--arq-text)}th{background:rgba(212,175,55,.07);color:var(--arq-gold-2)}td{border-color:var(--arq-line)}
.modal{background:rgba(0,0,0,.72)}
.modalbox,.modal-content,.dialog,.dropdown,.menu,.sheet-content{background:linear-gradient(145deg,#1b1b1b,#0e0e0e);color:var(--arq-text);border:1px solid var(--arq-line);box-shadow:0 30px 80px rgba(0,0,0,.55)}
.close{background:rgba(255,255,255,.08);color:var(--arq-text);border:1px solid var(--arq-line)}

.composer,.composer-wrap,.chat-head{background:#111;color:var(--arq-text);border-color:var(--arq-line)}
.conv,.conversation-item{background:rgba(255,255,255,.035);color:var(--arq-text);border-color:var(--arq-line)}

</head><body data-arq-page="conexoes" data-arq-surface="workspace"><header class="top"><div class="brand">ARQ<span>SELECT</span></div><nav class="nav"><a class="btn light" href="explorar.html">Explorar</a><a class="btn gold" href="chat.html">Chat</a></nav></header><main class="wrap"><section class="hero"><div class="ey">REDE PROFISSIONAL</div><h1>Minhas conexões</h1><div class="muted">Centralize contatos que já interagiram com seus projetos.</div></section><div id="app" class="grid"><div class="card">Carregando...</div></div></main><script>const API=(window.ARQSELECT_API_URL||window.ARQSELECT_CONFIG.apiUrl),token=localStorage.getItem('ARQSELECT_PORTAL_TOKEN');function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function load(){const u=new URL(API);u.searchParams.set('acao','portal_conexoes');u.searchParams.set('token',token||'');const j=await fetch(u).then(r=>r.json());const d=j.conexoes||[];document.getElementById('app').innerHTML=d.length?d.map(x=>`<article class="card"><div class="ey">${esc(x['USUARIO A TIPO']||'')} ↔ ${esc(x['USUARIO B TIPO']||'')}</div><h3>${esc(x['USUARIO A ID']===localStorage.getItem('ARQSELECT_PORTAL_ID')?x['USUARIO B ID']:x['USUARIO A ID'])}</h3><div class="muted">Status: ${esc(x.STATUS)} · Última interação: ${esc(x['ULTIMA INTERACAO'])}</div><a class="btn gold" href="chat.html">Abrir chat</a></article>`).join(''):'<div class="card">Você ainda não possui conexões.</div>'}load();</script>
<script id="arqselect-role-nav">
(function(){
  try{
    const type=(localStorage.getItem('ARQSELECT_PORTAL_TIPO')||'').toUpperCase();
    const nav=document.querySelector('.nav'); if(!nav || nav.querySelector('[data-arq-panel]')) return;
    if(type!=='ARQUITETO' && type!=='FORNECEDOR') return;
    const a=document.createElement('a'); a.className='btn light'; a.dataset.arqPanel='1';
    a.href=type==='FORNECEDOR'?'ARQSELECT_DASHBOARD_FORNECEDOR.html':'ARQSELECT_DASHBOARD_ARQUITETO.html';
    a.textContent='Meu painel'; nav.insertBefore(a,nav.firstChild);
  }catch(e){console.warn('[ARQSELECT] navegação de perfil:',e)}
})();
</script>
