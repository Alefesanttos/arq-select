<!doctype html><html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070807"><title>Preferências e privacidade | ARQSELECT</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="arqselect-4.css"><script id="arq4-theme-boot">(()=>{const p=localStorage.getItem("ARQSELECT_THEME")||"dark";document.documentElement.dataset.theme=p==="auto"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):p})();</script></head><body>
  <header class="top" style="padding:15px max(4vw,18px);display:flex;justify-content:space-between;align-items:center;gap:14px;position:sticky;top:0;z-index:30"><a class="brand" href="index.html">ARQ<span>SELECT</span></a><nav class="nav"><a class="btn light" id="panel" href="portal.html">Dashboard</a><a class="btn light" href="seguranca.html">Segurança</a></nav></header>
  <main class="arq4-shell"><section class="arq4-page-head"><div><div class="ey">CONTROLE DA CONTA</div><h1>Preferências e privacidade</h1><p class="muted">Escolha como sua conta, seus contatos e suas notificações devem funcionar.</p></div></section>
    <form id="settings" class="arq4-card arq4-form-grid"><label>Tema<select name="tema"><option value="AUTO">Automático</option><option value="ESCURO">Escuro</option><option value="CLARO">Claro</option></select></label><label>Perfil público<select name="perfilPublico"><option value="SIM">Visível</option><option value="NAO">Privado</option></select></label><label>Telefone público<select name="telefonePublico"><option value="NAO">Não mostrar</option><option value="SIM">Mostrar</option></select></label><label>E-mail público<select name="emailPublico"><option value="NAO">Não mostrar</option><option value="SIM">Mostrar</option></select></label><label>Notificações<select name="notificacoes"><option value="SIM">Ativadas</option><option value="NAO">Desativadas</option></select></label><label>Novas mensagens<select name="mensagens"><option value="SIM">Ativadas</option><option value="NAO">Desativadas</option></select></label><label class="full">Atalhos favoritos<input name="atalhos" maxlength="500" placeholder="Ex.: projetos, propostas, chat"></label><div class="full arq4-actions"><button class="btn gold" type="submit">Salvar preferências</button><span id="msg" class="muted"></span></div></form>
  </main><script src="arqselect-4.js"></script><script>(()=>{if(!ARQSELECT4.token){document.getElementById('settings').innerHTML='<div class="empty full">Entre na plataforma para acessar suas preferências.</div>';return;}document.getElementById('panel').href=ARQSELECT4.role==='ADMIN'?'admin.html':ARQSELECT4.role==='FORNECEDOR'?'ARQSELECT_DASHBOARD_FORNECEDOR.html':'ARQSELECT_DASHBOARD_ARQUITETO.html';const form=document.getElementById('settings');async function load(){const j=await ARQSELECT4.api('arq4_preferencias');const p=j.preferencias||{};const map={tema:p.TEMA,telefonePublico:p['TELEFONE PUBLICO'],emailPublico:p['EMAIL PUBLICO'],perfilPublico:p['PERFIL PUBLICO'],notificacoes:p.NOTIFICACOES,mensagens:p.MENSAGENS,atalhos:p.ATALHOS};Object.entries(map).forEach(([k,v])=>{if(form.elements[k])form.elements[k].value=v||form.elements[k].value;});}form.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));const j=await ARQSELECT4.api('arq4_preferencias_salvar',data,'POST');document.getElementById('msg').textContent=j.mensagem||'';if(j.sucesso){const theme={ESCURO:'dark',CLARO:'light',AUTO:'auto'}[data.tema];ARQSELECT4.applyTheme(theme);ARQSELECT4.notify('Preferências salvas.');}};load();})();</script>
</body></html>
