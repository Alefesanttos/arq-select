<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/responsive.css"><script src="js/app.js"></script></head><body><div class="app"><aside class="sidebar"><div class="brand">ARQSELECT</div><nav class="nav"><a href="dashboard-arquiteto.html">Dashboard</a><a href="projeto.html">Projeto</a><a href="solicitacao.html">Solicitação</a><a href="proposta.html">Proposta</a><a href="fornecedor.html">Fornecedor</a><a href="mensagens.html">Mensagens</a><a href="notificacoes.html">Notificações</a><a href="#" data-logout>Sair</a></nav></aside><main class="main"><div class="topbar"><div><h1 class="title">Dashboard do Fornecedor</h1><div class="muted">Olá, <span data-user></span></div></div></div><div id="m" class="grid"></div><section class="card section"><h2 class="section-title">Visão geral</h2><div id="info" class="empty">Carregando...</div></section></main></div><script src="js/dashboard.js"></script><script>const s=layout('Dashboard do Fornecedor','FORNECEDOR');if(s)loadDashboardV2().then(d=>{m.innerHTML=[['Projetos',d.projetos],['Solicitações',d.solicitacoes],['Propostas',d.propostas],['Mensagens',d.mensagens]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('');info.innerHTML=`<span class="badge">${d.projetosAtivos} projetos ativos</span> <span class="badge">${d.notificacoes} notificações</span>`}).catch(e=>toast(e.message))</script></body></html>
