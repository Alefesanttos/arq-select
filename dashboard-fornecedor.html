<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARQSELECT | Dashboard Fornecedor</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:#f4f7fb;color:#0f172a}.top{height:72px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{font-weight:900;font-size:22px}.top button{border:1px solid #334155;background:#1e293b;color:#fff;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.wrap{width:min(1200px,94vw);margin:28px auto}.welcome{margin-bottom:22px}.welcome h1{margin:0 0 6px;font-size:28px}.muted{color:#64748b}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;box-shadow:0 8px 28px #0f172a0a}.label{font-size:12px;color:#64748b;font-weight:800;text-transform:uppercase}.num{font-size:30px;font-weight:900;margin-top:7px}.section{margin-top:24px}.section h2{font-size:19px}.table{background:#fff;border:1px solid #e2e8f0;border-radius:18px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:15px;border-bottom:1px solid #eef2f7;font-size:13px}th{background:#f8fafc;color:#64748b;font-size:11px;text-transform:uppercase}.badge{padding:7px 10px;border-radius:99px;background:#eff6ff;color:#1d4ed8;font-weight:800}.empty{text-align:center;padding:35px;color:#64748b}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.cards{grid-template-columns:1fr}.top{padding:0 16px}}
</style><style>
/* ARQSELECT PREMIUM DESIGN SYSTEM 3.0 */
:root{
  --arq-bg:#070707;--arq-bg2:#0d0d0d;--arq-card:rgba(19,19,19,.88);--arq-card2:#121212;
  --arq-gold:#d4af37;--arq-gold2:#f3df8a;--arq-text:#f8f7f2;--arq-muted:#a9a49a;
  --arq-line:rgba(212,175,55,.18);--arq-shadow:0 18px 55px rgba(0,0,0,.42);
}
html{scroll-behavior:smooth}body{background:
 radial-gradient(circle at 85% -10%,rgba(212,175,55,.10),transparent 30%),
 radial-gradient(circle at 10% 100%,rgba(212,175,55,.055),transparent 28%),var(--arq-bg)!important;color:var(--arq-text)!important;}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 95%);}
.top,.nav,.sidebar,.header,.toolbar{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);}
.top{background:rgba(7,7,7,.82)!important;border-bottom:1px solid var(--arq-line)!important;box-shadow:0 8px 35px rgba(0,0,0,.22)}
.brand,.logo{color:var(--arq-text)!important;text-shadow:0 2px 18px rgba(212,175,55,.16)}
.brand span,.logo span{color:var(--arq-gold2)!important}
.card,.panel,.box,.item,.list,.product,.profile,.stat,.metric,.tile,.table-wrap,.composer,.conversation,.sidebar,.modal,.sheet,.empty,.notice{background:linear-gradient(145deg,rgba(24,24,24,.95),rgba(12,12,12,.92))!important;border:1px solid rgba(255,255,255,.08)!important;box-shadow:var(--arq-shadow)!important;color:var(--arq-text)!important}
.card:hover,.product:hover,.profile:hover,.tile:hover,.item:hover{transform:translateY(-2px);border-color:rgba(212,175,55,.30)!important;box-shadow:0 22px 65px rgba(0,0,0,.48),0 0 0 1px rgba(212,175,55,.04) inset!important;transition:.22s ease}
input,textarea,select{background:rgba(255,255,255,.055)!important;color:#fff!important;border:1px solid rgba(255,255,255,.11)!important;border-radius:12px!important;outline:none!important}
input:focus,textarea:focus,select:focus{border-color:rgba(212,175,55,.75)!important;box-shadow:0 0 0 3px rgba(212,175,55,.10)!important}
button,.btn{border-radius:12px!important;transition:.2s ease}
.btn.gold,.gold,.primary,.btn-primary,.cta{background:linear-gradient(135deg,#f0d87a,#b78a2f)!important;color:#16120a!important;box-shadow:0 10px 30px rgba(212,175,55,.18)!important;border:1px solid rgba(255,255,255,.15)!important}
.btn.gold:hover,.gold:hover,.primary:hover,.btn-primary:hover,.cta:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn,.light,.secondary{background:rgba(255,255,255,.065)!important;color:#f3f1ea!important;border:1px solid rgba(255,255,255,.10)!important}
.muted,.meta,.small,.ey,.role,.hint{color:var(--arq-muted)!important}
.badge,.tag,.pill{background:rgba(212,175,55,.12)!important;color:var(--arq-gold2)!important;border:1px solid rgba(212,175,55,.2)!important}
hr{border-color:rgba(255,255,255,.08)!important}
table{color:#f6f4ed!important}th{color:var(--arq-gold2)!important;background:rgba(212,175,55,.06)!important}td{border-color:rgba(255,255,255,.07)!important}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:#080808}::-webkit-scrollbar-thumb{background:linear-gradient(#8d6a25,#d4af37);border-radius:10px}
@media(max-width:700px){.top{padding:13px 16px!important}.nav{gap:6px!important}.btn{padding:10px 12px!important}.card,.panel,.box{border-radius:16px!important}}
/* WhatsApp CTA */
.arq-whatsapp{position:fixed;right:22px;bottom:22px;z-index:9999;display:flex;align-items:center;gap:10px;padding:13px 17px;border-radius:999px;background:linear-gradient(135deg,#20d466,#13a653);color:#fff!important;font-weight:900;letter-spacing:.01em;box-shadow:0 16px 38px rgba(0,0,0,.36),0 0 0 1px rgba(255,255,255,.16) inset;text-decoration:none!important}
.arq-whatsapp:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 20px 45px rgba(0,0,0,.42),0 0 0 1px rgba(255,255,255,.20) inset}
.arq-whatsapp svg{width:22px;height:22px;flex:none;fill:currentColor}
.arq-whatsapp span{white-space:nowrap}@media(max-width:520px){.arq-whatsapp{width:56px;height:56px;justify-content:center;padding:0;right:15px;bottom:15px}.arq-whatsapp span{display:none}.arq-whatsapp svg{width:27px;height:27px}}
</style></head><body><header class="top"><div class="brand">ARQSELECT</div><button onclick="sair()">Sair</button></header><main class="wrap"><section class="welcome"><h1 id="hello">Olá!</h1><div class="muted">Seu painel profissional de relacionamento, oportunidades e projetos.</div></section><section class="cards"><div class="card"><div class="label">Projetos</div><div id="total" class="num">—</div></div><div class="card"><div class="label">Novos</div><div id="novos" class="num">—</div></div><div class="card"><div class="label">Orçamentos</div><div id="orcamentos" class="num">—</div></div><div class="card"><div class="label">Fechados</div><div id="fechados" class="num">—</div></div></section><section class="section"><h2>Visão geral</h2><div class="cards"><div class="card"><div class="label">Em análise</div><div id="analise" class="num">—</div></div><div class="card"><div class="label">Propostas enviadas</div><div id="propostas" class="num">—</div></div><div class="card"><div class="label">Em execução</div><div id="execucao" class="num">—</div></div><div class="card"><div class="label">Concluídos</div><div id="concluidos" class="num">—</div></div></div></section><section class="section"><h2>Projetos recentes</h2><div id="tabela" class="table"><div class="empty">Carregando...</div></div></section></main><script>
const API='https://script.google.com/macros/s/AKfycbz_jLzNa87U_himraaCczzqGpQdq63AyIVogQ9-YGnqXuQYl3OSJfV4E7xYfPdnv8-d/exec';const token=localStorage.getItem('ARQSELECT_PORTAL_TOKEN');if(!token)location.href='ARQSELECT_LOGIN_FORNECEDOR.html';
async function load(){try{const u=new URL(API);u.searchParams.set('acao','portal_dashboard');u.searchParams.set('token',token);const d=await fetch(u,{cache:'no-store'}).then(r=>r.json());if(!d.sucesso){localStorage.removeItem('ARQSELECT_PORTAL_TOKEN');location.href='ARQSELECT_LOGIN_FORNECEDOR.html';return}const p=d.perfil,m=d.metricas;document.getElementById('hello').textContent='Olá, '+p.nome+'!';for(const [id,val] of Object.entries({total:m.totalProjetos,novos:m.novos,orcamentos:m.orcamentos,fechados:m.fechados,analise:m.emAnalise,propostas:m.propostas,execucao:m.execucao,concluidos:m.concluidos}))document.getElementById(id).textContent=val;const rows=d.recentes||[];document.getElementById('tabela').innerHTML=rows.length?'<table><thead><tr><th>ID</th><th>Data</th><th>Projeto</th><th>Tipo</th><th>Investimento</th><th>Status</th></tr></thead><tbody>'+rows.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.data)}</td><td><b>${esc(r.projeto||'—')}</b></td><td>${esc(r.tipo||'—')}</td><td>${esc(r.investimento||'—')}</td><td><span class="badge">${esc(r.status)}</span></td></tr>`).join('')+'</tbody></table>':'<div class="empty">Nenhum projeto encontrado para este e-mail.</div>'}catch(e){document.getElementById('tabela').innerHTML='<div class="empty">Não foi possível atualizar o painel.</div>'}}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function sair(){const u=new URL(API);u.searchParams.set('acao','portal_logout');u.searchParams.set('token',token);try{await fetch(u)}catch(e){}localStorage.removeItem('ARQSELECT_PORTAL_TOKEN');location.href='ARQSELECT_LOGIN_FORNECEDOR.html'}load();setInterval(load,30000);
</script></body></html>
