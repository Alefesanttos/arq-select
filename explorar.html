<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARQSELECT | Explorar</title><style>:root{--bg:#f5f6f8;--card:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--dark:#0b1220;--gold:#c8a457;--shadow:0 14px 40px rgba(16,24,40,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}.top{background:var(--dark);color:#fff;padding:16px 5vw;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20}.brand{font-weight:950;letter-spacing:.13em}.brand span{color:#dfc471}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer}.btn.gold{background:linear-gradient(135deg,#e3ca88,#b88e35);color:#16120a}.btn.light{background:#eef2f6;color:#101828}.wrap{width:min(1220px,92vw);margin:auto;padding:32px 0 70px}.hero{background:linear-gradient(135deg,#111827,#1f2937);color:#fff;border-radius:24px;padding:34px;box-shadow:var(--shadow);margin-bottom:24px}.ey{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#e4cb83;font-weight:900}.muted{color:var(--muted);line-height:1.6}.hero .muted{color:#cbd5e1}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar>*{min-width:180px;flex:1}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px #c8a45719}.product{display:flex;flex-direction:column;gap:10px}.thumb{height:210px;border-radius:14px;background:#eef1f4;display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.price{font-weight:950;font-size:20px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2f6;font-size:10px;font-weight:850}.chat{display:grid;grid-template-columns:320px 1fr;gap:16px}.conv-list{display:grid;gap:7px;max-height:650px;overflow:auto}.conv{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}.conv.active{border-color:var(--gold);box-shadow:0 0 0 2px #c8a45722}.messages{height:560px;overflow:auto;padding:14px;background:#f7f8fa;border-radius:16px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:78%;padding:11px 13px;border-radius:16px;background:#fff;border:1px solid var(--line)}.bubble.mine{align-self:flex-end;background:#fff5dc;border-color:#e8d49d}.attach{margin-top:7px;padding:9px;border:1px solid var(--line);border-radius:10px}.composer{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:10px}.composer textarea{min-height:52px;resize:vertical}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:16px;z-index:50}.modal.open{display:grid}.modalbox{background:#fff;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:22px}.close{float:right;border:0;background:#eef2f6;border-radius:9px;padding:7px 10px;font-weight:900}.audio{display:flex;align-items:center;gap:8px}.audio audio{width:min(300px,100%)}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.chat{grid-template-columns:1fr}.conv-list{max-height:220px}.messages{height:55vh}}@media(max-width:600px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.nav{width:100%}.composer{grid-template-columns:1fr}.wrap{padding-top:18px}}</style></head><body><header class="top"><div class="brand">ARQ<span>SELECT</span></div><nav class="nav"><a class="btn light" href="index.html">Início</a><a class="btn light" href="chat.html">Chat</a><a class="btn gold" href="conexoes.html">Conexões</a></nav></header><main class="wrap"><section class="hero"><div class="ey">MARKETPLACE ARQSELECT</div><h1>Explore produtos e soluções para seus projetos.</h1><div class="muted">Busque por material, marca, categoria ou fornecedor.</div></section><div class="toolbar"><input id="q" placeholder="Ex.: piso de madeira cumaru, porta pivotante..."><input id="cat" placeholder="Categoria"><button class="btn gold" onclick="load()">Pesquisar</button></div><div id="grid" class="grid"><div class="card">Carregando produtos...</div></div></main><script>const API='https://script.google.com/macros/s/AKfycbz_jLzNa87U_himraaCczzqGpQdq63AyIVogQ9-YGnqXuQYl3OSJfV4E7xYfPdnv8-d/exec',token=localStorage.getItem('ARQSELECT_PORTAL_TOKEN');const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function fotos(v){try{return JSON.parse(v)}catch(e){}return String(v||'').split(/\n/).map(x=>x.trim()).filter(Boolean)}async function load(){const u=new URL(API);[['acao','portal_produtos'],['token',token||''],['q',$('q').value],['categoria',$('cat').value]].forEach(([k,v])=>u.searchParams.set(k,v));const j=await fetch(u,{cache:'no-store'}).then(r=>r.json());if(!j.sucesso){$('grid').innerHTML='<div class="card">Não foi possível carregar os produtos.</div>';return}const d=j.produtos||[];$('grid').innerHTML=d.length?d.map(p=>{const img=fotos(p.FOTOS)[0]||'';return `<article class="card product"><div class="thumb">${img?`<img src="${esc(img)}">`:'<span class="muted">Sem foto</span>'}</div><span class="badge">${esc(p.CATEGORIA||'Produto')}</span><h3>${esc(p.NOME||'Produto')}</h3><div class="muted">${esc(p.MARCA||'')} · ${esc(p.FORNECEDOR||p['FORNECEDOR E-MAIL']||'')}</div><div class="price">${esc(p.PRECO||p['FAIXA PRECO']||'Consultar')}</div><a class="btn gold" href="produto.html?id=${encodeURIComponent(p.ID)}">Ver produto</a></article>`}).join(''):'<div class="card">Nenhum produto encontrado.</div>'}load();</script></body></html>
