<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="global.css"><link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="forms.css"><link rel="stylesheet" href="responsive.css"><script src="app.js"></script></head><body><div class="app"><aside class="sidebar"><div class="brand">ARQSELECT</div><nav class="nav"><a href="dashboard-arquiteto.html">Dashboard</a><a href="projeto.html">Projeto</a><a href="solicitacao.html">Solicitação</a><a href="proposta.html">Proposta</a><a href="fornecedor.html">Fornecedor</a><a href="mensagens.html">Mensagens</a><a href="notificacoes.html">Notificações</a><a href="#" data-logout>Sair</a></nav></aside><main class="main"><h1 id="t" class="title">Fornecedor</h1><section id="v" class="card">Carregando...</section></main></div><script>const a=layout('Fornecedor');if(a&&qs.get('id'))apiGet('fornecedor_v2',{token:a.token,id:qs.get('id')}).then(r=>{if(!r.sucesso)throw Error(r.mensagem);const f=r.fornecedor||{};t.textContent=f.EMPRESA||f.NOME||qs.get('id');v.innerHTML=`<div class="grid">${['CNPJ','E-MAIL','TELEFONE','WHATSAPP','CIDADE','ESTADO','STATUS'].map(k=>`<div><b>${k}</b><div>${esc(f[k]||'')}</div></div>`).join('')}</div><hr><p>${esc(f.DESCRICAO||f['DESCRIÇÃO']||'')}</p>`}).catch(e=>v.textContent=e.message)</script></body></html>
