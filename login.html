<!doctype html><html lang="pt-BR"><head><title>Login • ARQSELECT</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/responsive.css"><script src="js/app.js"></script></head><body><main class="login"><section class="login-card"><h1>ARQSELECT</h1><p class="muted">Acesso à plataforma</p><form id="f" class="form-grid"><div class="field full"><label>Usuário ou e-mail</label><input class="input" name="usuario" required></div><div class="field full"><label>Senha</label><input class="input" type="password" name="senha" required></div><div class="full"><button class="btn" style="width:100%">Entrar</button></div></form><p id="msg" class="muted"></p></section></main><script src="js/auth.js"></script><script>f.onsubmit=async e=>{e.preventDefault();const d=new FormData(f);try{const r=await doLogin(d.get('usuario'),d.get('senha'));location.href=r.usuario.PERFIL==='ADMIN'?'admin-v2.html':r.usuario.PERFIL==='FORNECEDOR'?'dashboard-fornecedor.html':'dashboard-arquiteto.html'}catch(x){msg.textContent=x.message}}</script></body></html>
