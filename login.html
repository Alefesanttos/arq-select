<!doctype html><html lang="pt-BR"><head><title>Login • ARQSELECT</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="global.css"><link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="forms.css"><link rel="stylesheet" href="responsive.css"><script src="app.js"></script></head><body><main class="login"><section class="login-card"><h1>ARQSELECT</h1><p class="muted">Acesso à plataforma</p><form id="f" class="form-grid"><div class="field full"><label>Usuário ou e-mail</label><input class="input" name="usuario" required></div><div class="field full"><label>Senha</label><input class="input" type="password" name="senha" required></div><div class="full"><button class="btn" style="width:100%">Entrar</button></div></form><p id="msg" class="muted"></p></section></main><script src="auth.js"></script><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget;const d=new FormData(form);const out=document.getElementById('msg');out.textContent='Entrando...';try{const r=await doLogin(d.get('usuario'),d.get('senha'));location.href=r.usuario.PERFIL==='ADMIN'?'admin-v2.html':r.usuario.PERFIL==='FORNECEDOR'?'dashboard-fornecedor.html':'dashboard-arquiteto.html'}catch(x){out.textContent=x.message||'Não foi possível entrar.'}}</script></body></html>
