<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/responsive.css"><script src="js/app.js"></script></head><body><div class="app"><aside class="sidebar"><div class="brand">ARQSELECT</div><nav class="nav"><a href="dashboard-arquiteto.html">Dashboard</a><a href="projeto.html">Projeto</a><a href="solicitacao.html">Solicitação</a><a href="proposta.html">Proposta</a><a href="fornecedor.html">Fornecedor</a><a href="mensagens.html">Mensagens</a><a href="notificacoes.html">Notificações</a><a href="#" data-logout>Sair</a></nav></aside><main class="main"><h1 class="title">Mensagens</h1><section class="card"><div id="list">Carregando...</div><form id="f" class="form-grid"><div class="field full"><label>Destinatário ID</label><input class="input" name="destinatario_id" required></div><div class="field full"><label>Projeto ID</label><input class="input" name="projeto_id"></div><div class="field full"><label>Mensagem</label><textarea class="textarea" name="mensagem" required></textarea></div><div class="full"><button class="btn">Enviar</button></div></form></section></main></div><script src="js/mensagens.js"></script><script>const a=layout('Mensagens');async function load(){const r=await loadMessagesV2(qs.get('projeto_id')||'');list.innerHTML=(r.mensagens||[]).map(x=>`<div class="card"><b>${esc(x.REMETENTE_ID)}</b><p>${esc(x.MENSAGEM)}</p></div>`).join('')||'<div class="empty">Nenhuma mensagem.</div>'}if(a)load();f.onsubmit=async e=>{e.preventDefault();const r=await sendMessageV2(Object.fromEntries(new FormData(f)));if(r.sucesso){toast('Enviada');f.reset();load()}else toast(r.mensagem)};</script></body></html>
