<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARQSELECT | Notificações</title><style id="arqselect-global-premium">:root{--arq-bg:#080808;--arq-surface:#131313;--arq-surface2:#1a1a1a;--arq-text:#f5f2e9;--arq-muted:#aaa49a;--arq-gold:#d4af37;--arq-gold2:#f0d77a;--arq-line:rgba(255,255,255,.09);--arq-shadow:0 22px 60px rgba(0,0,0,.34)}html,body{background:var(--arq-bg)!important;color:var(--arq-text)!important}body{background-image:radial-gradient(circle at 10% 0%,rgba(212,175,55,.07),transparent 32%),radial-gradient(circle at 90% 100%,rgba(255,255,255,.03),transparent 34%),linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px)!important;background-size:auto,auto,28px 28px,28px 28px!important}body *{color:inherit}main,.wrap,.content,.shell,.page,.container{color:var(--arq-text)}a{color:inherit}input,select,textarea{background:rgba(255,255,255,.055)!important;color:var(--arq-text)!important;border-color:var(--arq-line)!important}select option{background:#161616!important;color:#f5f2e9!important}button{color:inherit}.card,.panel,.box,.tile,.item,.list,.table,.table-wrap,.product,.profile,.stat,.metric,.notice,.sheet,.conversation,.hero-card,.feature-card,.post,.opportunity,.profile-card,.request-card,.proposal-card,.login-card,.auth-card{background:linear-gradient(145deg,rgba(24,24,24,.98),rgba(12,12,12,.95))!important;border-color:var(--arq-line)!important;color:var(--arq-text)!important;box-shadow:var(--arq-shadow)!important}.muted,.small,.hint,.subtle,.meta{color:var(--arq-muted)!important}.nav,.top,.header,.navbar{background:rgba(7,7,7,.88)!important;border-color:var(--arq-line)!important;backdrop-filter:blur(16px)}th{background:rgba(212,175,55,.07)!important;color:var(--arq-gold2)!important}td{border-color:var(--arq-line)!important}.modalbox,.modal-card,.modal-content,.dialog,.dropdown,.menu,.sheet-content{background:#151515!important;color:var(--arq-text)!important;border-color:var(--arq-line)!important}.empty{color:var(--arq-muted)!important}.btn.light,.btn:not(.gold),.button{background:rgba(255,255,255,.06)!important;color:var(--arq-text)!important;border-color:var(--arq-line)!important}.btn.gold,.gold,.primary,.btn-primary{background:linear-gradient(135deg,var(--arq-gold2),var(--arq-gold))!important;color:#171208!important}.arq-whatsapp,.wa-float{background:linear-gradient(135deg,#25d366,#16a34a)!important;color:#fff!important}.arq-whatsapp svg,.wa-float svg{fill:currentColor;width:22px;height:22px}@media(max-width:760px){.card,.panel,.box{border-radius:16px!important}}</style></head><body><header class="top"><div><div class="brand">ARQ<span>SELECT</span></div><div class="top-sub">Central de notificações</div></div><nav class="nav"><a href="index.html">Início</a><a href="explorar.html">Explorar</a><a href="chat.html">Chat</a></nav></header><main class="wrap"><section class="page-head"><div><div class="ey">ARQSELECT PREMIUM</div><h1>Notificações</h1><p class="muted">Acompanhe mensagens, projetos, solicitações, propostas e novas conexões.</p></div><button class="btn gold" onclick="carregar()">Atualizar</button></section><section id="list" class="notif-list"><div class="empty">Carregando notificações...</div></section></main><div id="toast" class="toast"></div><script>const API='https://script.google.com/macros/s/AKfycbz_jLzNa87U_himraaCczzqGpQdq63AyIVogQ9-YGnqXuQYl3OSJfV4E7xYfPdnv8-d/exec';const token=localStorage.getItem('ARQSELECT_PORTAL_TOKEN');const type=localStorage.getItem('ARQSELECT_PORTAL_TIPO');const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function post(p){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)}).then(r=>r.json())}function destinoFallback(tipo,registro){const x=String(tipo||'').toUpperCase();if(x.indexOf('MENS')>=0)return 'chat.html'+(registro?'?conversaId='+encodeURIComponent(registro):'');if(x.indexOf('OPORT')>=0)return 'oportunidades.html';if(x.indexOf('PROPOST')>=0)return 'propostas-portal.html';if(x.indexOf('PROJ')>=0)return type==='FORNECEDOR'?'ARQSELECT_FORNECEDOR_PROJETOS.html':'ARQSELECT_ARQUITETO_PROJETOS.html';if(x.indexOf('PROD')>=0)return 'explorar.html';if(x.indexOf('CONEX')>=0)return 'conexoes.html';if(x.indexOf('AVALIA')>=0)return 'avaliacoes.html';if(x.indexOf('SUPORT')>=0)return 'suporte.html';if(x.indexOf('SOLIC')>=0)return type==='FORNECEDOR'?'ARQSELECT_FORNECEDOR_SOLICITACOES.html':'ARQSELECT_ARQUITETO_PROJETOS.html';return type==='FORNECEDOR'?'ARQSELECT_DASHBOARD_FORNECEDOR.html':'ARQSELECT_DASHBOARD_ARQUITETO.html'}function urlDestino(n){const d=String(n.DESTINO||n.destino||'').toLowerCase(),id=n['DESTINO ID']||n.destinoId||n.REGISTRO||'';const map={chat:'chat.html',projetos:type==='FORNECEDOR'?'ARQSELECT_FORNECEDOR_PROJETOS.html':'ARQSELECT_ARQUITETO_PROJETOS.html',propostas:'propostas-portal.html',solicitacoes:type==='FORNECEDOR'?'ARQSELECT_FORNECEDOR_SOLICITACOES.html':'ARQSELECT_ARQUITETO_PROJETOS.html',produtos:'explorar.html',conexoes:'conexoes.html',oportunidades:'oportunidades.html',avaliacoes:'avaliacoes.html',ranking:'ranking.html',suporte:'suporte.html',favoritos:'favoritos.html',historico:'historico-portal.html'};let u=map[d]||destinoFallback(n.TIPO,n.REGISTRO);if(id&&d==='chat')u+='?conversaId='+encodeURIComponent(id);if(id&&d==='produtos')u='produto.html?id='+encodeURIComponent(id);return u}async function carregar(){if(!token){location.href=type==='FORNECEDOR'?'ARQSELECT_LOGIN_FORNECEDOR.html':'ARQSELECT_LOGIN_ARQUITETO.html';return}try{const u=new URL(API);u.searchParams.set('acao','portal_notificacoes');u.searchParams.set('token',token);u.searchParams.set('limite','100');const r=await fetch(u,{cache:'no-store'});const j=await r.json();if(!j.sucesso)throw new Error(j.mensagem||'Falha ao carregar notificações.');const n=j.notificacoes||[];$('list').innerHTML=n.length?n.map(x=>`<button class="notif-row ${String(x.LIDA).toUpperCase()==='SIM'?'read':''}" onclick='abrir(${JSON.stringify(x).replace(/'/g,"&#39;")})'><span class="dot"></span><span><b>${esc(x['TÍTULO']||x.TITULO||'Notificação')}</b><small>${esc(x.MENSAGEM||'')}</small><small>${esc(x.SEGMENTO||x.TIPO||'')} · ${esc(x.DATA||'')}</small></span></button>`).join(''):'<div class="empty">Nenhuma notificação.</div>'}catch(e){$('list').innerHTML='<div class="empty"><b>Não foi possível carregar as notificações.</b><div>'+esc(e.message)+'</div><button class="btn light" onclick="carregar()">Tentar novamente</button></div>'}}async function abrir(n){try{await post({acao:'portal_notificacao_lida',token,id:n.ID})}catch(e){}location.href=urlDestino(n)}carregar();</script></body></html>
