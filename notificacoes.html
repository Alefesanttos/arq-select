</head><body data-arq-page="notificacoes" data-arq-surface="workspace"><header class="top"><div><div class="brand">ARQ<span>SELECT</span></div><div class="top-sub">Central de notificações</div></div><nav class="nav"><a href="index.html">Início</a><a href="explorar.html">Explorar</a><a href="chat.html">Chat</a></nav></header><main class="wrap"><section class="page-head"><div><div class="ey">ARQSELECT PREMIUM</div><h1>Notificações</h1><p class="muted">Acompanhe mensagens, projetos, solicitações, propostas e novas conexões.</p></div><button class="btn gold" onclick="carregar()">Atualizar</button></section><section id="list" class="notif-list"><div class="empty">Carregando notificações...</div></section></main><div id="toast" class="toast"></div><script>const API=(window.ARQSELECT_API_URL||window.ARQSELECT_CONFIG.apiUrl);const token=localStorage.getItem('ARQSELECT_PORTAL_TOKEN');const type=localStorage.getItem('ARQSELECT_PORTAL_TIPO');const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(t,r){const x=String(t||'').toUpperCase();if(x==='MENSAGEM'){location.href='chat.html';return}if(x==='PROJETO'){location.href='dashboard-'+(String(type||'').toLowerCase()==='fornecedor'?'fornecedor':'arquiteto')+'.html';return}if(x==='PRODUTO'){location.href='explorar.html';return}if(x==='CONEXAO'){location.href='conexoes.html';return}if(x==='SOLICITACAO'||x==='PROPOSTA'){location.href='ARQSELECT_'+(String(type||'').toUpperCase()==='FORNECEDOR'?'FORNECEDOR_SOLICITACOES':'ARQUITETO_SOLICITAR')+'.html';return}location.href='chat.html'}async function carregar(){if(!token){location.href=type==='FORNECEDOR'?'ARQSELECT_LOGIN_FORNECEDOR.html':'ARQSELECT_LOGIN_ARQUITETO.html';return}try{const u=new URL(API);u.searchParams.set('acao','portal_notificacoes');u.searchParams.set('token',token);u.searchParams.set('limite','100');const r=await fetch(u,{cache:'no-store'});const j=await r.json();if(!j.sucesso)throw new Error(j.mensagem||'Falha ao carregar notificações.');const n=j.notificacoes||[];$('list').innerHTML=n.length?n.map(x=>`<button class="notif-row ${String(x.LIDA).toUpperCase()==='SIM'?'read':''}" onclick="abrir('${esc(x.ID)}','${esc(x.TIPO)}','${esc(x.REGISTRO)}')"><span class="dot"></span><span><b>${esc(x.TITULO||'Notificação')}</b><small>${esc(x.MENSAGEM||'')}</small><small>${esc(x.DATA||'')}</small></span></button>`).join(''):'<div class="empty">Nenhuma notificação.</div>'}catch(e){$('list').innerHTML='<div class="empty"><b>Não foi possível carregar as notificações.</b><div>'+esc(e.message)+'</div><button class="btn light" onclick="carregar()">Tentar novamente</button></div>'}}async function abrir(id,t,r){try{const u=new URL(API);u.searchParams.set('acao','portal_notificacao_lida');u.searchParams.set('token',token);u.searchParams.set('id',id);await fetch(u,{cache:'no-store'});}catch(e){}go(t,r)}carregar();</script><script src="arqselect-4.js"></script><script src="arq-premium.js?v=6.0.0"></script>
