<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d100e"><link rel="icon" href="favicon.ico"><link rel="apple-touch-icon" href="icon-192.png"><script src="arq-config.js?v=5.10.0"></script><link rel="stylesheet" href="arq-design-system.css?v=5.10.0"><link rel="stylesheet" href="arq-services.css?v=5.10.0"><title>Perfil profissional | ARQSELECT</title></head><body data-service-page="onboarding"><div class="srv-shell"><aside class="srv-sidebar" data-srv-sidebar></aside><main class="srv-main"><section class="srv-hero"><div class="srv-kicker">ONBOARDING GUIADO</div><h1>Prepare seu perfil profissional.</h1><p>Quanto mais completo o perfil, melhor a precisão do matching e a qualidade das oportunidades recebidas.</p></section><section class="srv-card full"><h2>1. Dados profissionais</h2><form id="providerForm" class="srv-form" data-arq-autosave data-arq-draft="prestador-perfil" data-arq-draft-type="PERFIL_PRESTADOR"><label>Nome profissional<input name="nomeProfissional" required></label><label>Razão social<input name="razaoSocial"></label><label>Nome fantasia<input name="nomeFantasia"></label><label>Tipo<select name="tipoPessoa"><option>AUTONOMO</option><option>MEI</option><option>EMPRESA</option><option>EQUIPE ESPECIALIZADA</option></select></label><label>CPF/CNPJ<input name="cpfCnpj"></label><label>Responsável<input name="responsavel"></label><label>Telefone<input name="telefone"></label><label>WhatsApp<input name="whatsapp"></label><label>Cidade<input name="cidade"></label><label>Estado<input name="estado"></label><label>CEP<input name="cep"></label><label>Endereço comercial<input name="enderecoComercial"></label><label>Site<input name="site"></label><label>Instagram<input name="instagram"></label><label>LinkedIn<input name="linkedin"></label><label>Foto/logo URL<input name="fotoUrl"></label><label class="full">Capa URL<input name="capaUrl"></label><label class="full">Descrição<textarea name="descricao" rows="5"></textarea></label><label>Anos de experiência<input name="anosExperiencia" type="number"></label><label>Tamanho da equipe<input name="tamanhoEquipe" type="number"></label><label>Área de atuação<input name="areaAtuacao"></label><label>Raio máximo (km)<input name="raioKm" type="number"></label><label class="full">Tipos de cliente<input name="tiposCliente" placeholder="Residencial alto padrão; Comercial; Arquitetos"></label><label class="full">Capacidade operacional<input name="capacidadeOperacional"></label><label>Faixa de projeto<input name="faixaProjeto"></label><label>Certificações<input name="certificacoes"></label><div class="full"><button class="srv-btn gold">Salvar perfil</button></div></form></section><section class="srv-card full"><h2>2. Serviços e especialidades</h2><form id="specialtiesForm" class="srv-form" data-arq-autosave data-arq-draft="prestador-especialidades" data-arq-draft-type="PERFIL_PRESTADOR"><label class="full">Selecione suas especialidades<select id="specialties" multiple size="12"></select></label><label><input id="altoPadrao" type="checkbox"> Atendo projetos de alto padrão</label><div class="full"><button class="srv-btn gold">Salvar especialidades</button></div></form></section><section class="srv-card full"><h2>3. Região atendida</h2><form id="regionForm" class="srv-form" data-arq-autosave data-arq-draft="prestador-regiao" data-arq-draft-type="PERFIL_PRESTADOR"><label>Cidade base<input name="cidadeBase"></label><label>Estado<input name="estadoBase"></label><label>Raio km<input name="raioKm" type="number"></label><label class="full">Cidades atendidas<input name="cidades" placeholder="Campinas; Valinhos; Vinhedo"></label><label class="full">Estados atendidos<input name="estados"></label><div class="full"><button class="srv-btn gold">Salvar cobertura</button></div></form></section><section class="srv-card full"><h2>4. Disponibilidade</h2><form id="availabilityForm" class="srv-form" data-arq-autosave data-arq-draft="prestador-disponibilidade" data-arq-draft-type="PERFIL_PRESTADOR"><label>Status<select name="status"><option>DISPONIVEL IMEDIATAMENTE</option><option>DISPONIVEL EM ATE 7 DIAS</option><option>DISPONIVEL EM 15 DIAS</option><option>AGENDA PARCIAL</option><option>AGENDA CHEIA</option></select></label><label>Data disponível<input name="dataDisponivel" type="date"></label><label>Capacidade semanal<input name="capacidadeSemanal"></label><label class="full">Observações<textarea name="observacoes"></textarea></label><div class="full"><button class="srv-btn gold">Atualizar disponibilidade</button></div></form></section></main></div><script src="arqselect-4.js?v=5.8.1"></script><script src="arqselect-6.js?v=5.10.0"></script><script src="arq-services.js?v=5.10.0"></script><script src="arq-experience.js?v=5.10.0"></script></body></html>
