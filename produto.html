<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARQSELECT | Produto</title><style>:root{--bg:#f5f6f8;--card:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--dark:#0b1220;--gold:#c8a457;--shadow:0 14px 40px rgba(16,24,40,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}.top{background:var(--dark);color:#fff;padding:16px 5vw;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20}.brand{font-weight:950;letter-spacing:.13em}.brand span{color:#dfc471}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer}.btn.gold{background:linear-gradient(135deg,#e3ca88,#b88e35);color:#16120a}.btn.light{background:#eef2f6;color:#101828}.wrap{width:min(1220px,92vw);margin:auto;padding:32px 0 70px}.hero{background:linear-gradient(135deg,#111827,#1f2937);color:#fff;border-radius:24px;padding:34px;box-shadow:var(--shadow);margin-bottom:24px}.ey{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#e4cb83;font-weight:900}.muted{color:var(--muted);line-height:1.6}.hero .muted{color:#cbd5e1}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar>*{min-width:180px;flex:1}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px #c8a45719}.product{display:flex;flex-direction:column;gap:10px}.thumb{height:210px;border-radius:14px;background:#eef1f4;display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.price{font-weight:950;font-size:20px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2f6;font-size:10px;font-weight:850}.chat{display:grid;grid-template-columns:320px 1fr;gap:16px}.conv-list{display:grid;gap:7px;max-height:650px;overflow:auto}.conv{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}.conv.active{border-color:var(--gold);box-shadow:0 0 0 2px #c8a45722}.messages{height:560px;overflow:auto;padding:14px;background:#f7f8fa;border-radius:16px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:78%;padding:11px 13px;border-radius:16px;background:#fff;border:1px solid var(--line)}.bubble.mine{align-self:flex-end;background:#fff5dc;border-color:#e8d49d}.attach{margin-top:7px;padding:9px;border:1px solid var(--line);border-radius:10px}.composer{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:10px}.composer textarea{min-height:52px;resize:vertical}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:16px;z-index:50}.modal.open{display:grid}.modalbox{background:#fff;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:22px}.close{float:right;border:0;background:#eef2f6;border-radius:9px;padding:7px 10px;font-weight:900}.audio{display:flex;align-items:center;gap:8px}.audio audio{width:min(300px,100%)}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.chat{grid-template-columns:1fr}.conv-list{max-height:220px}.messages{height:55vh}}@media(max-width:600px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.nav{width:100%}.composer{grid-template-columns:1fr}.wrap{padding-top:18px}}</style></head><body><header class="top"><div class="brand">ARQ<span>SELECT</span></div><nav class="nav"><a class="btn light" href="explorar.html">Explorar</a><a class="btn light" href="chat.html">Chat</a></nav></header><main class="wrap"><div id="app" class="card">Carregando produto...</div></main><div id="modal" class="modal"><div class="modalbox"><button class="close" onclick="closeM()">×</button><h2>Solicitar orçamento</h2><div class="muted">Envie os detalhes para o fornecedor.</div><label>Projeto<select id="projeto"><option value="">Sem projeto</option></select></label><label>Quantidade<input id="qtd"></label><label>Medidas<input id="med"></label><label>Prazo desejado<input id="prazo"></label><label>Observações<textarea id="obs" rows="4"></textarea></label><button class="btn gold" onclick="quote()">Enviar solicitação</button></div></div><script>const API='https://script.google.com/macros/s/AKfycbz_jLzNa87U_himraaCczzqGpQdq63AyIVogQ9-YGnqXuQYl3OSJfV4E7xYfPdnv8-d/exec',token=localStorage.getItem('ARQSELECT_PORTAL_TOKEN'),type=localStorage.getItem('ARQSELECT_PORTAL_TIPO'),id=new URLSearchParams(location.search).get('id');let prod=null;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function get(p){const u=new URL(API);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));return fetch(u,{cache:'no-store'}).then(r=>r.json())}async function load(){const j=await get({acao:'portal_produto',token:token||'',id});if(!j.sucesso){$('app').innerHTML='<div>Produto indisponível.</div>';return}prod=j.produto;let fs=String(prod.FOTOS||'').split(/\n/).filter(Boolean);$('app').innerHTML=`<div class="grid" style="grid-template-columns:1.15fr .85fr"><div><div class="thumb" style="height:420px">${fs[0]?`<img src="${esc(fs[0])}">`:'<span class="muted">Sem foto</span>'}</div><div style="display:flex;gap:8px;margin-top:9px;overflow:auto">${fs.map(x=>`<img src="${esc(x)}" style="width:82px;height:64px;object-fit:cover;border-radius:9px">`).join('')}</div></div><div><div class="ey">${esc(prod.CATEGORIA||'PRODUTO')}</div><h1>${esc(prod.NOME||'')}</h1><div class="muted">${esc(prod.MARCA||'')} · ${esc(prod.MODELO||'')}</div><p>${esc(prod.DESCRICAO||'')}</p><div class="card" style="box-shadow:none"><b>Especificações</b><p class="muted">Material: ${esc(prod.MATERIAL||'—')}<br>Acabamento: ${esc(prod.ACABAMENTO||'—')}<br>Dimensões: ${esc(prod.DIMENSOES||'—')}<br>Cor: ${esc(prod.COR||'—')}<br>Prazo: ${esc(prod.PRAZO||'—')}</p></div><div class="toolbar"><button class="btn gold" onclick="fav()">⭐ Salvar</button><button class="btn light" onclick="quoteOpen()">📋 Solicitar orçamento</button><a class="btn light" href="chat.html">💬 Chat</a></div></div></div>`;}async function fav(){if(!token)return location.href='ARQSELECT_LOGIN_ARQUITETO.html';const j=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({acao:'portal_favorito_toggle',token,tipo:'PRODUTO',registroId:id})}).then(r=>r.json());alert(j.favorito?'Produto salvo.':'Produto removido dos favoritos.')}function quoteOpen(){if(type!=='ARQUITETO')return alert('Faça login como arquiteto para solicitar orçamento.');$('modal').classList.add('open')}function closeM(){$('modal').classList.remove('open')}async function quote(){const j=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({acao:'portal_cotacao_produto',token,produtoId:id,projetoId:$('projeto').value,quantidade:$('qtd').value,medida:$('med').value,prazo:$('prazo').value,observacoes:$('obs').value})}).then(r=>r.json());alert(j.mensagem||'Solicitação enviada.');if(j.sucesso)closeM()}load();</script></body></html>
