button{background:rgba(255,255,255,.06)!important;color:var(--arq-text)!important;border-color:var(--arq-line)!important}.btn.gold,.gold,.primary,.btn-primary{background:linear-gradient(135deg,var(--arq-gold2),var(--arq-gold))!important;color:#171208!important}.arq-whatsapp,.wa-float{background:linear-gradient(135deg,#25d366,#16a34a)!important;color:#fff!important}.arq-whatsapp svg,.wa-float svg{fill:currentColor;width:22px;height:22px}@media(max-width:760px){.card,.panel,.box{border-radius:16px!important}}</style></head><body><header class="top"><div class="brand">ARQ<span>SELECT</span></div><nav class="nav"><a class="btn light" href="explorar.html">Explorar</a><a class="btn light" href="chat.html">Chat</a></nav></header><main class="wrap"><div id="app" class="card">Carregando produto...</div></main><div id="modal" class="modal"><div class="modalbox"><button class="close" onclick="closeM()">×</button><h2>Solicitar orçamento</h2><div class="muted">Envie os detalhes para o fornecedor.</div><label>Projeto<select id="projeto"><option value="">Sem projeto</option></select></label><label>Quantidade<input id="qtd"></label><label>Medidas<input id="med"></label><label>Prazo desejado<input id="prazo"></label><label>Observações<textarea id="obs" rows="4"></textarea></label><button class="btn gold" onclick="quote()">Enviar solicitação</button></div></div><script>const API='https://script.google.com/macros/s/AKfycbz_jLzNa87U_himraaCczzqGpQdq63AyIVogQ9-YGnqXuQYl3OSJfV4E7xYfPdnv8-d/exec',token=localStorage.getItem('ARQSELECT_PORTAL_TOKEN'),type=localStorage.getItem('ARQSELECT_PORTAL_TIPO'),id=new URLSearchParams(location.search).get('id');let prod=null,relacionados=[];const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function get(p){const u=new URL(API);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));return fetch(u,{cache:'no-store'}).then(r=>r.json())}async function load(){const j=await get({acao:'portal_produto',token:token||'',id});if(!j.sucesso){$('app').innerHTML='<div>Produto indisponível.</div>';return}prod=j.produto;relacionados=j.relacionados||[];let fs=String(prod.FOTOS||'').split(/\n/).filter(Boolean);const video=String(prod.VIDEOS||'').split(/\n/).filter(Boolean)[0]||'';const relHtml=relacionados.length?`<div style="margin-top:28px"><div class="ey">PRODUTOS RELACIONADOS</div><h2>Você também pode precisar de</h2><div class="grid">${relacionados.map(r=>{const ri=String(r.FOTOS||'').split(/\n/).filter(Boolean)[0]||'';return `<a class="card" href="produto.html?id=${encodeURIComponent(r.ID)}">${ri?`<img src="${esc(ri)}" style="width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:10px">`:''}<b>${esc(r.NOME||'Produto')}</b><div class="muted">${esc(r.CATEGORIA||'')} · ${esc(r.MARCA||'')}</div></a>`}).join('')}</div></div>`:'';$('app').innerHTML=`<div class="grid" style="grid-template-columns:1.15fr .85fr"><div><div class="thumb" style="height:420px">${fs[0]?`<img src="${esc(fs[0])}">`:'<span class="muted">Sem foto</span>'}</div><div style="display:flex;gap:8px;margin-top:9px;overflow:auto">${fs.map(x=>`<img src="${esc(x)}" style="width:82px;height:64px;object-fit:cover;border-radius:9px">`).join('')}</div>${video?`<div class="card" style="margin-top:14px"><b>Vídeo do produto</b><div style="margin-top:8px"><video src="${esc(video)}" controls style="width:100%;max-height:360px;border-radius:12px"></video></div></div>`:''}</div><div><div class="ey">${esc(prod.CATEGORIA||'PRODUTO')}</div><h1>${esc(prod.NOME||'')}</h1><div class="muted">${esc(prod.MARCA||'')} · ${esc(prod.MODELO||'')}</div><div class="card" style="margin:12px 0;box-shadow:none"><b>${esc(prod.FORNECEDOR||'Fornecedor ARQSELECT')}</b><div class="muted">${Number(prod['NOTA FORNECEDOR']||0).toFixed(1)} ★ · ${esc(prod['AVALIACOES FORNECEDOR']||0)} avaliações</div></div><p>${esc(prod.DESCRICAO||'')}</p><div class="card" style="box-shadow:none"><b>Especificações</b><p class="muted">Material: ${esc(prod.MATERIAL||'—')}<br>Acabamento: ${esc(prod.ACABAMENTO||'—')}<br>Dimensões: ${esc(prod.DIMENSOES||'—')}<br>Cor: ${esc(prod.COR||'—')}<br>Prazo: ${esc(prod.PRAZO||'—')}<br>Disponibilidade: ${esc(prod.DISPONIBILIDADE||'Consultar')}<br>Garantia: ${esc(prod.GARANTIA||'Consultar')}</p></div><div class="toolbar"><button class="btn gold" onclick="fav()">⭐ Salvar</button><button class="btn light" onclick="quoteOpen()">📋 Solicitar orçamento</button><a class="btn light" href="chat.html">💬 Chat</a></div></div></div>${relHtml}`;if(type==='ARQUITETO'&&token)carregarProjetos()}async function carregarProjetos(){try{const j=await get({acao:'portal_projetos',token});const ps=j.projetos||[];$('projeto').innerHTML='<option value="">Sem projeto específico</option>'+ps.map(p=>`<option value="${esc(p.id||p.ID||p['ID PROJETO']||'')}">${esc(p.projeto||p['NOME DO PROJETO']||p.id||p.ID||'Projeto')}</option>`).join('')}catch(e){console.warn('[ARQSELECT] projetos para cotação',e)}}async function fav(){if(!token)return location.href='ARQSELECT_LOGIN_ARQUITETO.html';const j=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({acao:'portal_favorito_toggle',token,tipo:'PRODUTO',registroId:id})}).then(r=>r.json());alert(j.favorito?'Produto salvo.':'Produto removido dos favoritos.')}function quoteOpen(){if(type!=='ARQUITETO')return alert('Faça login como arquiteto para solicitar orçamento.');$('modal').classList.add('open')}function closeM(){$('modal').classList.remove('open')}async function quote(){const j=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({acao:'portal_cotacao_produto',token,produtoId:id,projetoId:$('projeto').value,quantidade:$('qtd').value,medida:$('med').value,prazo:$('prazo').value,observacoes:$('obs').value})}).then(r=>r.json());alert(j.mensagem||'Solicitação enviada.');if(j.sucesso)closeM()}load();</script>
<script id="arqselect-role-nav">
(function(){
  try{
    const type=(localStorage.getItem('ARQSELECT_PORTAL_TIPO')||'').toUpperCase();
    const nav=document.querySelector('.nav'); if(!nav || nav.querySelector('[data-arq-panel]')) return;
    if(type!=='ARQUITETO' && type!=='FORNECEDOR') return;
    const a=document.createElement('a'); a.className='btn light'; a.dataset.arqPanel='1';
    a.href=type==='FORNECEDOR'?'ARQSELECT_DASHBOARD_FORNECEDOR.html':'ARQSELECT_DASHBOARD_ARQUITETO.html';
    a.textContent='Meu painel'; nav.insertBefore(a,nav.firstChild);
  }catch(e){console.warn('[ARQSELECT] navegação de perfil:',e)}
})();
</script>
