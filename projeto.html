<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070807">
  <meta name="description" content="Central do projeto ARQSELECT: arquivos, propostas, fornecedores, atividades e histórico.">
  <title>Central do projeto | ARQSELECT</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="arqselect-4.css">
  <style>.project-tabs{display:flex;gap:7px;overflow-x:auto;padding:6px 0 12px;scrollbar-width:none}.project-tabs::-webkit-scrollbar{display:none}.project-stage{display:grid;grid-template-columns:repeat(7,minmax(90px,1fr));gap:7px;overflow:auto;padding-bottom:5px}.project-stage span{padding:10px;border:1px solid var(--arq-line);border-radius:11px;text-align:center;color:var(--arq-muted);font-size:.76rem}.project-stage span.done{color:var(--arq-success);border-color:rgba(86,211,139,.28);background:rgba(86,211,139,.06)}.project-stage span.current{color:var(--arq-gold-2);border-color:var(--arq-line-strong);background:rgba(212,175,55,.1)}</style>
<script id="arq4-theme-boot">(()=>{const p=localStorage.getItem("ARQSELECT_THEME")||"dark";document.documentElement.dataset.theme=p==="auto"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):p})();</script></head>
<body>
  <header class="top" style="padding:15px max(4vw,18px);display:flex;justify-content:space-between;align-items:center;gap:14px;position:sticky;top:0;z-index:30"><a class="brand" href="index.html">ARQ<span>SELECT</span></a><nav class="nav"><a class="btn light" id="panel" href="portal.html">Dashboard</a><a class="btn light" href="chat.html">Chat</a><a class="btn light" href="atividades.html">Atividades</a></nav></header>
  <main class="arq4-shell">
    <section id="projectHead" class="hero" style="padding:30px;margin-bottom:18px"><div class="arq4-skeleton"></div></section>
    <section id="progress" class="arq4-card" style="margin-bottom:16px"></section>
    <nav class="project-tabs" aria-label="Seções do projeto">
      <button class="btn gold" data-tab="overview">Visão geral</button><button class="btn light" data-tab="suppliers">Fornecedores</button><button class="btn light" data-tab="products">Produtos</button><button class="btn light" data-tab="requests">Solicitações</button><button class="btn light" data-tab="proposals">Propostas</button><button class="btn light" data-tab="files">Arquivos</button><button class="btn light" data-tab="chat">Chat</button><button class="btn light" data-tab="timeline">Timeline</button><button class="btn light" data-tab="finance">Financeiro</button><button class="btn light" data-tab="history">Histórico</button>
    </nav>
    <section id="tabContent"><div class="arq4-card arq4-skeleton"></div></section>
  </main>
  <script src="arqselect-4.js"></script>
  <script>
  (()=>{
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const id=new URLSearchParams(location.search).get('id')||'',role=ARQSELECT4.role;
    const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    let project=null,proposals=[],conversations=[],activities=[],deals=[],tab='overview';
    if(!ARQSELECT4.token){location.href=role==='FORNECEDOR'?'ARQSELECT_LOGIN_FORNECEDOR.html':'ARQSELECT_LOGIN_ARQUITETO.html';return;}
    if(!id){location.href=role==='FORNECEDOR'?'ARQSELECT_FORNECEDOR_PROJETOS.html':'ARQSELECT_ARQUITETO_PROJETOS.html';return;}
    document.getElementById('panel').href=role==='ADMIN'?'admin.html':role==='FORNECEDOR'?'ARQSELECT_DASHBOARD_FORNECEDOR.html':'ARQSELECT_DASHBOARD_ARQUITETO.html';
    const date=v=>{const d=new Date(v);return isNaN(d)?String(v||'—'):d.toLocaleString('pt-BR',{dateStyle:'medium',timeStyle:'short'});};
    const empty=(title,text,action='')=>`<div class="arq4-card empty"><b>${esc(title)}</b><span>${esc(text)}</span>${action}</div>`;
    const links=value=>(Array.isArray(value)?value:[]).filter(Boolean);
    async function load(){const result=await Promise.all([ARQSELECT4.api('portal_projeto_detalhe',{id}),ARQSELECT4.api('portal_propostas'),ARQSELECT4.api('portal_conversas'),ARQSELECT4.api('arq4_atividades',{limite:200}),ARQSELECT4.api('arq4_financeiro')]);if(!result[0].sucesso){document.getElementById('projectHead').innerHTML=`<div class="empty"><b>Projeto indisponível.</b><span>${esc(result[0].mensagem||'Você não possui acesso a este projeto.')}</span><a class="btn light" href="${document.getElementById('panel').href}">Voltar ao painel</a></div>`;document.getElementById('progress').hidden=true;document.getElementById('tabContent').hidden=true;return;}project=result[0].projeto;proposals=(result[1].propostas||[]).filter(x=>String(x['PROJETO ID']||'')===id);conversations=(result[2].conversas||[]).filter(x=>String(x['PROJETO ID']||'')===id);activities=(result[3].atividades||[]).filter(x=>String(x.registroId||'')===id||String(x.descricao||'').includes(id));deals=(result[4].negocios||[]).filter(x=>String(x['PROJETO ID']||'')===id);renderHead();renderProgress();renderTab();}
    function renderHead(){document.title=(project.projeto||'Projeto')+' | ARQSELECT';document.getElementById('projectHead').innerHTML=`<div class="arq4-page-head" style="margin:0"><div><div class="ey">PROJETO ${esc(project.id)}</div><h1>${esc(project.projeto||'Projeto')}</h1><p class="muted">${esc([project.tipo,project.cidade,project.estado].filter(Boolean).join(' · '))}</p></div><div class="arq4-actions"><span class="badge">${esc(project.status||'Novo')}</span><button class="btn light" id="shareProject">Compartilhar</button><button class="btn gold" id="saveBoard">Salvar no board</button></div></div>`;document.getElementById('shareProject').onclick=()=>ARQSELECT4.shareCurrent(project.projeto);document.getElementById('saveBoard').onclick=()=>location.href=`boards.html?add=PROJETO&id=${encodeURIComponent(id)}&titulo=${encodeURIComponent(project.projeto||id)}&url=${encodeURIComponent(location.href)}`;}
    function renderProgress(){const stages=['Briefing','Fornecedores','Orçamentos','Negociação','Contratação','Execução','Conclusão'];const map={'NOVO':0,'EM ANÁLISE':0,'ORÇAMENTO':2,'PROPOSTA ENVIADA':2,'NEGOCIAÇÃO':3,'APROVAÇÃO':4,'FECHADO':4,'EM EXECUÇÃO':5,'CONCLUÍDO':6,'CANCELADO':0};const current=map[String(project.status||'NOVO').toUpperCase()]??0;document.getElementById('progress').innerHTML=`<div class="arq4-section-head"><div><div class="ey">PROGRESSO</div><h2>Etapas do projeto</h2></div><label>Status atual<select id="projectStatus">${['Novo','Em análise','Orçamento','Proposta enviada','Negociação','Aprovação','Fechado','Em execução','Concluído','Cancelado'].map(x=>`<option ${x===project.status?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="project-stage">${stages.map((x,i)=>`<span class="${i<current?'done':i===current?'current':''}">${i<current?'✓ ':i===current?'● ':''}${x}</span>`).join('')}</div>`;document.getElementById('projectStatus').onchange=async e=>{const j=await ARQSELECT4.api('portal_atualizar_status',{id,status:e.target.value});ARQSELECT4.notify(j.mensagem||'Status atualizado.');if(j.sucesso){project.status=e.target.value;renderProgress();renderHead();}};}
    function overview(){return `<div class="arq4-grid"><article class="arq4-card"><div class="stat-label">Área</div><div class="arq4-stat-value">${esc(project.area||'—')}</div><p class="muted">${esc(project.ambiente||'Ambiente não informado')}</p></article><article class="arq4-card"><div class="stat-label">Prazo</div><div class="arq4-stat-value">${esc(project.prazo||'—')}</div><p class="muted">Última interação: ${esc(date(project.ultimaInteracao))}</p></article><article class="arq4-card"><div class="stat-label">Investimento</div><div class="arq4-stat-value">${esc(project.investimento||'—')}</div><p class="muted">Faixa informada no briefing</p></article></div><article class="arq4-card arq4-section"><div class="ey">BRIEFING</div><h2>Necessidade do projeto</h2><p>${esc(project.descricao||'Descrição não informada.')}</p>${project.observacoes?`<div class="notice">${esc(project.observacoes)}</div>`:''}</article>`;}
    function suppliers(){return project.fornecedorNome||project.fornecedorEmail?`<article class="arq4-card"><span class="badge green">Vinculado ao projeto</span><h2>${esc(project.fornecedorNome||'Fornecedor')}</h2><p class="muted">${esc(project.fornecedorEmail||'Contato protegido')}</p>${project.respostaFornecedor?`<div class="notice"><b>Resposta registrada</b><p>${esc(project.respostaFornecedor)}</p></div>`:'<div class="empty">O fornecedor ainda não registrou uma resposta neste projeto.</div>'}</article>`:empty('Nenhum fornecedor vinculado','A ARQSELECT exibirá aqui os fornecedores direcionados ao projeto.');}
    function products(){const names=[...new Set(proposals.map(x=>x.PRODUTO).filter(Boolean))];return names.length?`<div class="arq4-grid">${names.map(name=>`<article class="arq4-card"><span class="badge">Produto citado</span><h3>${esc(name)}</h3><a class="btn light" href="explorar.html?q=${encodeURIComponent(name)}">Buscar no marketplace</a></article>`).join('')}</div>`:empty('Nenhum produto relacionado','Produtos presentes em solicitações e propostas aparecerão aqui.','<a class="btn gold" href="explorar.html">Explorar marketplace</a>');}
    function requests(){const rows=proposals.filter(x=>x['SOLICITACAO ID']);return rows.length?`<div class="table-wrap"><table><thead><tr><th>Solicitação</th><th>Produto</th><th>Fornecedor</th><th>Status</th><th>Data</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x['SOLICITACAO ID'])}</td><td>${esc(x.PRODUTO||'—')}</td><td>${esc(x['FORNECEDOR E-MAIL']||x['FORNECEDOR ID']||'—')}</td><td><span class="badge">${esc(x.STATUS||'—')}</span></td><td>${esc(date(x.DATA))}</td></tr>`).join('')}</tbody></table></div>`:empty('Nenhuma solicitação relacionada','As solicitações vinculadas ao projeto aparecerão aqui.');}
    function proposalView(){return proposals.length?`<div class="arq4-grid">${proposals.map(x=>`<article class="arq4-card"><div class="ey">${esc(x.ID)}</div><h3>${esc(x.PRODUTO||x['PROJETO NOME']||'Proposta')}</h3><p class="muted">${esc(x.CONDICAO||'Condição não informada')} · Prazo: ${esc(x.PRAZO||'—')}</p><div class="arq4-stat-value">${x['VALOR TOTAL']?brl(x['VALOR TOTAL']):'Valor não informado'}</div><span class="badge">${esc(x.STATUS||'—')}</span></article>`).join('')}</div>`:empty('Nenhuma proposta recebida','As propostas enviadas pelos fornecedores aparecerão nesta área.');}
    function files(){const all=[...links(project.arquivos).map(url=>({url,label:'Arquivo do projeto'})),...links(project.arquivosFornecedor).map(url=>({url,label:'Arquivo do fornecedor'}))];return all.length?`<div class="arq4-list">${all.map((x,i)=>`<a class="arq4-list-item" href="${esc(x.url)}" target="_blank" rel="noopener"><span class="arq4-list-icon">${i+1}</span><span><b>${esc(x.label)}</b><br><span class="muted">Abrir arquivo em nova guia</span></span><span class="badge">Abrir</span></a>`).join('')}</div>`:empty('Nenhum arquivo disponível','Anexos do briefing e propostas aparecerão aqui.');}
    function chat(){return conversations.length?`<div class="arq4-list">${conversations.map(x=>`<a class="arq4-list-item" href="chat.html?conversa=${encodeURIComponent(x.ID)}"><span class="arq4-list-icon">C</span><span><b>${esc(x['PARTICIPANTE A']||'Conversa')} ↔ ${esc(x['PARTICIPANTE B']||'ARQSELECT')}</b><br><span class="muted">${esc(x['ULTIMA MENSAGEM']||'Sem mensagens')} · ${esc(date(x['ULTIMA DATA']))}</span></span><span class="badge">Abrir chat</span></a>`).join('')}</div>`:empty('Nenhuma conversa vinculada','Inicie uma conversa com o projeto identificado para manter o histórico organizado.','<a class="btn gold" href="chat.html">Abrir chat</a>');}
    function timeline(){const rows=[{data:project.data,titulo:'Projeto criado',desc:project.descricao||'Briefing registrado'},{data:project.ultimaInteracao,titulo:'Última interação',desc:project.status},{data:project.dataResposta,titulo:'Resposta do fornecedor',desc:project.respostaFornecedor},...proposals.map(x=>({data:x.DATA,titulo:'Proposta '+x.ID,desc:x.STATUS})),...activities.map(x=>({data:x.data,titulo:x.titulo,desc:x.descricao}))].filter(x=>x.data).sort((a,b)=>new Date(b.data)-new Date(a.data));return rows.length?`<div class="arq4-list">${rows.map(x=>`<article class="arq4-list-item"><span class="arq4-list-icon">●</span><span><b>${esc(x.titulo)}</b><br><span class="muted">${esc(x.desc||'')} · ${esc(date(x.data))}</span></span></article>`).join('')}</div>`:empty('Histórico ainda vazio','As etapas reais do projeto serão organizadas nesta timeline.');}
    function finance(){return deals.length?`<div class="table-wrap"><table><thead><tr><th>Negócio</th><th>Valor</th><th>Comissão</th><th>Status</th><th>Pagamento</th></tr></thead><tbody>${deals.map(x=>`<tr><td>${esc(x.ID)}</td><td>${brl(x.VALOR)}</td><td>${Number(x['COMISSAO %']||0).toFixed(2)}% · ${brl(x['VALOR COMISSAO'])}</td><td>${esc(x.STATUS)}</td><td>${esc(x['PAGAMENTO STATUS']||'PENDENTE')}</td></tr>`).join('')}</tbody></table></div>`:empty('Nenhum negócio financeiro registrado','A área financeira recebe dados somente quando um negócio é efetivamente registrado.');}
    function history(){return activities.length?timeline():empty('Nenhum evento de auditoria encontrado','Ações relevantes relacionadas a este projeto aparecerão aqui.');}
    function renderTab(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('gold',b.dataset.tab===tab);b.classList.toggle('light',b.dataset.tab!==tab);});const views={overview,suppliers,products,requests,proposals:proposalView,files,chat,timeline,finance,history};document.getElementById('tabContent').innerHTML=(views[tab]||overview)();}
    document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderTab();});load();
  })();
  </script>
</body></html>
