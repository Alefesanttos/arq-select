<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/responsive.css"><script src="js/app.js"></script></head><body><div class="app"><aside class="sidebar"><div class="brand">ARQSELECT</div><nav class="nav"><a href="dashboard-arquiteto.html">Dashboard</a><a href="projeto.html">Projeto</a><a href="solicitacao.html">Solicitação</a><a href="proposta.html">Proposta</a><a href="fornecedor.html">Fornecedor</a><a href="mensagens.html">Mensagens</a><a href="notificacoes.html">Notificações</a><a href="#" data-logout>Sair</a></nav></aside><main class="main"><h1 id="t" class="title">Projeto</h1><p id="s" class="muted"></p><section id="v" class="card">Carregando...</section></main></div><script src="js/projeto.js"></script><script>const a=layout('Projeto');if(a&&qs.get('id'))loadProjectV2(qs.get('id')).then(r=>{if(!r.sucesso)throw Error(r.mensagem);const p=r.projeto;t.textContent=p['NOME DO PROJETO']||p.NOME||qs.get('id');s.textContent=p['ID PROJETO']||qs.get('id');v.innerHTML=`<div class="grid"><div><b>Arquiteto</b><div>${esc(p.ARQUITETO)}</div></div><div><b>Cliente</b><div>${esc(p.CLIENTE)}</div></div><div><b>Status</b><div><span class="badge">${esc(p.STATUS)}</span></div></div><div><b>Local</b><div>${esc((p.CIDADE||'')+' '+(p.ESTADO||''))}</div></div></div><hr><h3>Solicitações</h3>${(p.solicitacoes||[]).map(x=>`<div class="card"><b>${x.ID}</b> ${esc(x.CATEGORIA)} — ${esc(x.PRODUTO)} <span class="badge">${esc(x.STATUS)}</span></div>`).join('')||'<div class="empty">Nenhuma solicitação.</div>'}<h3>Timeline</h3><div class="timeline">${(p.timeline||[]).map(x=>`<div class="timeline-item"><b>${esc(x.ACAO)}</b><div>${esc(x.DESCRICAO)}</div><small>${new Date(x.DATA).toLocaleString('pt-BR')}</small></div>`).join('')||'<div class="empty">Sem histórico.</div>'}</div>`}).catch(e=>{v.textContent=e.message;toast(e.message)})</script></body></html>
