<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="global.css"><link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="forms.css"><link rel="stylesheet" href="responsive.css"><script src="app.js"></script></head><body><div class="app"><aside class="sidebar"><div class="brand">ARQSELECT</div><nav class="nav"><a href="dashboard-arquiteto.html">Dashboard</a><a href="projeto.html">Projeto</a><a href="solicitacao.html">Solicitação</a><a href="proposta.html">Proposta</a><a href="fornecedor.html">Fornecedor</a><a href="mensagens.html">Mensagens</a><a href="notificacoes.html">Notificações</a><a href="#" data-logout>Sair</a></nav></aside><main class="main"><h1 class="title">Proposta</h1><section id="v" class="card">Carregando...</section></main></div><script src="proposta.js"></script><script>const a=layout('Proposta');if(a&&qs.get('id'))loadProposalV2(qs.get('id')).then(r=>{if(!r.sucesso)throw Error(r.mensagem);const p=r.proposta;v.innerHTML=`<div class="grid"><div><b>Valor total</b><div class="metric">${fmtBRL(p.VALOR_TOTAL)}</div></div><div><b>Status</b><div><span class="badge">${p.STATUS}</span></div></div><div><b>Prazo</b><div>${esc(p.PRAZO)}</div></div><div><b>Pagamento</b><div>${esc(p.PAGAMENTO)}</div></div></div><hr><p>${esc(p.OBSERVACOES)}</p>`}).catch(e=>v.textContent=e.message)</script></body></html>
