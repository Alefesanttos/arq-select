<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARQSELECT | Propostas</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#080808;color:#f5f2e9;background-image:radial-gradient(circle at 10% 0%,rgba(212,175,55,.07),transparent 30%),linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);background-size:auto,28px 28px,28px 28px}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:15px;align-items:center;padding:16px max(20px,calc((100vw - 1220px)/2));background:rgba(7,7,7,.9);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(16px)}.brand{font-size:21px;font-weight:950;letter-spacing:.1em}.brand span,.ey{color:#e0c15d}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid rgba(255,255,255,.1);background:#171717;color:#f5f2e9;border-radius:11px;padding:10px 14px;text-decoration:none;font-weight:800;cursor:pointer}.gold{background:linear-gradient(135deg,#f0d77a,#d4af37);color:#171208;border:0}.wrap{max-width:1220px;margin:0 auto;padding:32px 20px 70px}.hero{padding:30px 0}.hero h1{font-size:clamp(30px,4vw,48px);margin:8px 0}.muted{color:#aaa49a}.card{background:linear-gradient(145deg,#181818,#0e0e0e);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:19px;box-shadow:0 22px 60px rgba(0,0,0,.24)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.item{padding:16px;border-bottom:1px solid rgba(255,255,255,.07)}.item:last-child{border-bottom:0}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:rgba(212,175,55,.12);color:#f0d77a;font-size:11px;font-weight:900}.input,input,select,textarea{width:100%;background:#121212;color:#f5f2e9;border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:12px;margin-top:6px}label{display:block;margin:10px 0;font-size:12px;color:#c8c3b9;font-weight:800}.empty{text-align:center;padding:35px;color:#aaa49a}.stars{color:#e0c15d;letter-spacing:.08em}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{padding:12px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;font-size:13px}.table th{color:#f0d77a}.toast{position:fixed;right:20px;bottom:20px;background:#1d1d1d;border:1px solid rgba(212,175,55,.25);padding:13px 16px;border-radius:12px;display:none;z-index:20}.toast.show{display:block}@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.nav{overflow:auto;max-width:100%;flex-wrap:nowrap}.wrap{padding-top:20px}}</style></head><body><header class="top"><a class="brand" href="index.html">ARQ<span>SELECT</span></a><nav class="nav"><a class="btn" href="explorar.html">Marketplace</a><a class="btn" href="oportunidades.html">Oportunidades</a><a class="btn" href="propostas-portal.html">Propostas</a><a class="btn" href="chat.html">Chat</a><a class="btn" href="avaliacoes.html">Avaliações</a><a class="btn" href="ranking.html">Ranking</a><a class="btn" href="favoritos.html">Favoritos</a><a class="btn" href="suporte.html">Ajuda</a></nav></header><main class="wrap"><section class="hero"><div class="ey">ARQSELECT PREMIUM</div><h1>Propostas</h1><p class="muted">Analise, compare e acompanhe propostas ligadas aos seus projetos e oportunidades.</p></section><section id="app" class="card"><div class="empty">Carregando propostas...</div></section></main><div id="toast" class="toast"></div><script>const API='https://script.google.com/macros/s/AKfycbz_jLzNa87U_himraaCczzqGpQdq63AyIVogQ9-YGnqXuQYl3OSJfV4E7xYfPdnv8-d/exec',token=localStorage.getItem('ARQSELECT_PORTAL_TOKEN'),type=(localStorage.getItem('ARQSELECT_PORTAL_TIPO')||'').toUpperCase(),uid=localStorage.getItem('ARQSELECT_PORTAL_ID')||'';const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function get(p){const u=new URL(API);Object.entries(p).forEach(([k,v])=>{if(v!==undefined&&v!==null)u.searchParams.set(k,v)});const r=await fetch(u,{cache:'no-store'});const t=await r.text();try{return JSON.parse(t)}catch(e){throw Error('Resposta inválida do servidor.')}}async function post(p){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});return r.json()}function auth(){if(!token){location.href=type==='FORNECEDOR'?'ARQSELECT_LOGIN_FORNECEDOR.html':'ARQSELECT_LOGIN_ARQUITETO.html';return false}return true}function toast(t){const e=$('toast');if(!e)return;e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}function money(v){const n=Number(v||0);return isFinite(n)?n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'—'}async function load(){if(!auth())return;try{const j=await get({acao:'portal_propostas',token});if(!j.sucesso)throw Error(j.mensagem);const rows=j.propostas||[];$('app').innerHTML=rows.length?rows.map(p=>`<article class="item"><div class="row between"><div><div class="ey">${esc(p.ID)}</div><h3>${esc(p.PRODUTO||p['PROJETO ID']||'Proposta')}</h3></div><span class="badge">${esc(p.STATUS)}</span></div><div class="grid"><div><span class="muted">Valor total</span><h3>${money(p['VALOR TOTAL'])}</h3></div><div><span class="muted">Prazo</span><h3>${esc(p.PRAZO||'—')}</h3></div><div><span class="muted">Validade</span><h3>${esc(p.VALIDADE||'—')}</h3></div></div><p class="muted">${esc(p['CONDICAO PAGAMENTO']||p.OBSERVACOES||'')}</p>${type==='ARQUITETO'?`<div class="row"><button class="btn gold" onclick="statusP('${esc(p.ID)}','ACEITA')">Aceitar</button><button class="btn" onclick="statusP('${esc(p.ID)}','NEGOCIAÇÃO')">Negociar</button><button class="btn" onclick="statusP('${esc(p.ID)}','SOLICITAR ALTERAÇÃO')">Solicitar alteração</button><button class="btn" onclick="statusP('${esc(p.ID)}','RECUSADA')">Recusar</button><a class="btn" href="chat.html">Conversar</a></div>`:'<a class="btn" href="chat.html">Abrir conversa</a>'}</article>`).join(''):'<div class="empty">Nenhuma proposta encontrada.</div>'}catch(e){$('app').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}async function statusP(id,status){if(!confirm('Atualizar proposta para '+status+'?'))return;const j=await post({acao:'portal_proposta_status',token,id,status});toast(j.mensagem||'Proposta atualizada.');if(j.sucesso)load()}load();</script></body></html>
