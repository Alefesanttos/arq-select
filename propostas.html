<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Propostas | ARQSELECT</title><link rel="stylesheet" href="portal-3.css"><script id="arq4-theme-boot">(()=>{const p=localStorage.getItem("ARQSELECT_THEME")||"dark";document.documentElement.dataset.theme=p==="auto"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):p})();</script><meta name="theme-color" content="#070807"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="arqselect-4.css"></head><body><header class="top"><a class="brand" href="index.html">ARQ<span>SELECT</span></a><nav class="nav"><a class="btn" data-panel href="portal.html">Meu painel</a><a class="btn" href="chat.html">Chat</a><a class="btn" href="avaliacoes.html">Avaliações</a></nav></header><main class="wrap"><section class="hero"><div class="ey">NEGOCIAÇÃO ORGANIZADA</div><h1>Propostas e oportunidades</h1><p class="muted">Valores, prazos, condições, validade e status reunidos no histórico da ARQSELECT.</p></section><section id="proposals" class="list"><div class="card empty">Carregando…</div></section></main><script src="portal-3.js"></script><script>
if(arq3Auth())loadProposals();async function loadProposals(){const data=await arq3Api("portal_propostas");const rows=data.propostas||[];arq3("proposals").innerHTML=rows.length?rows.map(x=>`<article class="card"><div class="toolbar"><div><span class="badge">${arq3Esc(x.TIPO_REGISTRO||"PROPOSTA")}</span><h3>${arq3Esc(x["PROJETO NOME"]||x.PRODUTO||x["PROJETO ID"]||x.ID)}</h3></div><div class="score">${Number(x["VALOR TOTAL"]||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</div></div><div class="grid"><div><b>Prazo</b><div class="muted">${arq3Esc(x.PRAZO||"—")}</div></div><div><b>Validade</b><div class="muted">${arq3Esc(x.VALIDADE||"—")}</div></div><div><b>Status</b><div class="status">${arq3Esc(x.STATUS||"—")}</div></div></div><p class="muted">${arq3Esc(x.CONDICAO||x.OBSERVACOES||"")}</p></article>`).join(""):'<div class="card empty">Nenhuma proposta disponível.</div>'}
</script><script src="arqselect-4.js"></script></body></html>
