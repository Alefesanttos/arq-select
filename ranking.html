<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Ranking profissional ARQSELECT baseado em avaliações, conclusão, resposta e histórico."><title>Ranking profissional | ARQSELECT</title><link rel="stylesheet" href="portal-3.css"><script id="arq4-theme-boot">(()=>{const p=localStorage.getItem("ARQSELECT_THEME")||"dark";document.documentElement.dataset.theme=p==="auto"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):p})();</script><meta name="theme-color" content="#070807"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="arqselect-4.css"></head><body><header class="top"><a class="brand" href="index.html">ARQ<span>SELECT</span></a><nav class="nav"><a class="btn" href="explorar.html">Marketplace</a><a class="btn" href="conexoes.html">Conexões</a><a class="btn" data-panel href="portal.html">Meu painel</a></nav></header><main class="wrap"><section class="hero"><div class="ey">REPUTAÇÃO TRANSPARENTE</div><h1>Ranking profissional ARQSELECT</h1><p class="muted">A pontuação combina qualidade, projetos concluídos, participação, resposta e histórico na plataforma. Nenhuma avaliação isolada define uma reputação.</p></section><div class="toolbar"><div><button class="btn gold" data-type="FORNECEDOR">Fornecedores</button> <button class="btn" data-type="ARQUITETO">Arquitetos</button></div><span id="method" class="muted"></span></div><section id="ranking" class="list"><div class="card empty">Carregando ranking…</div></section></main><script src="portal-3.js"></script><script>
async function loadRanking(type="FORNECEDOR"){document.querySelectorAll("[data-type]").forEach(b=>b.classList.toggle("gold",b.dataset.type===type));const data=await arq3Api("portal_rankings",{tipo:type});arq3("method").textContent=data.metodologia||"";const rows=data.ranking||[];arq3("ranking").innerHTML=rows.length?rows.map(item=>`<article class="row"><div class="position">${item.posicao}º</div><div><h3 style="margin:0"><a href="${type==="FORNECEDOR"?"fornecedor":"arquiteto"}.html?id=${encodeURIComponent(item.id)}">${arq3Esc(item.nome)}</a></h3><div class="muted">${item.projetosConcluidos} projeto(s) concluído(s) · ${item.avaliacoes} avaliação(ões) · ${item.taxaResposta}% de resposta/participação</div><div style="margin-top:7px">${(item.selos||[]).map(s=>`<span class="badge">${arq3Esc(s)}</span>`).join(" ")}</div></div><div><div class="score">${Number(item.pontuacao||0).toFixed(1)}</div><div class="muted">Nota ${Number(item.nota||0).toFixed(1)}/5</div></div></article>`).join(""):'<div class="card empty">O ranking será exibido quando houver histórico suficiente.</div>'}
document.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>loadRanking(b.dataset.type));loadRanking();
</script><script src="arqselect-4.js"></script></body></html>
