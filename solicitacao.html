<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="global.css"><link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="forms.css"><link rel="stylesheet" href="responsive.css"><script src="app.js"></script></head><body><div class="app"><aside class="sidebar"><div class="brand">ARQSELECT</div><nav class="nav"><a href="dashboard-arquiteto.html">Dashboard</a><a href="projeto.html">Projeto</a><a href="solicitacao.html">Solicitação</a><a href="proposta.html">Proposta</a><a href="fornecedor.html">Fornecedor</a><a href="mensagens.html">Mensagens</a><a href="notificacoes.html">Notificações</a><a href="#" data-logout>Sair</a></nav></aside><main class="main"><h1 class="title">Solicitação</h1><section id="v" class="card">Carregando...</section></main></div><script src="solicitacao.js"></script><script>const a=layout('Solicitação');if(a&&qs.get('id'))loadRequestV2(qs.get('id')).then(r=>{if(!r.sucesso)throw Error(r.mensagem);const x=r.solicitacao;v.innerHTML=`<div class="grid"><div><b>ID</b><div>${x.ID}</div></div><div><b>Status</b><div><span class="badge">${x.STATUS}</span></div></div><div><b>Categoria</b><div>${esc(x.CATEGORIA)}</div></div><div><b>Produto</b><div>${esc(x.PRODUTO)}</div></div></div><p>${esc(x.DESCRICAO)}</p><h3>Propostas</h3>${(x.propostas||[]).map(p=>`<div class="card"><b>${p.ID}</b> — ${fmtBRL(p.VALOR_TOTAL)} <span class="badge">${p.STATUS}</span></div>`).join('')||'<div class="empty">Nenhuma proposta.</div>'}`}).catch(e=>v.textContent=e.message)</script></body></html>
