  <script src="arqselect-4.js"></script><script>(()=>{const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function check(){document.getElementById('summary').innerHTML='<div class="arq4-skeleton"></div>';const start=performance.now();const results=await Promise.all([ARQSELECT4.api('backend_build'),ARQSELECT4.api('teste'),ARQSELECT4.api('arq4_public_stats')]);const latency=Math.round(performance.now()-start);const services=[{name:'Backend ARQSELECT',ok:results[0].sucesso,detail:results[0].build||results[0].mensagem},{name:'API pública',ok:results[1].sucesso,detail:results[1].mensagem||'Resposta recebida'},{name:'Dados do marketplace',ok:results[2].sucesso,detail:results[2].sucesso?'Leitura disponível':results[2].mensagem}];const all=services.every(x=>x.ok);document.getElementById('summary').innerHTML=`<div class="arq4-section-head"><div><div class="ey">${all?'OPERACIONAL':'ATENÇÃO'}</div><h2>${all?'Todos os serviços verificados estão operacionais.':'Um ou mais serviços precisam de verificação.'}</h2></div><span class="badge ${all?'green':'red'}">${all?'Online':'Instabilidade'}</span></div><p class="muted">Tempo total da verificação: ${latency} ms.</p>`;document.getElementById('services').innerHTML=services.map(s=>`<article class="arq4-card"><span class="badge ${s.ok?'green':'red'}">${s.ok?'Operacional':'Indisponível'}</span><h3>${esc(s.name)}</h3><p class="muted">${esc(s.detail||'Sem resposta')}</p></article>`).join('');document.getElementById('checked').textContent='Última verificação: '+new Date().toLocaleString('pt-BR');}document.getElementById('refresh').onclick=check;check();})();</script>
