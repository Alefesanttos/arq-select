<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central de ajuda | ARQSELECT</title><link rel="stylesheet" href="portal-3.css"></head><body><header class="top"><a class="brand" href="index.html">ARQ<span>SELECT</span></a><nav class="nav"><a class="btn" data-panel href="portal.html">Meu painel</a><a class="btn" href="notificacoes.html">Notificações</a><a class="btn" href="chat.html">Chat</a></nav></header><main class="wrap"><section class="hero"><div class="ey">CENTRAL DE AJUDA</div><h1>Suporte ARQSELECT</h1><p class="muted">Abra e acompanhe solicitações sobre cadastro, projetos, propostas, marketplace, comissão, segurança e conta.</p></section><div class="grid two"><section class="card"><h2>Novo chamado</h2><form id="ticket"><div class="form-grid"><label>Categoria<select name="categoria"><option>Cadastro</option><option>Projetos</option><option>Propostas</option><option>Marketplace</option><option>Comissão</option><option>Chat</option><option>Segurança</option><option>Conta</option></select></label><label>Prioridade<select name="prioridade"><option>NORMAL</option><option>ALTA</option><option>URGENTE</option></select></label><label class="full">Assunto<input name="assunto" required></label><label class="full">Descrição<textarea name="descricao" required></textarea></label></div><button class="btn gold" type="submit">Abrir chamado</button></form></section><section><h2>Meus chamados</h2><div id="tickets" class="list"><div class="card empty">Carregando…</div></div></section></div></main><div id="toast" class="toast"></div><script src="portal-3.js"></script><script>
if(arq3Auth())loadTickets();async function loadTickets(){const data=await arq3Api("portal_suporte");const rows=data.tickets||[];arq3("tickets").innerHTML=rows.length?rows.map(x=>`<article class="card"><div class="toolbar"><b>${arq3Esc(x.ASSUNTO)}</b><span class="badge">${arq3Esc(x.STATUS)}</span></div><p class="muted">${arq3Esc(x.DESCRICAO)}</p>${x.RESPOSTA?`<p><b>Resposta ARQSELECT:</b><br>${arq3Esc(x.RESPOSTA)}</p>`:""}<small class="muted">${arq3Esc(x.ID)} · ${arq3Esc(x["ULTIMA INTERACAO"]||x.DATA)}</small></article>`).join(""):'<div class="card empty">Nenhum chamado aberto.</div>'}arq3("ticket").onsubmit=async event=>{event.preventDefault();const response=await arq3Api("portal_ticket_criar",Object.fromEntries(new FormData(event.currentTarget).entries()),"POST");arq3Toast(response.mensagem||"Chamado enviado.");if(response.sucesso){event.currentTarget.reset();loadTickets()}};
</script></body></html>
