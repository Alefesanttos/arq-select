<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARQSELECT | Termos de Intermediação</title><style>body{margin:0;background:#0b0d0f;color:#f4f1ea;font-family:Inter,Arial,sans-serif}.shell{max-width:900px;margin:40px auto;padding:20px}.card{background:linear-gradient(145deg,#171a1d,#0f1113);border:1px solid #34383d;border-radius:22px;padding:28px;box-shadow:0 20px 60px #0006}.ey{letter-spacing:.18em;color:#d6b96b;font-size:12px;text-transform:uppercase}.muted{color:#9aa1a8}.terms{white-space:pre-wrap;line-height:1.7;max-height:55vh;overflow:auto;background:#0a0b0d;border:1px solid #2a2e33;padding:18px;border-radius:14px}.row{display:flex;gap:12px;align-items:center;margin-top:18px}.btn{border:0;border-radius:13px;padding:13px 18px;font-weight:800;cursor:pointer}.gold{background:#d6b96b;color:#111}.light{background:#24282d;color:#eee}</style></head><body><main class="shell"><div class="ey">ARQSELECT</div><h1>Termos de Parceria e Intermediação</h1><p class="muted">Leia os termos apresentados para a oportunidade e faça o aceite eletrônico somente se estiver de acordo.</p><div class="card"><div id="status">Carregando...</div><div id="box" class="terms" style="margin-top:14px">Carregando termos...</div><div class="row"><label><input id="aceite" type="checkbox"> Li e concordo expressamente com os termos apresentados para esta oportunidade.</label></div><div class="row"><button class="btn gold" onclick="aceitar()">ACEITAR TERMOS</button><button class="btn light" onclick="history.back()">Voltar</button></div><div id="msg" class="muted" style="margin-top:14px"></div></div></main><script>const API='https://script.google.com/macros/s/AKfycbz_jLzNa87U_himraaCczzqGpQdq63AyIVogQ9-YGnqXuQYl3OSJfV4E7xYfPdnv8-d/exec',token=localStorage.getItem('ARQSELECT_PORTAL_TOKEN'),oportunidadeId=new URLSearchParams(location.search).get('oportunidadeId');async function get(p){const u=new URL(API);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));return fetch(u,{cache:'no-store'}).then(r=>r.json())}async function load(){if(!token||!oportunidadeId){document.getElementById('msg').textContent='Sessão ou oportunidade inválida.';return}const d=await get({acao:'portal_comercial_termos',token,oportunidadeId});if(!d.sucesso){document.getElementById('msg').textContent=d.mensagem||'Não foi possível carregar os termos.';return}document.getElementById('status').textContent=(d.termo?.TITULO||'Termos ARQSELECT')+' • Versão '+(d.termo?.VERSAO||'');document.getElementById('box').textContent=d.termo?.CONTEUDO||''}async function aceitar(){if(!document.getElementById('aceite').checked){document.getElementById('msg').textContent='Marque o aceite expresso antes de continuar.';return}const d=await get({acao:'portal_comercial_aceite',token,oportunidadeId,aceite:'SIM'});document.getElementById('msg').textContent=d.mensagem||(d.sucesso?'Aceite registrado.':'Não foi possível registrar o aceite.');if(d.sucesso)setTimeout(()=>history.back(),800)}load();</script></body></html>
