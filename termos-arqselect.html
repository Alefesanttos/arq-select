</head><body data-arq-page="generic" data-arq-surface="content"><main class="shell"><div class="ey">ARQSELECT</div><h1>Termos de Parceria e Intermediação</h1><p class="muted">Leia os termos apresentados para a oportunidade e faça o aceite eletrônico somente se estiver de acordo.</p><div class="card"><div id="status">Carregando...</div><div id="box" class="terms arq-inline-d6f2af6e0">Carregando termos...</div><div class="row"><label><input id="aceite" type="checkbox"> Li e concordo expressamente com os termos apresentados para esta oportunidade.</label></div><div class="row"><button class="btn gold" onclick="aceitar()">ACEITAR TERMOS</button><button class="btn light" onclick="history.back()">Voltar</button></div><div id="msg" class="muted arq-inline-d6f2af6e0"></div></div></main><script>const API=(window.ARQSELECT_API_URL||window.ARQSELECT_CONFIG.apiUrl),token=localStorage.getItem('ARQSELECT_PORTAL_TOKEN'),oportunidadeId=new URLSearchParams(location.search).get('oportunidadeId');async function get(p){const u=new URL(API);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));return fetch(u,{cache:'no-store'}).then(r=>r.json())}async function load(){if(!token||!oportunidadeId){document.getElementById('msg').textContent='Sessão ou oportunidade inválida.';return}const d=await get({acao:'portal_comercial_termos',token,oportunidadeId});if(!d.sucesso){document.getElementById('msg').textContent=d.mensagem||'Não foi possível carregar os termos.';return}document.getElementById('status').textContent=(d.termo?.TITULO||'Termos ARQSELECT')+' • Versão '+(d.termo?.VERSAO||'');document.getElementById('box').textContent=d.termo?.CONTEUDO||''}async function aceitar(){if(!document.getElementById('aceite').checked){document.getElementById('msg').textContent='Marque o aceite expresso antes de continuar.';return}const d=await get({acao:'portal_comercial_aceite',token,oportunidadeId,aceite:'SIM'});document.getElementById('msg').textContent=d.mensagem||(d.sucesso?'Aceite registrado.':'Não foi possível registrar o aceite.');if(d.sucesso)setTimeout(()=>history.back(),800)}load();</script><script src="arqselect-4.js"></script><script src="arq-premium.js?v=6.0.0"></script>
