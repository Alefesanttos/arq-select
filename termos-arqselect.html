<style id="arqselect-global-premium">:root{--arq-bg:#080808;--arq-surface:#131313;--arq-surface2:#1a1a1a;--arq-text:#f5f2e9;--arq-muted:#aaa49a;--arq-gold:#d4af37;--arq-gold2:#f0d77a;--arq-line:rgba(255,255,255,.09);--arq-shadow:0 22px 60px rgba(0,0,0,.34)}html,body{background:var(--arq-bg)!important;color:var(--arq-text)!important}body{background-image:radial-gradient(circle at 10% 0%,rgba(212,175,55,.07),transparent 32%),radial-gradient(circle at 90% 100%,rgba(255,255,255,.03),transparent 34%),linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px)!important;background-size:auto,auto,28px 28px,28px 28px!important}body *{color:inherit}main,.wrap,.content,.shell,.page,.container{color:var(--arq-text)}a{color:inherit}input,select,textarea{background:rgba(255,255,255,.055)!important;color:var(--arq-text)!important;border-color:var(--arq-line)!important}select option{background:#161616!important;color:#f5f2e9!important}button{color:inherit}.card,.panel,.box,.tile,.item,.list,.table,.table-wrap,.product,.profile,.stat,.metric,.notice,.sheet,.conversation,.hero-card,.feature-card,.post,.opportunity,.profile-card,.request-card,.proposal-card,.login-card,.auth-card{background:linear-gradient(145deg,rgba(24,24,24,.98),rgba(12,12,12,.95))!important;border-color:var(--arq-line)!important;color:var(--arq-text)!important;box-shadow:var(--arq-shadow)!important}.muted,.small,.hint,.subtle,.meta{color:var(--arq-muted)!important}.nav,.top,.header,.navbar{background:rgba(7,7,7,.88)!important;border-color:var(--arq-line)!important;backdrop-filter:blur(16px)}th{background:rgba(212,175,55,.07)!important;color:var(--arq-gold2)!important}td{border-color:var(--arq-line)!important}.modalbox,.modal-card,.modal-content,.dialog,.dropdown,.menu,.sheet-content{background:#151515!important;color:var(--arq-text)!important;border-color:var(--arq-line)!important}.empty{color:var(--arq-muted)!important}.btn.light,.btn:not(.gold),.button{background:rgba(255,255,255,.06)!important;color:var(--arq-text)!important;border-color:var(--arq-line)!important}.btn.gold,.gold,.primary,.btn-primary{background:linear-gradient(135deg,var(--arq-gold2),var(--arq-gold))!important;color:#171208!important}.arq-whatsapp,.wa-float{background:linear-gradient(135deg,#25d366,#16a34a)!important;color:#fff!important}.arq-whatsapp svg,.wa-float svg{fill:currentColor;width:22px;height:22px}@media(max-width:760px){.card,.panel,.box{border-radius:16px!important}}</style></head><body><main class="shell"><div class="ey">ARQSELECT</div><h1>Termos de Parceria e Intermediação</h1><p class="muted">Leia os termos apresentados para a oportunidade e faça o aceite eletrônico somente se estiver de acordo.</p><div class="card"><div id="status">Carregando...</div><div id="box" class="terms" style="margin-top:14px">Carregando termos...</div><div class="row"><label><input id="aceite" type="checkbox"> Li e concordo expressamente com os termos apresentados para esta oportunidade.</label></div><div class="row"><button class="btn gold" onclick="aceitar()">ACEITAR TERMOS</button><button class="btn light" onclick="history.back()">Voltar</button></div><div id="msg" class="muted" style="margin-top:14px"></div></div></main><script>const API='https://script.google.com/macros/s/AKfycbz_jLzNa87U_himraaCczzqGpQdq63AyIVogQ9-YGnqXuQYl3OSJfV4E7xYfPdnv8-d/exec',token=localStorage.getItem('ARQSELECT_PORTAL_TOKEN'),oportunidadeId=new URLSearchParams(location.search).get('oportunidadeId');async function get(p){const u=new URL(API);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));return fetch(u,{cache:'no-store'}).then(r=>r.json())}async function load(){if(!token||!oportunidadeId){document.getElementById('msg').textContent='Sessão ou oportunidade inválida.';return}const d=await get({acao:'portal_comercial_termos',token,oportunidadeId});if(!d.sucesso){document.getElementById('msg').textContent=d.mensagem||'Não foi possível carregar os termos.';return}document.getElementById('status').textContent=(d.termo?.TITULO||'Termos ARQSELECT')+' • Versão '+(d.termo?.VERSAO||'');document.getElementById('box').textContent=d.termo?.CONTEUDO||''}async function aceitar(){if(!document.getElementById('aceite').checked){document.getElementById('msg').textContent='Marque o aceite expresso antes de continuar.';return}const d=await get({acao:'portal_comercial_aceite',token,oportunidadeId,aceite:'SIM'});document.getElementById('msg').textContent=d.mensagem||(d.sucesso?'Aceite registrado.':'Não foi possível registrar o aceite.');if(d.sucesso)setTimeout(()=>history.back(),800)}load();</script></body></html>
